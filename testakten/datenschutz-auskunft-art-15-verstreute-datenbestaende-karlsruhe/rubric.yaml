name: datenschutz-auskunft-art-15-verstreute-datenbestaende-karlsruhe
plugin: "datenschutzrecht"
description: 'Auskunftsverlangen eines ehemaligen Vertriebsmitarbeiters nach Artikel 15 DSGVO gegen ein Karlsruher
  Softwarehaus zur Vorbereitung eines Kuendigungsschutz-Folgeprozesses. Prueffragen: Umfang des Auskunfts- und Kopieanspruchs
  nach Artikel 15 Absatz 1 und 3 DSGVO, Behandlung von Beurteilungen, Vermerken und E-Mails ueber den Betroffenen,
  Grenzen aus Rechten Dritter nach Artikel 15 Absatz 4 DSGVO, Exzess-Einwand nach Artikel 12 Absatz 5 DSGVO. Der
  Umfang ist aus verstreuten System-Verzeichnissen zu bestimmen.'
checks:
  - id: datei-01-auskunftsverlangen-anwaltsschreiben-2026-03-06
    check_type: file_exists
    description: Das Primäraktenstück 01_auskunftsverlangen_anwaltsschreiben_2026-03-06.docx ist für die Fallauswertung
      vorhanden.
    path: 01_auskunftsverlangen_anwaltsschreiben_2026-03-06.docx
  - id: datei-02-interner-suchauftrag-2026-03-12
    check_type: file_exists
    description: Das Primäraktenstück 02_interner_suchauftrag_2026-03-12.docx ist für die Fallauswertung vorhanden.
    path: 02_interner_suchauftrag_2026-03-12.docx
  - id: p01-umfang-aus-verzeichnissen
    check_type: human_review
    description: Aus CRM-Export, HR-Aktenverzeichnis, E-Mail-Trefferliste, Ticketliste und Backup-Vermerk muss selbststaendig
      bestimmt werden, welche Daten auskunfts- und kopiepflichtig sind.
  - id: p02-fehlende-kategorien-abgleich
    check_type: human_review
    description: Die erteilte Auskunft muss gegen die Verzeichnisse abgeglichen und die fehlenden Kategorien identifiziert
      werden.
  - id: p03-diskrepanz-vollstaendigkeit
    check_type: human_review
    description: Der Widerspruch zwischen der Erklaerung der Vollstaendigkeit und der Aktenlage muss benannt werden.
  - id: p04-rechte-dritter-schwaerzung
    check_type: human_review
    description: Die Grenzen aus Artikel 15 Absatz 4 DSGVO muessen zutreffend angewendet werden.
  - id: p05-exzess-und-motiv
    check_type: human_review
    description: Der Exzess-Einwand und die Bedeutung des Prozessvorbereitungs-Motivs muessen gewuerdigt werden.
  - id: p06-schadensersatz-art82
    check_type: human_review
    description: Der Anspruch auf immateriellen Schadensersatz nach Artikel 82 DSGVO und das Verschulden muessen
      geprueft werden.
