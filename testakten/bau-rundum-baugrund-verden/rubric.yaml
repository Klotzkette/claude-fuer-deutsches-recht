name: bau-rundum-baugrund-verden
plugin: bauwirtschaft-anfaenger
author: Klotzkette
description: "Dreiseitiger geotechnischer Kurzbericht mit zweitseitiger Ergänzung, Feldbelegen, Laborwerten und geändertem Laststand. Kennwerte, Einheiten und räumliche Geltungsgrenzen erfordern projektbezogene Ingenieurprüfung."
checks:
  - id: fachpruefung-1
    check_type: human_review
    description: "Anforderungsliste mit Bericht/Ergänzung, Seite, Abschnitt und Tabellenbezug erstellen; tatsächlicher Umfang drei plus zwei Seiten statt erfundener 80 Seiten."
  - id: fachpruefung-2
    check_type: human_review
    description: "Wasserannahme 19,30/19,60 m von Beobachtung 19,08 m trennen, örtliche Höhen nicht als NHN deklarieren und Rohrkopfversatz 0,30 m beachten."
  - id: fachpruefung-3
    check_type: human_review
    description: "Charakteristische Lasten und Kennwerte nicht als fertige Bemessungswiderstände ausgeben; MN/m², MN/m³, kN/m², kN und m/s sauber unterscheiden."
  - id: fachpruefung-4
    check_type: human_review
    description: "Östlichen Schluff, neue Sonderlasten, fehlende chemische Untersuchung und dynamische Angaben projektspezifisch berücksichtigen; Ingenieurprüfung und keine Ausführungsfreigabe."
  - id: original-01
    check_type: file_exists
