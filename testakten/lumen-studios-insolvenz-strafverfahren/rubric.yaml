# Strukturelle Baseline-Rubrik. Fallbezogene Inhaltschecks bleiben erhalten.
name: Lumen Studios Insolvenz Strafverfahren
plugin: insolvenzverwaltung
checks:
- id: r01-readme-vorhanden
  check_type: file_exists
  description: README.md vorhanden
  path: README.md
- id: r02-gesamt-pdf-vorhanden
  check_type: file_exists
  description: Gesamt-PDF gebaut
  path: gesamt-pdf/lumen-studios-insolvenz-strafverfahren_gesamt.pdf
- id: r03-mindestens-3-arbeitsunterlagen
  check_type: working_file_count
  description: Mindestens drei exportierbare Arbeitsunterlagen vorhanden
  min: 3
- id: r-insolvenzantrag-erwaehnt
  check_type: regex_match
  description: Insolvenzantrag erwaehnt
  path: README.md
  pattern: (Insolvenzantrag|InsO)
- id: r-strafverfahren-erwaehnt
  check_type: regex_match
  description: Strafverfahren erwaehnt
  path: README.md
  pattern: (Strafverfahren|StGB)
