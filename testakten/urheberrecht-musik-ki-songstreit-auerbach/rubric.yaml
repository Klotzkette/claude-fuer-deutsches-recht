# Strukturelle Baseline-Rubrik. Fallbezogene Inhaltschecks bleiben erhalten.
name: Urheberrecht Musik Ki Songstreit Auerbach
plugin: fachanwalt-urheber-medienrecht
checks:
- id: r01-readme-vorhanden
  check_type: file_exists
  description: README.md vorhanden
  path: README.md
- id: r02-gesamt-pdf-vorhanden
  check_type: file_exists
  description: Gesamt-PDF gebaut
  path: gesamt-pdf/urheberrecht-musik-ki-songstreit-auerbach_gesamt.pdf
- id: r03-mindestens-3-arbeitsunterlagen
  check_type: working_file_count
  description: Mindestens drei exportierbare Arbeitsunterlagen vorhanden
  min: 3
- id: r04-sachverstaendigengutachten-vorhanden
  check_type: file_exists
  description: Vorlaeufiges Sachverstaendigengutachten Musikvergleich als eigenes Aktenstueck vorhanden
  path: 16-sachverstaendigengutachten-musikvergleich-vorlaeufig.docx
- id: r05-ecmr-fingerprint-bericht-vorhanden
  check_type: file_exists
  description: ECMR-Fingerprint-Bericht der Streaming-Plattform vorhanden
  path: 17-ecmr-fingerprint-bericht-streamdeck.docx
- id: r06-keine-rechtliche-bewertung-durch-sachverstaendige
  check_type: human_review
  description: Pruefen, dass jede Antwort zum Sachverstaendigengutachten die technische von der rechtlichen Bewertung sauber trennt und keine Aussage zur Urheberrechtsverletzung der Sachverstaendigen zuschreibt
  note: Das Gutachten (Aktenstueck 16) liefert nur Vergleichstatsachen, keine Rechtsbewertung
- id: r07-gema-meldung-mit-vorbehalt-erkannt
  check_type: human_review
  description: Pruefen, dass Antworten zur GEMA-Meldung (Aktenstueck 18) den Vorbehalts- und Aenderungslog-Charakter korrekt wiedergeben und keine endgueltige Rechtezuordnung suggerieren
