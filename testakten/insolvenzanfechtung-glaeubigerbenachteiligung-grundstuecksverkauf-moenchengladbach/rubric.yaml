name: insolvenzanfechtung-glaeubigerbenachteiligung-grundstuecksverkauf-moenchengladbach
plugin: "fachanwalt-insolvenz-sanierungsrecht"
description: Prueft, ob ein Bearbeiter die Kernfrage der Glaeubigerbenachteiligung nach Paragraf 129 InsO bei wertausschoepfender
  Belastung sauber analysiert, die beiden Anfechtungskomplexe (Grundstuecksverkauf und Provisionszahlung) trennt
  und die in der Akte verteilten Indizien findet.
checks:
  - id: datei-01-verfahrensvermerk-verwalter
    check_type: file_exists
    description: Das Primäraktenstück 01_verfahrensvermerk_verwalter.docx ist für die Fallauswertung vorhanden.
    path: 01_verfahrensvermerk_verwalter.docx
  - id: datei-02-eigenantrag-auszug-2026-03-16
    check_type: file_exists
    description: Das Primäraktenstück 02_eigenantrag_auszug_2026-03-16.docx ist für die Fallauswertung vorhanden.
    path: 02_eigenantrag_auszug_2026-03-16.docx
  - id: benachteiligung-wertausschoepfende-belastung
    check_type: human_review
    description: Die Kernfrage der Glaeubigerbenachteiligung (Paragraf 129 Abs. 1 InsO) beim Verkauf des belasteten
      Grundstuecks wird erkannt und anhand der Differenz zwischen Nominalbetrag der Grundschuld (2.100.000 EUR nebst
      Zinsen) und Valutierung (1.790.000 EUR laut Valutenbestaetigung vom 10.11.2025) diskutiert.
  - id: eilabschlag-im-gutachten
    check_type: human_review
    description: 'Das verdeckte Bewertungsproblem im Verkehrswertgutachten (Aktenstueck 05) wird gefunden: vorlaeufiger
      Ertragswert 2.050.000 EUR, davon 10 Prozent Marktanpassungsabschlag allein wegen der eiligen Verwertung.'
  - id: provision-unentgeltlichkeit
    check_type: human_review
    description: Die Provisionszahlung von 60.000 EUR an den Bruder wird als eigener Anfechtungskomplex behandelt
      und auf Paragraf 134 InsO (hilfsweise Paragraf 133 InsO) geprueft.
  - id: insolvenzreife-diskrepanz
    check_type: human_review
    description: Die Diskrepanz zwischen dem Eigenantrag (Zahlungsunfaehigkeit angeblich erst Anfang Februar 2026)
      und dem Liquiditaetsstatus (Aktenstueck 10) wird aufgedeckt.
  - id: subjektive-indizien
    check_type: human_review
    description: Die ueber die Akte verteilten Indizien zu Vorsatz und Kenntnis werden gesammelt und je Anfechtungsgegner
      getrennt gewuerdigt.
  - id: rechtsfolgen-und-strategie
    check_type: human_review
    description: Die Rechtsfolgen nach Paragraf 143 InsO und eine vertretbare Prozessstrategie werden entwickelt.
