name: strafrecht-btm-kokain-kurierfahrt-a3-koeln
plugin: "fachanwalt-strafrecht"
description: Betäubungsmittelverfahren nach A3-Kontrolle mit Kokainfund, Durchsuchung, DNA-Spuren, Handyforensik,
  Kurierwissen und Haftfrage.
checks:
  - id: datei-neu-primaerbeleg
    check_type: file_exists
    description: Der Primaerbeleg 13_belehrungs_und_dolmetschervermerk_2026-06-09.docx ist vorhanden.
    path: 13_belehrungs_und_dolmetschervermerk_2026-06-09.docx
  - id: datei-02-sachverhalt-chronologie
    check_type: file_exists
    description: Das Primäraktenstück 02_sachverhalt_chronologie.docx ist für die Fallauswertung vorhanden.
    path: 02_sachverhalt_chronologie.docx
  - id: fachpruefung-01
    check_type: human_review
    description: Verfahrensrolle, Fristen und nächstes Arbeitsprodukt vor der materiellen Prüfung klären.
  - id: fachpruefung-02
    check_type: human_review
    description: Belastende und entlastende Tatsachen nicht vermischen, sondern je Beweismittel ausweisen.
  - id: p03-wirkstoffmenge-und-kuriermuster
    check_type: human_review
    description: Aus Wirkstoffgutachten und Telematik-Zeitreihe muessen die strafzumessungsrelevante Wirkstoffmenge
      und das Kuriermuster nachgerechnet und gegen die Einlassung des Beschuldigten gehalten werden, er habe nur
      als Fahrer gehandelt und die Reserveradmulde nie geoeffnet.
  - id: fachpruefung-04
    check_type: human_review
    description: Normanker nur als Arbeitshilfe verwenden und Subsumtion am konkreten Sachverhalt durchführen.
  - id: fachpruefung-05
    check_type: human_review
    description: Nebenfolgen wie Einziehung, Fahrerlaubnis, Kontaktverbot, Haft oder Berufsfolgen ausdrücklich mitdenken.
  - id: fachpruefung-06
    check_type: human_review
    description: Haftprüfung vorbereiten, Dolmetscher- und Belehrungsvermerk anfordern, Rohdaten der Handyforensik
      sichern und Zusatzfahrer über Vermieter identifizieren.
