name: bau-rundum-abschlagsrechnung-lemgo
plugin: bauwirtschaft-fortgeschrittene
description: Kumulative Rohbaurechnung mit fortgeschriebenen Mengen, zwei unterschiedlich
  behandelten Nachträgen, Teilzahlungen und einer noch nicht erledigten Beanstandung.
checks:
- id: sachpruefung-1
  check_type: human_review
  description: Kumulative Leistungen, frühere Rechnungen und tatsächlich geleistete
    Zahlungen getrennt abgleichen.
- id: sachpruefung-2
  check_type: human_review
  description: Aufmaß, Liefernachweis, Preisvereinbarung und Anordnung für jede Abweichung
    anhand ihrer Herkunft unterscheiden.
- id: sachpruefung-3
  check_type: human_review
  description: Einbehalte und Sicherungsklausel prüfen, ohne aus einer Buchung ein
    Anerkenntnis abzuleiten.
