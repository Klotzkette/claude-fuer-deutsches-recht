name: 'Parkpicknick: erledigter Platzverweis und Zukunftshinweis'
plugin: berliner-asog-polizeirecht
stand: '2026-10-02'
pruefstatus: Fachliche menschliche Ergebnisprüfung offen; keine Modellleistung als bestanden behauptet.
bewertungsgrundlage:
  rohakte: berlin-asog-platzverweis-parkpicknick
  fachprofil: quality/evals/berliner-asog-polizeirecht.json
  hinweis: Kriterien beruhen auf Rohunterlagen und fachlichem Evalprofil. Dateiexistenz und Dateizahl
    bestätigen ausschließlich den Bestand.
erwartete_ergebnisformate:
- datei: Klaerungsanfrage_Polizei.docx
  zweck: Vollständiger freundlicher Anfrageentwurf zu räumlicher und zeitlicher Reichweite.
- datei: Fristen_und_Planungsvermerk.docx
  zweck: Vermerk zu Bekanntgabe, Erledigung und dem geplanten Treffen am 10. Oktober.
ergebnisformat_hinweis: Die genannten Ergebnisdateien sind Bewertungsziele einer späteren Bearbeitung,
  keine bereits gelieferten Dateien und keine automatisch geprüften Bestandsvoraussetzungen. DOCX
  bleibt bearbeitbar; XLSX soll bei Berechnungen nachvollziehbare Formeln und kenntliche Annahmen
  enthalten. PDF kann zusätzlich als Lesefassung dienen.
checks:
- id: unterlagenumfang
  check_type: working_file_count
  description: Der exportierbare Bestand umfasst mindestens 18 eigenständige native Unterlagen; Gesamt-PDF
    und Bewertungsdatei zählen nicht mit.
  min: 18
- id: native-docx
  check_type: file_count
  description: Mindestens 8 native DOCX-Unterlagen sind im Aktenordner vorhanden.
  glob: '*.docx'
  min: 8
- id: native-eml
  check_type: file_count
  description: Mindestens 7 native EML-Unterlagen sind im Aktenordner vorhanden.
  glob: '*.eml'
  min: 7
- id: native-txt
  check_type: file_count
  description: Mindestens 2 native TXT-Unterlagen sind im Aktenordner vorhanden.
  glob: '*.txt'
  min: 2
- id: native-xlsx
  check_type: file_count
  description: Mindestens 1 native XLSX-Unterlagen sind im Aktenordner vorhanden.
  glob: '*.xlsx'
  min: 1
- id: lesefassung
  check_type: file_exists
  description: Die vollständige Lesefassung ergänzt die nativen Originaldateien.
  path: gesamt-pdf/berlin-asog-platzverweis-parkpicknick_gesamt.pdf
- id: kernbeleg-1
  check_type: file_exists
  description: Der für die konkrete fachliche Prüfung benötigte Originalbeleg ist vorhanden.
  path: 02_Bestaetigung_Platzverweis.docx
- id: kernbeleg-2
  check_type: file_exists
  description: Der für die konkrete fachliche Prüfung benötigte Originalbeleg ist vorhanden.
  path: 05_Ortsnotiz_Wege.docx
- id: kernbeleg-3
  check_type: file_exists
  description: Der für die konkrete fachliche Prüfung benötigte Originalbeleg ist vorhanden.
  path: 07_Zugangsnotiz.docx
- id: fach-regelungsgegenstand
  check_type: human_review
  description: Werden die mündliche Wegweisung am 26. September bis 22 Uhr, ihre schriftliche Bestätigung
    und der auslegungsbedürftige Zukunftshinweis getrennt? Keine eindeutige neue Daueranordnung erfinden,
    die der Wortlaut gerade offenlässt.
  note: 'Offen: noch kein konkretes Modellergebnis anhand dieses Kriteriums menschlich bewertet.
    Ein bestandener Strukturcheck ersetzt diese Prüfung nicht.'
- id: fach-beweiswert
  check_type: human_review
  description: Werden Cems Beobachtungslücke, die teilweise auf dem Weg liegende Decke und die Nachbarbeschwerde
    berücksichtigt? Die spätere freie Wegbreite vom 30. September beweist nicht den vollständigen
    Zustand am Samstag.
  note: 'Offen: noch kein konkretes Modellergebnis anhand dieses Kriteriums menschlich bewertet.
    Ein bestandener Strukturcheck ersetzt diese Prüfung nicht.'
- id: fach-privattreffen
  check_type: human_review
  description: Wird die private Kuchenrunde nach ihrem Zweck eingeordnet, ohne sie allein wegen Gruppengröße
    als Versammlung zu behandeln? Bleiben öffentliches Grünanlagenrecht und die konkrete polizeiliche
    Anordnung unterscheidbar?
  note: 'Offen: noch kein konkretes Modellergebnis anhand dieses Kriteriums menschlich bewertet.
    Ein bestandener Strukturcheck ersetzt diese Prüfung nicht.'
- id: fach-bekanntgabe
  check_type: human_review
  description: Werden mündliche Bekanntgabe, Briefdatum, Poststempel und tatsächliche Briefkastenleerung
    unterschieden? Keine automatische neue Rechtsbehelfsfrist allein aus der Bestätigung und keine
    erfundene förmliche Zustellung.
  note: 'Offen: noch kein konkretes Modellergebnis anhand dieses Kriteriums menschlich bewertet.
    Ein bestandener Strukturcheck ersetzt diese Prüfung nicht.'
- id: fach-zukunft
  check_type: human_review
  description: Werden das geplante Treffen am 10. Oktober, die vorläufige Einladung, freier Weg und
    mögliche alternative Fläche als konkrete Klärungsgegenstände aufgenommen, ohne die alternative
    Fläche für Menschen mit Gehhilfe als gleichwertig gesichert darzustellen?
  note: 'Offen: noch kein konkretes Modellergebnis anhand dieses Kriteriums menschlich bewertet.
    Ein bestandener Strukturcheck ersetzt diese Prüfung nicht.'
- id: fach-produkt
  check_type: human_review
  description: Liegt eine ausformulierte Anfrage mit klarer Frage nach der Reichweite des Zukunftshinweises
    und den benötigten Einsatzunterlagen vor? Gerichtliches Vorgehen nur begrenzt vorbereiten; keine
    unerbetene Klage oder behauptete Übermittlung.
  note: 'Offen: noch kein konkretes Modellergebnis anhand dieses Kriteriums menschlich bewertet.
    Ein bestandener Strukturcheck ersetzt diese Prüfung nicht.'
offene_pruefkriterien:
- Werden die mündliche Wegweisung am 26. September bis 22 Uhr, ihre schriftliche Bestätigung und
  der auslegungsbedürftige Zukunftshinweis getrennt? Keine eindeutige neue Daueranordnung erfinden,
  die der Wortlaut gerade offenlässt.
- Werden Cems Beobachtungslücke, die teilweise auf dem Weg liegende Decke und die Nachbarbeschwerde
  berücksichtigt? Die spätere freie Wegbreite vom 30. September beweist nicht den vollständigen Zustand
  am Samstag.
- Wird die private Kuchenrunde nach ihrem Zweck eingeordnet, ohne sie allein wegen Gruppengröße als
  Versammlung zu behandeln? Bleiben öffentliches Grünanlagenrecht und die konkrete polizeiliche Anordnung
  unterscheidbar?
- Werden mündliche Bekanntgabe, Briefdatum, Poststempel und tatsächliche Briefkastenleerung unterschieden?
  Keine automatische neue Rechtsbehelfsfrist allein aus der Bestätigung und keine erfundene förmliche
  Zustellung.
- Werden das geplante Treffen am 10. Oktober, die vorläufige Einladung, freier Weg und mögliche alternative
  Fläche als konkrete Klärungsgegenstände aufgenommen, ohne die alternative Fläche für Menschen mit
  Gehhilfe als gleichwertig gesichert darzustellen?
- Liegt eine ausformulierte Anfrage mit klarer Frage nach der Reichweite des Zukunftshinweises und
  den benötigten Einsatzunterlagen vor? Gerichtliches Vorgehen nur begrenzt vorbereiten; keine unerbetene
  Klage oder behauptete Übermittlung.
