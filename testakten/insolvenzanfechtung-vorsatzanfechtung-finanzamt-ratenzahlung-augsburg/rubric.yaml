name: insolvenzanfechtung-vorsatzanfechtung-finanzamt-ratenzahlung-augsburg
plugin: "fachanwalt-insolvenz-sanierungsrecht"
description: 'Vorsatzanfechtung gegen den Freistaat Bayern (Finanzamt Augsburg-Stadt) im Vierjahreszeitraum des
  Paragraf 133 Abs. 2 InsO: 30 Ratenzahlungen ueber insgesamt 388.000 EUR nach Umsatzsteuer-Sonderpruefung, Vollstreckungsankuendigung,
  zwei fruchtlosen Pfaendungsversuchen und zweimal Vollstreckungsaufschub nur gegen Sicherheitsleistung. Prueffragen:
  Fristberechnung je Rate, Benachteiligungsvorsatz trotz "Kampf ums Ueberleben", Kenntnis des Finanzamts im Spannungsfeld
  von Paragraf 133 Abs. 3 Satz 2 InsO (Ratenbitte allein genuegt nicht) und Vollstreckungshistorie, Kongruenzfrage
  bei Zahlungen unter Vollstreckungsdruck, tatsaechlicher Eintritt der Zahlungsunfaehigkeit.'
checks:
  - id: datei-01-vermerk-anfechtungspruefung-2026-05-20
    check_type: file_exists
    description: Das Primäraktenstück 01_vermerk_anfechtungspruefung_2026-05-20.docx ist für die Fallauswertung
      vorhanden.
    path: 01_vermerk_anfechtungspruefung_2026-05-20.docx
  - id: datei-02-vollstreckungsankuendigung-finanzamt-2022-08-15
    check_type: file_exists
    description: Das Primäraktenstück 02_vollstreckungsankuendigung_finanzamt_2022-08-15.docx ist für die Fallauswertung
      vorhanden.
    path: 02_vollstreckungsankuendigung_finanzamt_2022-08-15.docx
  - id: p01-fristberechnung-je-rate
    check_type: human_review
    description: Die Vierjahresfrist des Paragraf 133 Abs. 2 InsO muss je Rate nach Paragraf 140 Abs. 1 InsO auf
      den jeweiligen Zahlungseingang bezogen werden, nicht auf die Ratenzahlungsvereinbarung vom 24.10.2022.
  - id: p02-benachteiligungsvorsatz
    check_type: human_review
    description: Der Benachteiligungsvorsatz des Geschaeftsfuehrers muss aus den Aktenstuecken hergeleitet und gegen
      den Einwand des redlichen Sanierungsversuchs abgewogen werden.
  - id: p03-kenntnis-finanzamt-abs3-satz2
    check_type: human_review
    description: Die Kenntnispruefung muss die Wertung des Paragraf 133 Abs. 3 Satz 2 InsO (Ratenzahlungsbitte allein
      kein Kenntnisbeweis) erkennen und gegen die uebrigen Beweisanzeichen abwaegen.
  - id: p04-abs3-satz1-kongruenz
    check_type: human_review
    description: Die Bearbeitung muss den Massstab des Paragraf 133 Abs. 3 Satz 1 InsO (bei kongruenter Deckung
      Kenntnis der eingetretenen Zahlungsunfaehigkeit erforderlich) anwenden und die Kongruenzfrage bei Zahlungen
      unter Vollstreckungsdruck pruefen.
  - id: p05-zahlungsunfaehigkeit-diskrepanz
    check_type: human_review
    description: Der Eintritt der Zahlungsunfaehigkeit muss aus BWA-Quartalsreihe und Liquiditaetsplanungen selbststaendig
      ermittelt und der Datierung im Eigenantrag gegenuebergestellt werden.
  - id: p06-rechtsfolgen-und-zinsen
    check_type: human_review
    description: Die Rechtsfolgenseite der Anfechtung muss vollstaendig dargestellt werden.
