name: strafrecht-durchsuchung-gefahr-im-verzug-beweisverwertung-bochum
plugin: "aktenaufbereiter-strafrecht"
description: 'BtM- und Waffenverfahren der StA Bochum. Am 12.05.2026 wird die Wohnung des Beschuldigten ohne richterlichen
  Beschluss durchsucht, gestuetzt auf Gefahr im Verzug; der Vermerk behauptet, der Bereitschaftsrichter sei telefonisch
  nicht erreichbar gewesen. Die Bearbeitung muss die Zeitkette aus Einsatzprotokoll-CSV, Telefonvermerk-CSV der
  Wache und der Erreichbarkeitsauskunft des AG Bochum rekonstruieren, die Diskrepanz zum Durchsuchungsvermerk aufdecken
  und die Folgen fuer Beweisverwertungsverbot, Fernwirkung und Anklagebestand differenziert entwickeln. Falle: Unabhaengig
  erlangte Beweise (Observation, Kaeufer, Nachbar) bleiben auch bei einem Verwertungsverbot verwertbar.'
checks:
  - id: datei-01-observationsbericht-kk12-2026-05-12
    check_type: file_exists
    description: Das Primäraktenstück 01_observationsbericht_kk12_2026-05-12.docx ist für die Fallauswertung vorhanden.
    path: 01_observationsbericht_kk12_2026-05-12.docx
  - id: datei-02-einsatzprotokoll-funkverkehr-2026-05-12
    check_type: file_exists
    description: Das Primäraktenstück 02_einsatzprotokoll_funkverkehr_2026-05-12.csv ist für die Fallauswertung
      vorhanden.
    path: 02_einsatzprotokoll_funkverkehr_2026-05-12.csv
  - id: p01-zeitkette-rekonstruktion
    check_type: human_review
    description: Die Zeitkette des 12.05.2026 muss aus der Einsatzprotokoll-CSV minutengenau rekonstruiert werden.
  - id: p02-diskrepanz-anrufversuch
    check_type: human_review
    description: Der Widerspruch zwischen Durchsuchungsvermerk und Datenlage zum angeblichen Anrufversuch muss belegt
      werden.
  - id: p03-gefahr-im-verzug-pruefung
    check_type: human_review
    description: Die Voraussetzungen der Eilanordnung nach Paragraf 105 Abs. 1 StPO muessen normbezogen und zweiseitig
      geprueft werden.
  - id: p04-verwertungsverbot-abwaegung
    check_type: human_review
    description: Die Verwertungsfrage muss als Abwaegung mit den anerkannten Fallgruppen entwickelt werden.
  - id: p05-falle-unabhaengige-beweise
    check_type: human_review
    description: 'Die Falle der Akte muss erkannt werden: Ein Verwertungsverbot erfasst nicht die unabhaengig erlangten
      Beweise.'
  - id: p06-mengen-und-wirkstoffrechnung
    check_type: human_review
    description: Die Mengen- und Wirkstoffrechnung aus der Asservatenliste muss nachvollzogen werden.
