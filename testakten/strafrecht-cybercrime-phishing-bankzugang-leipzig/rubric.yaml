name: strafrecht-cybercrime-phishing-bankzugang-leipzig
plugin: "fachanwalt-strafrecht"
description: Cybercrime-Akte zu Phishing, Computerbetrug, Kontoleihe, IP-Spuren, TAN-Freigaben, Geldwäscheverdacht
  und digitaler Beweissicherung.
checks:
  - id: datei-neu-primaerbeleg
    check_type: file_exists
    description: Der Primaerbeleg 17_atm_bildauswertung_2026-06-11.docx ist vorhanden.
    path: 17_atm_bildauswertung_2026-06-11.docx
  - id: datei-02-sachverhalt-chronologie
    check_type: file_exists
    description: Das Primäraktenstück 02_sachverhalt_chronologie.docx ist für die Fallauswertung vorhanden.
    path: 02_sachverhalt_chronologie.docx
  - id: fachpruefung-01
    check_type: human_review
    description: Verfahrensrolle, Fristen und nächstes Arbeitsprodukt vor der materiellen Prüfung klären.
  - id: fachpruefung-02
    check_type: human_review
    description: Belastende und entlastende Tatsachen nicht vermischen, sondern je Beweismittel ausweisen.
  - id: p03-geldfluss-und-kontoleihe
    check_type: human_review
    description: Aus dem Transaktions- und Login-Log muessen Schadenssumme, Bargeldabhebung und Weiterleitungskette
      nachgerechnet und gegen die Einlassung gehalten werden, das Konto sei nur fuer einen Kryptohandel verliehen
      worden.
  - id: fachpruefung-04
    check_type: human_review
    description: Normanker nur als Arbeitshilfe verwenden und Subsumtion am konkreten Sachverhalt durchführen.
  - id: fachpruefung-05
    check_type: human_review
    description: Nebenfolgen wie Einziehung, Fahrerlaubnis, Kontaktverbot, Haft oder Berufsfolgen ausdrücklich mitdenken.
  - id: fachpruefung-06
    check_type: human_review
    description: Rohdaten der Banklogs mit Zeitzonen sichern, ATM-Bildqualität prüfen, Einziehungsrisiko berechnen
      und Stellungnahme zur Kontoleihe vorbereiten.
