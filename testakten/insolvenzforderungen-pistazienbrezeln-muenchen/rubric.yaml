name: Insolvenzforderungen der Münchner Pistazien-Brezelbäckerei
plugin: insolvenzforderungen-checker
stand: '2026-08-28'
checks:
  - id: unterlagenumfang
    check_type: working_file_count
    description: Der Bestand enthält 22 eigenständige native Unterlagen.
    min: 22
  - id: lesefassung
    check_type: file_exists
    description: Die gemeinsame Lesefassung liegt zusätzlich zu den Originalen vor.
    path: gesamt-pdf/insolvenzforderungen-pistazienbrezeln-muenchen_gesamt.pdf
offene_pruefkriterien:
  - Werden die fünf Anmeldungen getrennt mit ihren Ursprungsbelegen abgeglichen?
  - Werden Schuldnergesellschaft, Rechnungsempfänger und Leistungsempfänger anhand der Dokumente festgestellt?
  - Werden Zahlungszuordnungen, Rechnungskorrekturen und Leistungszeiträume belegt?
  - Bleiben Eingang, gerichtlicher Termin und tatsächlicher Prüfstatus unterscheidbar?
  - Entstehen begründete Prüfvorschläge und vollständige Gläubigerbriefe statt bloßer Beleglisten?
