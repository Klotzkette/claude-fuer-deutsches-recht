name: Handelsvertreterrecht Provisionsausgleich Nordstern Medtech
plugin: handelsvertreterrecht
description: Fallbezogene Qualitätsprüfung der Vertriebsakte mit Kündigung, Buchauszug, Bezirksumsätzen, Stornoreserve und Wettbewerbsabrede.
checks:
  - id: r01-gesamt-pdf-vorhanden
    check_type: file_exists
    description: Das Gesamt-PDF ist gebaut.
    path: gesamt-pdf/handelsvertreterrecht-provisionsausgleich-nordstern-medtech_gesamt.pdf
  - id: r02-mandatsaufnahme-konkret
    check_type: text_contains
    description: Die Mandatsaufnahme bezeichnet Mandantin und Ansprechpartner konkret.
    path: 01-mandatsnotiz-und-arbeitsauftrag.docx
    contains: Thorsten Altfeld
  - id: r03-kuendigung-in-chronologie
    check_type: text_contains
    description: Die Chronologie enthält den konkreten Kündigungsvorgang.
    path: 02-zeitstrahl-und-fristen.docx
    contains: 22. Mai 2026
  - id: r04-entscheidung-buchauszug
    check_type: text_contains
    description: Die Geschäftsführungsunterlage enthält den konkreten Buchauszugsbedarf.
    path: 23-entscheidungsvorlage-kurzfassung.docx
    contains: Umfang und Termin eines Buchauszugs
  - id: r05-besprechung-provisionsvorgang
    check_type: text_contains
    description: Die Besprechungsunterlage führt einen konkreten Provisionsvorgang.
    path: 24-arbeitsstand-fuer-besprechung.pdf
    contains: PO-1912
  - id: r06-arbeitsunterlagen
    check_type: working_file_count
    description: Die Akte enthält mindestens fünfzehn exportierbare Arbeitsunterlagen.
    min: 15
  - id: r07-fachpruefung
    check_type: human_review
    description: Vertragspartner, Gebiet, Kündigungsdatum, Kunden, Beträge und Dokumentenfundstellen sind aktenweit widerspruchsfrei oder ausdrücklich als Widerspruch markiert.
