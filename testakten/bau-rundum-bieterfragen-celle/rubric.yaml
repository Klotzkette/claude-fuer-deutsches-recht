name: bau-rundum-bieterfragen-celle
plugin: bauwirtschaft-anfaenger
author: Klotzkette
description: "Öffentliche Bauvergabe einer Lesesaalmodernisierung mit vorläufiger Leistungsbeschreibung, Bestandsdaten, Produktnotiz und später eingegangenen Bieterfragen. Antworten und Berichtigung sind noch nicht erstellt."
checks:
  - id: fachpruefung-1
    check_type: human_review
    description: "Vorabprüfung der LB und spätere Bündelung der drei Bieterfragen als zwei zeitlich getrennte Bearbeitungsschritte abbilden."
  - id: fachpruefung-2
    check_type: human_review
    description: "32/36 Leuchten, Gleichwertigkeitsmerkmale, Rastermaße, Steuerung, Leitungsumfang und Arbeitsfenster mit konkreten Quellen erfassen."
  - id: fachpruefung-3
    check_type: human_review
    description: "Aus dem Zusatz oder gleichwertig keine automatische Zulässigkeit der Produktvorgabe ableiten; technische Kriterien und vergaberechtliche Prüfung offenlegen."
  - id: fachpruefung-4
    check_type: human_review
    description: "Entwurf gemeinsamer Antworten von ungeklärten technischen Fakten und nötigen Unterlagenänderungen trennen; weder Veröffentlichung noch Friständerung erfinden."
  - id: fachpruefung-5
    check_type: human_review
    description: "Lieferantenvariante und Lieferfrist von verbindlichen Vergabeanforderungen trennen; neue punktuelle Leitungs- und Rasteraufnahme sowie Transportweg nicht als bereits veröffentlichte Berichtigung, Vollaufnahme oder Produktfreigabe darstellen."
  - id: original-01
    check_type: file_exists
    path: "01_Vorabpruefung.eml"
    description: "Eigenständige Originalunterlage 01_Vorabpruefung.eml"
