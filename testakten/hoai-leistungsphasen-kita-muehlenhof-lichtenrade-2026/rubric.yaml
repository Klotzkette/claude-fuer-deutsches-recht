name: hoai-leistungsphasen-kita-muehlenhof-lichtenrade-2026
plugin: "hoai-leistungsphasen-praxis"
description: HOAI-Leistungsphasen und Bauueberwachung beim Kita-Neubau Muehlenhof mit eigenstaendiger Berechnung
  des bei erreichtem Leistungsstand verdienten Honoraranteils, Aufloesung der Diskrepanz Grundleistung gegen Besondere
  Leistung, Budgetdrift ueber die Kostenverfolgung, Stufenbeauftragung ohne schriftlichen Abruf sowie Nachtrag ohne
  Anordnung.
checks:
  - id: datei-01-projektauftrag-und-vertragsstand
    check_type: file_exists
    description: Das Primäraktenstück 01-projektauftrag-und-vertragsstand.docx ist für die Fallauswertung vorhanden.
    path: 01-projektauftrag-und-vertragsstand.docx
  - id: datei-02-lph1-grundlagen-und-bedarf
    check_type: file_exists
    description: Das Primäraktenstück 02-lph1-grundlagen-und-bedarf.docx ist für die Fallauswertung vorhanden.
    path: 02-lph1-grundlagen-und-bedarf.docx
  - id: p1-verdientes-honorar-berechnen
    check_type: human_review
    description: Datenauswertungs-Kern - Aus dem Vertrag, der Honorar-CSV und den Baustellenprotokollen muss der
      bei erreichtem Leistungsstand verdiente Honoraranteil berechnet werden.
  - id: p2-grundleistung-oder-besondere-leistung
    check_type: human_review
    description: Diskrepanz-Pflichtpunkt - Die Behauptung der Architektin, Brandschutzkoordination und TGA-Mengenermittlung
      seien gesondert zu verguetende Besondere Leistungen, muss aufgeloest werden.
  - id: p3-anrechenbare-kosten-und-budgetdrift
    check_type: human_review
    description: Datenauswertung Kosten - Die Budgetdrift ueber die Leistungsphasen und ihre Wirkung auf das Honorar
      muss ausgewertet werden.
  - id: p4-stufenbeauftragung-ohne-abruf
    check_type: human_review
    description: Die Leistungsphasen 4 bis 8 sind erbracht, ein schriftlicher Abruf der Stufe 2 fehlt jedoch.
  - id: p5-schlussrechnung-vertragsstrafe-und-einbehalt
    check_type: human_review
    description: Datenauswertungs-Kern Rechnungspruefung - Aus Teilschlussrechnung, Kuerzungsschreiben, Bauzeitenplan
      und Maengelchronologie muss der berechtigt freizugebende Honorarbetrag ermittelt und die Vertragsstrafe richtig
      berechnet werden.
  - id: p6-formalien-und-keine-scheinzitate
    check_type: human_review
    description: Endprodukte sind ausformuliert, dezimal gegliedert und ohne halluzinierte Fundstellen zu liefern.
