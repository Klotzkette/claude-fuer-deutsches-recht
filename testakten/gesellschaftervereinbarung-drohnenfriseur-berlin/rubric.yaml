- id: fach-auftrag
  check_type: human_review
  description: >-
    Klärt die Bearbeitung anhand von Mandatsauftrag, Gründerchat und Terminnotiz
    die gemeinsame Beratung der beiden Gründer, ihre möglichen Interessengegensätze
    und die noch offenen Vollmachten, ohne Gesellschaft oder Investoren als
    mitbeauftragt anzusehen oder Unterlagen ungefragt weiterzuleiten?
  note: Offene Fachprüfung einer späteren Bearbeitung; kein automatisch bestandenes Ergebnis.
- id: fach-unterlagen
  check_type: human_review
  description: >-
    Werden Term Sheet, Ausfüllfassung, Gesellschaftsunterlagen und Korrespondenz
    zuerst abgeglichen, die bestehende GmbH von überholten Gründungsangaben
    unterschieden und offene Verhandlungsentscheidungen gezielt nachgefragt?
    Bleiben fünf Beiratssitze, ein möglicher unabhängiger Vorsitz, die verlangte
    Verlängerung der Exklusivität und die Rechte des Business Angels als
    abzustimmende Punkte sichtbar, während unabhängige Vertragsabschnitte
    vollständig ausformuliert werden?
  note: Offene Fachprüfung einer späteren Bearbeitung; kein automatisch bestandenes Ergebnis.
- id: fach-kapital-und-tranchen
  check_type: human_review
  description: >-
    Gleicht die Bearbeitung Bestandsbeteiligungen, historische Einzahlungen,
    Arbeitsmappe und beide neuen Tranchen ab und trennt zugesagte Finanzierung,
    tatsächliche Zahlung, Nennkapital, Aufgeld und Eintragung?
    Werden die noch ausstehende erste Einzahlung, Bedingungen und Nachweise der
    zweiten Tranche sowie Rangfolge, Wahl und Berechnungsbasis der Erlösvorrechte
    anhand der unterschiedlichen Parteipositionen behandelt, ohne offene
    Entscheidungen oder künftige Zahlungen als bereits feststehend anzusetzen?
  note: Offene Fachprüfung einer späteren Bearbeitung; kein automatisch bestandenes Ergebnis.
- id: fach-gruenderbindung
  check_type: human_review
  description: >-
    Werden das konkret zu bindende Anteilspaket, bisherige Entwicklungsarbeit,
    zeitliche Freigabe und besondere Lebenslagen der Gründer geklärt?
    Prüft die Bearbeitung Anlass, Preis und Ausübung einer Erwerbsoption getrennt
    und entwickelt sie ausformulierte verhandelbare Regelungen, ohne eine
    ungeklärte Gründerentscheidung zu ersetzen oder fremde Beteiligungsmodelle
    ungeprüft zu übertragen?
  note: Offene Fachprüfung einer späteren Bearbeitung; kein automatisch bestandenes Ergebnis.
- id: fach-rechte-und-meilensteine
  check_type: human_review
  description: >-
    Werden Entwicklungsvertrag, Rechteverzeichnis und Pixelhagen-Nachtrag
    abgeglichen und interne Nutzung, Nutzung im Kundenprodukt, Weitergabe,
    vorbestehende Bibliothek und Rechte an Drittkomponenten unterschieden?
    Bleiben fehlende Nachweise und Vereinbarungen konkret offen, und werden
    technische Meilensteine mit Modellversuch, Versicherungsstand und
    Standortangebot abgestimmt, ohne umfassende Rechte oder eine Freigabe
    für den Personenbetrieb als bereits gesichert darzustellen?
  note: Offene Fachprüfung einer späteren Bearbeitung; kein automatisch bestandenes Ergebnis.
- id: fach-notar-und-vollzug
  check_type: human_review
  description: >-
    Bereitet die Bearbeitung einen konkreten Notarauftrag mit Parteien,
    Vertretungsnachweisen, geltender Satzung, Gesellschafterliste, maßgeblichen
    Anlagen und gelösten Varianten vor und behandelt sie die Formprüfung
    einschließlich Übertragungs- und Rückerwerbsregelungen?
    Werden die zweite Kapitalerhöhung, ihre Voraussetzungen und ihr Vollzug
    eindeutig eingeordnet und Haupttext sowie Anlagen auf Widersprüche geprüft,
    ohne Datenraum-PDFs als beurkundete Anlagen oder die offene Ausfüllfassung
    als unterschriftsreife Endfassung auszugeben?
  note: Offene Fachprüfung einer späteren Bearbeitung; kein automatisch bestandenes Ergebnis.
