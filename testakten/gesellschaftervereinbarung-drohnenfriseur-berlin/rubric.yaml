- id: fach-auftrag
  check_type: human_review
  description: >-
    Klärt die Bearbeitung anhand von Mandatsauftrag, Gründerchat und Terminnotiz
    die gemeinsame Beratung der beiden Gründer, ihre möglichen Interessengegensätze
    und die noch offenen Vollmachten, ohne Gesellschaft oder Investoren als
    mitbeauftragt anzusehen oder Unterlagen ungefragt weiterzuleiten?
    Wird auch Fridolin nach Forderungsmitteilung und Telefonnotiz als gesonderter
    Darlehensgeber ohne eigenes Kanzleimandat behandelt, dessen private Unterlagen
    nicht ohne Befugnis an den Investorenverteiler weitergegeben werden?
  note: Offene Fachprüfung einer späteren Bearbeitung; kein automatisch bestandenes Ergebnis.
- id: fach-unterlagen
  check_type: human_review
  description: >-
    Werden Term Sheet, Ausfüllfassung, Gesellschaftsunterlagen und Korrespondenz
    zuerst abgeglichen, historische Gründungsunterlagen zeitlich eingeordnet und
    vom heutigen GmbH-Bestand unterschieden? Werden offene
    Verhandlungsentscheidungen gezielt nachgefragt?
    Bleiben fünf Beiratssitze, ein möglicher unabhängiger Vorsitz, die verlangte
    Verlängerung der Exklusivität und die Rechte des Business Angels als
    abzustimmende Punkte sichtbar, während unabhängige Vertragsabschnitte
    vollständig ausformuliert werden?
  note: Offene Fachprüfung einer späteren Bearbeitung; kein automatisch bestandenes Ergebnis.
- id: fach-kapital-und-tranchen
  check_type: human_review
  description: >-
    Gleicht die Bearbeitung Bestandsbeteiligungen, historische Einzahlungen,
    Arbeitsmappe und beide neuen Tranchen ab und trennt zugesagte Finanzierung,
    tatsächliche Zahlung, Nennkapital, Aufgeld und Eintragung?
    Werden die noch ausstehende erste Einzahlung, Bedingungen und Nachweise der
    zweiten Tranche sowie Rangfolge, Wahl und Berechnungsbasis der Erlösvorrechte
    anhand der unterschiedlichen Parteipositionen behandelt, ohne offene
    Entscheidungen oder künftige Zahlungen als bereits feststehend anzusetzen?
  note: Offene Fachprüfung einer späteren Bearbeitung; kein automatisch bestandenes Ergebnis.
- id: fach-gruenderbindung
  check_type: human_review
  description: >-
    Werden das konkret zu bindende Anteilspaket, bisherige Entwicklungsarbeit,
    zeitliche Freigabe und besondere Lebenslagen der Gründer geklärt?
    Prüft die Bearbeitung Anlass, Preis und Ausübung einer Erwerbsoption getrennt
    und entwickelt sie ausformulierte verhandelbare Regelungen, ohne eine
    ungeklärte Gründerentscheidung zu ersetzen oder fremde Beteiligungsmodelle
    ungeprüft zu übertragen?
  note: Offene Fachprüfung einer späteren Bearbeitung; kein automatisch bestandenes Ergebnis.
- id: fach-rechte-und-meilensteine
  check_type: human_review
  description: >-
    Werden die Rechtezuwendung von 2023, der technische Bestandsvermerk von 2026,
    Entwicklungsvertrag, Rechteverzeichnis und Pixelhagen-Nachtrag abgeglichen?
    Werden konkrete alte und neue Versionsstände, spätere Arbeitnehmerbeiträge,
    CalSlot-Lizenznachweise sowie interne Nutzung, Nutzung im Kundenprodukt, Weitergabe,
    vorbestehende Bibliothek und Rechte an Drittkomponenten unterschieden,
    ohne Dateibesitz oder historische Überlassung als lückenlosen Nachweis
    sämtlicher aktueller Produktrechte zu behandeln?
    Bleiben fehlende Nachweise und Vereinbarungen konkret offen, und werden
    technische Meilensteine mit Modellversuch, Versicherungsstand und
    Standortangebot abgestimmt, ohne umfassende Rechte oder eine Freigabe
    für den Personenbetrieb als bereits gesichert darzustellen?
  note: Offene Fachprüfung einer späteren Bearbeitung; kein automatisch bestandenes Ergebnis.
- id: fach-notar-und-vollzug
  check_type: human_review
  description: >-
    Bereitet die Bearbeitung einen konkreten Notarauftrag mit Parteien,
    Vertretungsnachweisen, geltender Satzung, Gesellschafterliste, maßgeblichen
    Anlagen und gelösten Varianten vor und behandelt sie die Formprüfung
    einschließlich Übertragungs- und Rückerwerbsregelungen?
    Werden die zweite Kapitalerhöhung, ihre Voraussetzungen und ihr Vollzug
    eindeutig eingeordnet und Haupttext sowie Anlagen auf Widersprüche geprüft,
    ohne Datenraum-PDFs als beurkundete Anlagen oder die offene Ausfüllfassung
    als unterschriftsreife Endfassung auszugeben?
  note: Offene Fachprüfung einer späteren Bearbeitung; kein automatisch bestandenes Ergebnis.
- id: fach-gruendungs-und-kapitalhistorie
  check_type: human_review
  description: >-
    Ordnet die Bearbeitung Projektgemeinschaft, UG in Gründung, eingetragene UG
    und die nach Kapitalerhöhung fortbestehende GmbH anhand der Unterlagen 23 bis
    28, 38 und 45 zeitlich ein? Werden die ursprünglichen Projektbeiträge, die
    beiden Bareinlagen von jeweils 500 EUR, die späteren Bareinzahlungen von
    jeweils 12000 EUR und die gesonderte Rechtezuwendung von insgesamt 24000 EUR
    getrennt geführt, ohne daraus doppelte Einlagen oder zusätzliche Anteile
    abzuleiten? Werden Vertragsübernahmen mit ihren jeweiligen Zustimmungen
    und die Neuordnung der Anteilnummern anhand der konkreten Nachweise
    nachvollzogen, ohne einen Wechsel auf einen anderen Rechtsträger zu erfinden?
  note: Offene Fachprüfung einer späteren Bearbeitung; kein automatisch bestandenes Ergebnis.
- id: fach-fridolin-und-wandlung
  check_type: human_review
  description: >-
    Werden Fridolins Darlehensschein, die Finanzierungsrunde 2025, seine damalige
    E-Mail, die spätere Forderungsmitteilung und Telefonnotiz gemeinsam
    ausgewertet? Wird der Ablagename Projektanleihe vom konkret vereinbarten
    privaten Darlehen getrennt und die bereits erfolgte Runde 2025 als möglicher
    Anknüpfungspunkt behandelt, ohne seine Nachricht automatisch als Verzicht
    oder die Beteiligungsabrede als bereits vollzogenen Anteilserwerb zu deuten?
    Bleiben Bezugsgröße des Abschlags, unterschiedliche historische
    Ausgabebeträge, Zinseinschluss, verbleibende Forderung, Einigung und Form
    ausdrücklich zu klären? Wird die gesonderte Wandlungsrechnung als Variante
    geführt, ohne neue Anteile, veränderte Fälligkeit oder Beteiligung über
    Ottilie als bereits vereinbart auszugeben?
  note: Offene Fachprüfung einer späteren Bearbeitung; kein automatisch bestandenes Ergebnis.
- id: fach-darlehen-und-rang
  check_type: human_review
  description: >-
    Werden alle fünf Darlehensforderungen anhand der einzelnen Verträge,
    Auszahlungen, Fälligkeiten und der Darlehensliste gesondert abgeglichen?
    Entspricht die Zinsrechnung den vereinbarten tatsächlichen Tagen mit Nenner
    365, einbezogenem Auszahlungstag, ausgeschlossenem Abrechnungstag und ohne
    Zinseszins? Wird die gesonderte Rangvereinbarung nur auf die bezeichneten
    ABC- und DEF-Forderungen einschließlich Zinsen und Kosten angewandt, ohne
    sie als Erlass oder als Rangvereinbarung für Gründer und Fridolin zu behandeln?
    Bleiben deren gesetzliche Einordnung und die jeweilige Durchsetzungssperre
    gesondert prüfbedürftig, statt aus einer neuen Finanzierung automatisch
    die Rückzahlung sämtlicher Darlehen freizugeben?
  note: Offene Fachprüfung einer späteren Bearbeitung; kein automatisch bestandenes Ergebnis.
- id: fach-liquiditaetschronologie
  check_type: human_review
  description: >-
    Gleicht die Bearbeitung Stundungsvereinbarung, Bestätigung, Besprechungsnotiz,
    Zahlungsjournal und Bankdaten stichtagsbezogen ab? Werden die einvernehmliche
    Verschiebung der Spulenkranz-Forderung von 45000 EUR bis zum 30. April,
    lediglich angekündigte Kundenzahlungen und die tatsächlichen vier
    Darlehensgutschriften vom 2. März voneinander unterschieden?
    Werden Zinsabgrenzungen nicht als Bankbewegungen und künftige Tranchen nicht
    als vorhandenes Guthaben erfasst? Werden vollständige offene Posten,
    weitere Konten, Kreditlinien und fehlende Nachweise gezielt angefordert,
    bevor eine abschließende insolvenzrechtliche Einordnung erfolgt, statt den
    positiven Ausschnitt des Kontojournals als ausreichende Entwarnung zu behandeln?
  note: Offene Fachprüfung einer späteren Bearbeitung; kein automatisch bestandenes Ergebnis.
