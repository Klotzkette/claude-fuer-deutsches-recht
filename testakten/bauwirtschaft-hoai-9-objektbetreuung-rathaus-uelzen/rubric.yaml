name: bauwirtschaft-hoai-9-objektbetreuung-rathaus-uelzen
plugin: bauwirtschaft
description: 'Rathaussanierung mit Dach- und Metallbauabnahmen aus 2021, späteren
  Feuchtebefunden, Wartungsnachweisen, fremdem Eingriff und fehlendem Dachzugang.
  Präzises Übungsgebiet: fachliche Bewertung späterer Mängel, Begehung vor gewerkeweiser
  Anspruchsfrist, Sicherungseinbehalte und Abgrenzung einer zusätzlichen Beseitigungsüberwachung.'
checks:
- id: fristen
  check_type: human_review
  description: Dachabnahme 15.10.2021 und Metallbauabnahme 12.11.2021 unterscheiden.
    Betriebsübergabe 10.01.2022 nicht als gemeinsamer Beginn. Vorgesehener 18.10.2026
    liegt nach vorläufigem Dachfristende.
- id: ursache
  check_type: human_review
  description: U-11/U-12 nicht allein Dachunternehmer zuweisen; Wartung, L2-Arbeiten
    und unzugänglicher Bereich bleiben relevante Tatsachen. Gerätewerte 78/32 sind
    keine Masseprozente.
- id: leistung
  check_type: human_review
  description: Alten Abnahmemangel M-04 und späteren Feuchtebefund getrennt bearbeiten.
    Überwachung späterer Beseitigung ist nicht automatisch vom Grundauftrag umfasst;
    Angebot vom 25.09. noch nicht angenommen.
- id: sicherung
  check_type: human_review
  description: 4641 EUR Dach und 2844.10 EUR Metallbaueinbehalt vertragsbezogen beurteilen.
    Keine pauschale Sperre aller Sicherheiten und keine automatische Freigabe wegen
    Zeitablaufs.
- id: hemmung
  check_type: human_review
  description: Prüfangebot ohne Anerkennung ist weder automatisch Hemmung noch Neubeginn;
    tatsächliches Verhalten und Vertragslage prüfen. HOAI-Fünfjahresgrenze nicht als
    allgemeine Verjährungsregel nutzen.
