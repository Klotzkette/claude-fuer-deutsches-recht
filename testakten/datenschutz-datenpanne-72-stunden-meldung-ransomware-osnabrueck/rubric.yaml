name: datenschutz-datenpanne-72-stunden-meldung-ransomware-osnabrueck
plugin: "datenschutzrecht"
description: 'Datenpanne nach Ransomware mit Exfiltration bei einem Osnabruecker Versandhaendler mit rund zweihundertvierzigtausend
  Kundenkonten. Prueffragen: Beginn der Zweiundsiebzig-Stunden-Frist nach Artikel 33 Absatz 1 DSGVO (Kenntnis),
  Rechtzeitigkeit und Vollstaendigkeit der Meldung, Erforderlichkeit der Betroffenenbenachrichtigung bei hohem Risiko
  nach Artikel 34 DSGVO. Der Kenntniszeitpunkt ist aus SIEM-Export, Ticketsystem und Krisen-Chat zu rekonstruieren.'
checks:
  - id: datei-01-incident-report-forensik-2026-06-22
    check_type: file_exists
    description: Das Primäraktenstück 01_incident_report_forensik_2026-06-22.docx ist für die Fallauswertung vorhanden.
    path: 01_incident_report_forensik_2026-06-22.docx
  - id: datei-02-siem-alert-export-2026-06
    check_type: file_exists
    description: Das Primäraktenstück 02_siem_alert_export_2026-06.csv ist für die Fallauswertung vorhanden.
    path: 02_siem_alert_export_2026-06.csv
  - id: p01-kenntniszeitpunkt-rekonstruktion
    check_type: human_review
    description: Der maszgebliche Kenntniszeitpunkt muss aus dem Zusammenspiel von SIEM-Export, Ticketsystem-Export
      und Krisen-Chat selbststaendig hergeleitet werden.
  - id: p02-fristberechnung-minutengenau
    check_type: human_review
    description: Die Zweiundsiebzig-Stunden-Frist muss fuer die verschiedenen Anknuepfungspunkte minutengenau berechnet
      und gegen den Meldezeitpunkt gestellt werden.
  - id: p03-diskrepanz-kenntnis-erst-montag
    check_type: human_review
    description: Der Widerspruch zwischen der Meldung und der Aktenlage muss benannt werden.
  - id: p04-erforderlichkeit-betroffenenbenachrichtigung
    check_type: human_review
    description: Die Erforderlichkeit der Benachrichtigung nach Artikel 34 DSGVO und die Maengel des Entwurfs muessen
      geprueft werden.
  - id: p05-tom-und-artikel-32
    check_type: human_review
    description: Die technischen und organisatorischen Masznahmen muessen an Artikel 32 DSGVO gemessen werden.
  - id: p06-vollstaendigkeit-und-kooperation
    check_type: human_review
    description: Die Vollstaendigkeit der Erstmeldung und die Rolle der Nachmeldung muessen gewuerdigt werden.
