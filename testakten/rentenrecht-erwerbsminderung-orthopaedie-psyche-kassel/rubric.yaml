name: rentenrecht-erwerbsminderung-orthopaedie-psyche-kassel
description: Abgelehnte Erwerbsminderungsrente mit Diskrepanz zwischen Reha-Entlassungsbericht und behandelnden Ärzten, gemischter orthopädisch-psychischer Lage, Widerspruch und Klagevorbereitung.
checks:
  - Volle und teilweise Erwerbsminderung anhand des zeitlichen Restleistungsvermögens trennen, nicht anhand der Diagnosen.
  - Diskrepanz zwischen Reha-Leistungsbild (sechs Stunden unter Idealbedingungen) und den Berichten von Orthopäde und Psychotherapeutin herausarbeiten.
  - Bedingungen des Reha-Leistungsbilds (jederzeitiger Haltungswechsel, zusätzliche Pausen, keine Taktung) auf ihre Üblichkeit am allgemeinen Arbeitsmarkt hinterfragen.
  - Wegefähigkeit anhand der dokumentierten Gehstrecken mit Pausen als eigenen Prüfpunkt behandeln.
  - Medikamentennebenwirkungen (Pregabalin, Sertralin, Zopiclon) in das Leistungsbild einbeziehen.
  - Fristen sichern (Widerspruch bis 24.07.2026) und Akteneinsicht vor der Begründung abwarten.
  - Aussteuerung, Nahtlosigkeit und stufenweise Wiedereingliederung als flankierende Themen erkennen, ohne die Rentenprüfung zu ersetzen.
