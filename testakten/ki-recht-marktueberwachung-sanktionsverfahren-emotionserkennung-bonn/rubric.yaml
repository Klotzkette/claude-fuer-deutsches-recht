name: ki-recht-marktueberwachung-sanktionsverfahren-emotionserkennung-bonn
plugin: "ki-vo-ai-act-pruefer"
description: 'Marktueberwachungs- und Sanktionsverfahren nach der Verordnung (EU) 2024/1689: Ein Bonner Callcenter-Dienstleister
  analysiert die Stimmen der eigenen Beschaeftigten in Echtzeit auf Emotion und Stresslevel (VoiceMood Sentinel
  der SentiCore Analytics GmbH). Prueffragen: verbotene Praktik der Emotionserkennung am Arbeitsplatz und Reichweite
  der Ausnahme fuer medizinische Zwecke und Sicherheitszwecke, Abgrenzung Anbieter und Betreiber, Kooperationspflichten
  im Aufsichtsverfahren, Sanktionsrahmen und Zumessung, parallele DSGVO-Dimension mit Koordination zur LDI NRW.'
checks:
  - id: datei-01-beschwerde-karahan-2026-02-12
    check_type: file_exists
    description: Das Primäraktenstück 01_beschwerde_karahan_2026-02-12.docx ist für die Fallauswertung vorhanden.
    path: 01_beschwerde_karahan_2026-02-12.docx
  - id: datei-02-auskunftsverlangen-bnetza-2026-03-03
    check_type: file_exists
    description: Das Primäraktenstück 02_auskunftsverlangen_bnetza_2026-03-03.docx ist für die Fallauswertung vorhanden.
    path: 02_auskunftsverlangen_bnetza_2026-03-03.docx
  - id: p01-datenauswertung-massnahmenquote
    check_type: human_review
    description: Die tatsaechliche Zweckrichtung des Systems muss durch Verknuepfung von Alert-Log (Aktenstueck
      07) und Massnahmen-Log (Aktenstueck 08) selbststaendig quantifiziert werden; kein Aktenstueck nennt die Quoten.
  - id: p02-diskrepanz-doku-vertrieb
    check_type: human_review
    description: Die gewollte Diskrepanz zwischen Produktdokumentation und Vertriebs-Pitchdeck muss erkannt und
      fuer die Verantwortungszurechnung verwertet werden.
  - id: p03-normstand-sorgfalt
    check_type: human_review
    description: Der Umgang mit dem beweglichen Normstand muss dem behoerdlichen Normstand-Vermerk (Aktenstueck
      12) entsprechen.
  - id: p04-verbotstatbestand-und-ausnahme
    check_type: human_review
    description: Der Verbotstatbestand der Emotionserkennung am Arbeitsplatz und die Ausnahme muessen methodisch
      sauber geprueft werden.
  - id: p05-rollenverteilung-anbieter-betreiber
    check_type: human_review
    description: Die Verantwortungsabgrenzung zwischen Anbieterin und Betreiberin muss differenziert vorgenommen
      werden.
  - id: p06-parallele-dsgvo-ebene
    check_type: human_review
    description: Die datenschutzrechtliche Parallelebene und die Behoerdenkoordination muessen zutreffend eingeordnet
      werden.
