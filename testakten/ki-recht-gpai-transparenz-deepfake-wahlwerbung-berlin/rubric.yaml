name: ki-recht-gpai-transparenz-deepfake-wahlwerbung-berlin
plugin: "ki-vo-ai-act-pruefer"
description: 'Schnittstellen-Akte zu GPAI und Deepfake-Transparenz nach der Verordnung (EU) 2024/1689: Eine Berliner
  Agentur erzeugt mit dem Integrator-Dienst SzenenWerk Studio (Kampagnenschmiede GmbH) auf Basis des GPAI-Modells
  Nordlys Vision 3 (Nordlys Model Works ApS, Daenemark) zwei fotorealistische Deepfake-Videos eines OB-Kandidaten
  und veroeffentlicht sie ohne Kennzeichnung. Prueffragen: Deepfake-Kennzeichnungspflichten und deren zeitliche
  Anwendbarkeit, Pflichtenverteilung GPAI-Anbieter, nachgelagerter Anbieter und Betreiber, Trainingsdaten-Transparenz,
  aeusserungsrechtliche Parallelebene (einstweilige Verfuegung) und Plattform-Ebene (DSA-Meldung und Entfernung).'
checks:
  - id: datei-01-nutzungsbedingungen-auszug-nordlys-2026-01
    check_type: file_exists
    description: Das Primäraktenstück 01_nutzungsbedingungen_auszug_nordlys_2026-01.docx ist für die Fallauswertung
      vorhanden.
    path: 01_nutzungsbedingungen_auszug_nordlys_2026-01.docx
  - id: datei-02-generierungs-logs-szenenwerk-2026-05-26-bis-2026-06-0
    check_type: file_exists
    description: Das Primäraktenstück 02_generierungs_logs_szenenwerk_2026-05-26_bis_2026-06-02.docx ist für die
      Fallauswertung vorhanden.
    path: 02_generierungs_logs_szenenwerk_2026-05-26_bis_2026-06-02.docx
  - id: p01-datenauswertung-kennzeichnungsluecke
    check_type: human_review
    description: Herstellungskette und Kennzeichnungsluecke muessen aus der Metadaten-CSV (Aktenstueck 03) und der
      Timeline-CSV (Aktenstueck 04) selbststaendig rekonstruiert und berechnet werden; dabei ist der Zeitzonenunterschied
      (Metadaten in UTC, Timeline in MESZ) zu beachten.
  - id: p02-diskrepanz-eidesstattliche-versicherung
    check_type: human_review
    description: Die gewollte Diskrepanz zwischen der eidesstattlichen Versicherung und der objektiven Beweislage
      muss erkannt und in ihren prozessualen und strafrechtlichen Konsequenzen benannt werden.
  - id: p03-normstand-sorgfalt
    check_type: human_review
    description: Die zentrale Normstandsfrage der zeitlichen Anwendbarkeit der Transparenzpflichten muss erkannt
      und methodisch sauber behandelt werden.
  - id: p04-pflichtenverteilung-wertschoepfungskette
    check_type: human_review
    description: Die Verantwortung je Stufe der Kette (GPAI-Anbieter, nachgelagerter Anbieter, Betreiber, Auftraggeber)
      muss differenziert zugeordnet werden.
  - id: p05-aeusserungsrechtliche-ebene
    check_type: human_review
    description: Die presse- und aeusserungsrechtliche Parallelebene muss eigenstaendig und methodisch korrekt geprueft
      werden.
  - id: p06-plattform-und-behoerdenebene
    check_type: human_review
    description: Die DSA-Plattformebene und der marktueberwachungsrechtliche Weg muessen zutreffend dargestellt
      und voneinander abgegrenzt werden.
