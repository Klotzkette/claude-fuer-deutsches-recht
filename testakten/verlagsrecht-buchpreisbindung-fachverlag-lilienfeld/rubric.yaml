name: Verlagsrecht Buchpreisbindung Fachverlag Lilienfeld
plugin: verlagsrecht-buchpreisbindung
checks:
- id: r01-readme-vorhanden
  check_type: file_exists
  description: Die Aktenbeschreibung ist vorhanden.
  path: README.md
- id: r02-gesamt-pdf-vorhanden
  check_type: file_exists
  description: Die vollständige Lesefassung ist gebaut.
  path: gesamt-pdf/verlagsrecht-buchpreisbindung-fachverlag-lilienfeld_gesamt.pdf
- id: r03-vollstaendiger-arbeitsbestand
  check_type: working_file_count
  description: Mindestens zehn exportierbare Originalunterlagen sind vorhanden.
  min: 10
- id: r04-verlagsvertrag
  check_type: file_exists
  description: Der unterzeichnete Verlagsvertrag ist vorhanden.
  path: 01-verlagsvertrag-bremer-12-09-2023.docx
- id: r05-lagerschadenprotokoll
  check_type: file_exists
  description: Das gemeinsame Sortier- und Lagerschadenprotokoll ist vorhanden.
  path: 03-lagerschadenprotokoll-remittenden-23-03-2026.docx
- id: r06-maengelexemplare-korrespondenz
  check_type: text_contains
  description: Die Händlerkorrespondenz beziffert Restbestand und bereits verkaufte Exemplare.
  path: 08-email-haendler-maengelexemplare-27-04-2026.eml
  contains: 17 Exemplare verkauft
- id: r07-praxisplus-rohdaten
  check_type: text_contains
  description: Der Plattformexport enthält die April-Abrechnung des PraxisPlus-Pakets.
  path: 10-plattformverkaeufe-q1-q2-2026.csv
  contains: 2026-04-01;PraxisPlus;LF-WW-3-P1;83;11537,00
- id: r08-campuslizenz
  check_type: text_contains
  description: Die Beschaffungsanfrage enthält die Campuslizenz als konkreten Verhandlungsgegenstand.
  path: 06-campuslizenzanfrage-hsm-20-05-2026.docx
  contains: Campuslizenz
