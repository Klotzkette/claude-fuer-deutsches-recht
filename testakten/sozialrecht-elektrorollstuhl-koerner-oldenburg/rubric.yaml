name: sozialrecht-elektrorollstuhl-koerner-oldenburg
plugin: "fachanwalt-sozialrecht"
description: Hilfsmittelstreit um Elektrorollstuhl nach Paragraf 33 SGB V mit MD-Ablehnung, privatem Reha-Gutachten,
  vollstaendiger Klage, Kassenverteidigung, Beweisbeschluss und gerichtlichem Sachverstaendigengutachten.
checks:
  - id: datei-02-ueberweisung-und-hilfsmittelverordnung
    check_type: file_exists
    description: Die eigenständige fachärztliche Überweisung ist für die Fallauswertung vorhanden.
    path: 02_ueberweisung_facharzt_2026-05-08.docx
  - id: fachpruefung-01
    check_type: human_review
    description: Klagefrist aus dem Widerspruchsbescheid korrekt erkennen.
  - id: fachpruefung-02
    check_type: human_review
    description: Anspruch aus Paragraf 33 SGB V sauber vom bloßen Komfortinteresse abgrenzen.
  - id: fachpruefung-03
    check_type: human_review
    description: Gehstock, Rollator, manuellen Rollstuhl und Elektrorollstuhl funktional vergleichen.
  - id: fachpruefung-04
    check_type: human_review
    description: Wirtschaftlichkeit nicht mit billigster Versorgung verwechseln.
  - id: fachpruefung-05
    check_type: human_review
    description: MD-Aktenlage gegen persönliche Untersuchung, Reha-Gutachten und gerichtliches Sachverständigengutachten
      beweiswürdigend einordnen.
  - id: fachpruefung-06
    check_type: human_review
    description: Klageschrift, Klageerwiderung und Beweisbeschluss inhaltlich sauber auseinanderhalten.
  - id: fachpruefung-07
    check_type: human_review
    description: BSG-Rechtsprechung zum Mobilitätsausgleich, insbesondere B 3 KR 7/19 R, korrekt auf den Einzelfall anwenden
      anwenden, ohne das Ergebnis vorwegzunehmen.
  - id: fachpruefung-08
    check_type: human_review
    description: Eigene Bewertung der Beweislage entwickeln, statt eine vorgegebene Antwortmatrix zu übernehmen.
