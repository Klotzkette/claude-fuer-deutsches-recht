name: sozialrecht-wohnraumanpassung-rampe-pflegegrad-wittenberge
description: Pflegekassenstreit um feste Rampe bei Pflegegrad 3 mit Teilbewilligung, mobiler Alternative, Wohnumfeld, Sturzrisiko und möglicher Sozialhilfe.
checks:
  - Pflegegrad und Mobilitätsmodul (Treppensteigen unselbstständig) als Tatsachengrundlage nutzen.
  - Mobile Rampe funktional gegen feste Rampe vergleichen; Selbstnutzbarkeit als Kernkriterium herausarbeiten.
  - Zuschussgrenze des § 40 Abs. 4 SGB XI, Eigenanteil und weitere Kostenträger (Sozialamt, Förderprogramme) sauber trennen.
  - Wohnumfeld konkret aus Maßen, Fotos, Ortsterminprotokoll und Winterrisiko würdigen.
  - Die nicht völlig deckungsgleichen Angaben zur Zahl der Stürze (Erstgespräch, Hausarzt, Tagebuch, Nachbarin) erkennen und beweiswürdigend einordnen.
  - Widerspruch nicht als Komfortwunsch, sondern als Selbstständigkeits- und Pflegeerleichterungsthema begründen; keine Beauftragung vor Förderzusage.
