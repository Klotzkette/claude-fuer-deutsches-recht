name: sozialrecht-wohnraumanpassung-rampe-pflegegrad-wittenberge
plugin: "fachanwalt-sozialrecht"
description: Pflegekassenstreit um eine feste Rampe bei Pflegegrad 3 mit Teilbewilligung, mobiler Alternative, Wohnumfeld,
  Sturzrisiko und möglicher Sozialhilfe.
checks:
  - id: datei-01-erstgespraech-tochter
    check_type: file_exists
    description: Das Primäraktenstück 01_erstgespraech_tochter.docx ist für die Fallauswertung vorhanden.
    path: 01_erstgespraech_tochter.docx
  - id: datei-02-pflegegradbescheid
    check_type: file_exists
    description: Der Pflegegradbescheid ist als eigenes Aktenstück für die Fallauswertung vorhanden.
    path: 02a_pflegegradbescheid_2024-09-18.docx
  - id: datei-02-md-pflegegutachten
    check_type: file_exists
    description: Das Pflegegutachten des Medizinischen Dienstes ist als eigenes Aktenstück für die Fallauswertung vorhanden.
    path: 02b_md_pflegegutachten_2024-09-11.docx
  - id: pflegegrad-mobilitaet
    check_type: human_review
    description: Pflegegrad 3 und das Mobilitaetsmodul als Tatsachengrundlage nutzen.
  - id: mobile-gegen-feste-rampe
    check_type: human_review
    description: Die mobile Rampe funktional gegen die feste Rampe vergleichen.
  - id: kostentraeger-datenkern
    check_type: human_review
    description: Aus der Kostentraeger-Matrix den Zuschussanspruch nachrechnen und die Traeger sauber trennen.
  - id: wohnumfeld-wuerdigung
    check_type: human_review
    description: Das Wohnumfeld konkret wuerdigen.
  - id: sturzzahl-diskrepanz
    check_type: human_review
    description: Die nicht voellig deckungsgleichen Angaben zur Zahl der Stuerze erkennen und beweiswuerdigend einordnen.
  - id: widerspruch-und-beauftragung
    check_type: human_review
    description: Den Widerspruch als Selbststaendigkeits- und Pflegeerleichterungsthema begruenden.
