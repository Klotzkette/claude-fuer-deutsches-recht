name: aml-kanzlei-fremdgeld-anteilskauf-bonn
plugin: geldwaeschepraevention-aml-kyc
description: "Mandatserweiterung, eingegangene Fremdzahlung und abweichender Rückzahlungswunsch bei einem Bonner Anteilskauf."
checks:
  - id: unterlagen
    check_type: working_file_count
    description: "Acht getrennte Originalunterlagen liegen vor."
    min: 8
  - id: konsistenz
    check_type: human_review
    description: "Namen, Beträge, Zeitpunkte und Zahlungsstände sind über alle Belege konsistent."
  - id: formate
    check_type: human_review
    description: "Originale und beide PDF-Varianten enthalten dieselben Unterlagen ohne Lösungsvorgabe."
