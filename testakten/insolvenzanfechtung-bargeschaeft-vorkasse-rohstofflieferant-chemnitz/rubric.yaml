name: insolvenzanfechtung-bargeschaeft-vorkasse-rohstofflieferant-chemnitz
plugin: "fachanwalt-insolvenz-sanierungsrecht"
description: 'Bargeschaefts-Testakte nach Paragraf 142 InsO. Eine Spritzguss-GmbH erhaelt von ihrem Granulatlieferanten
  nur noch Ware gegen Vorkasse oder Zahlung bei Lieferung (null bis fuenf Tage Vorlauf); im Dreimonatszeitraum fliessen
  214.000,08 EUR. Prueffragen: Unmittelbarkeit, Gleichwertigkeit trotz 4-Prozent-Krisenaufschlags auf zwei Rechnungen,
  Rueckausnahme fuer die Vorsatzanfechtung (Unlauterkeit und deren Erkennen), Kenntnisindizien der Vorkasse-Umstellung
  sowie die Diskrepanz zwischen einem neun Monate alten Insolvenzreife-Kurzgutachten und der Datierung im Eigenantrag.'
checks:
  - id: datei-01-vermerk-anfechtungspruefung-2026-06-08
    check_type: file_exists
    description: Das Primäraktenstück 01_vermerk_anfechtungspruefung_2026-06-08.docx ist für die Fallauswertung
      vorhanden.
    path: 01_vermerk_anfechtungspruefung_2026-06-08.docx
  - id: datei-02-rahmenliefervertrag-2023-02-15
    check_type: file_exists
    description: Das Primäraktenstück 02_rahmenliefervertrag_2023-02-15.docx ist für die Fallauswertung vorhanden.
    path: 02_rahmenliefervertrag_2023-02-15.docx
  - id: p01-unmittelbarkeit
    check_type: human_review
    description: Die Unmittelbarkeit des Leistungsaustauschs muss anhand der Matching-Tabelle konkret geprueft werden.
  - id: p02-gleichwertigkeit-krisenaufschlag
    check_type: human_review
    description: Die Gleichwertigkeit der Gegenleistung muss differenziert beurteilt werden.
  - id: p03-unlauterkeit-durchgriff-133
    check_type: human_review
    description: Der Pruefungsschwerpunkt der Rueckausnahme des Paragraf 142 Abs. 1 InsO (Vorsatzanfechtung nur
      bei Unlauterkeit des Schuldners und deren Erkennen durch den Gegner) muss als solcher erkannt und zweiseitig
      ausgefuehrt werden.
  - id: p04-kenntnis-ambivalenz-vorkasse
    check_type: human_review
    description: Die Umstellung von 60-Tage-Ziel auf Vorkasse muss als ambivalentes Kenntnis-Indiz behandelt werden.
  - id: p05-insolvenzreife-diskrepanz
    check_type: human_review
    description: Die Diskrepanz zwischen Kurzgutachten (Zahlungsunfaehigkeit zum 30.06.2025) und Eigenantrag (Zahlungsunfaehigkeit
      erst im April 2026) muss aufgedeckt und verwertet werden.
  - id: p06-rechtsfolgen-antragsstrategie
    check_type: human_review
    description: Rechtsfolge und Antragsstrategie muessen sauber gestaffelt werden.
