name: ki-recht-betreiberpflichten-fria-sozialamt-jobcenter-duisburg
plugin: "ki-vo-ai-act-pruefer"
description: 'Betreiberpflichten und Grundrechte-Folgenabschaetzung nach der Verordnung (EU) 2024/1689: Die Stadt
  Duisburg betreibt das Hochrisiko-KI-System AntragsLotse Pro zur Priorisierung von Sozialleistungsantraegen. Das
  Legacy-Regelwerk R-7 wurde ohne die vom Hersteller geforderten Voraussetzungen aktiviert; Antraege mit auslaendischem
  Geburtsstaat landeten systematisch in der Warteschlange pruefintensiv. Prueffragen: Verwendung nach Betriebsanleitung,
  wirksame menschliche Aufsicht, Eingabedaten, Logs, Betroffeneninformation, FRIA-Qualitaet und Aktualisierung,
  Meldung eines schwerwiegenden Vorfalls, Verantwortungsabgrenzung Anbieter und Betreiber.'
checks:
  - id: datei-01-beschaffungsvermerk-antragslotse-2025-09-15
    check_type: file_exists
    description: Das Primäraktenstück 01_beschaffungsvermerk_antragslotse_2025-09-15.docx ist für die Fallauswertung
      vorhanden.
    path: 01_beschaffungsvermerk_antragslotse_2025-09-15.docx
  - id: datei-02-betriebsanleitung-auszug-antragslotse-pro-v32-2025-10
    check_type: file_exists
    description: Das Primäraktenstück 02_betriebsanleitung_auszug_antragslotse_pro_v32_2025-10.docx ist für die
      Fallauswertung vorhanden.
    path: 02_betriebsanleitung_auszug_antragslotse_pro_v32_2025-10.docx
  - id: p01-datenauswertung-schieflage
    check_type: human_review
    description: Die statistische Schieflage muss aus dem Priorisierungslog (Aktenstueck 06) und den Bearbeitungszeiten
      (Aktenstueck 07) selbststaendig berechnet werden; keines der Aktenstuecke nennt die Ergebniswerte.
  - id: p02-diskrepanz-aufsicht
    check_type: human_review
    description: Die gewollte Diskrepanz zwischen formalem Schulungsnachweis und tatsaechlicher Aufsichtspraxis
      muss erkannt und rechtlich verwertet werden.
  - id: p03-normstand-sorgfalt
    check_type: human_review
    description: Der Umgang mit dem beweglichen Normstand der KI-Verordnung (Omnibus-Rechtsakte) muss dem Normstand-Vermerk
      (Aktenstueck 14) entsprechen.
  - id: p04-verwendung-entgegen-betriebsanleitung
    check_type: human_review
    description: Die bestimmungswidrige Verwendung durch die Kommune muss anhand der Betriebsanleitung praezise
      hergeleitet werden.
  - id: p05-fria-qualitaet
    check_type: human_review
    description: Die FRIA vom 18.12.2025 muss als methodisch defizitaer erkannt und die Aktualisierungspflicht benannt
      werden.
  - id: p06-vorfallmeldung-und-sofortmassnahmen
    check_type: human_review
    description: Meldeweg und Sofortmassnahmen muessen zutreffend eingeordnet werden.
