name: insolvenzanfechtung-kongruente-deckung-lieferant-mahnlauf-bielefeld
plugin: "fachanwalt-insolvenz-sanierungsrecht"
description: Prueft, ob ein Bearbeiter die Anfechtung kongruenter Deckungen nach Paragraf 130 Abs. 1 Satz 1 Nr.
  1 InsO methodisch sauber auf die Kenntnisfrage zuspitzt, die ambivalente Indizienkette vollstaendig hebt und die
  Insolvenzreife aus den Rohdaten (BWA, OPOS) selbst rekonstruiert.
checks:
  - id: datei-01-mandatsvermerk-ra-broscheit-2026-05-26
    check_type: file_exists
    description: Das Primäraktenstück 01_mandatsvermerk_ra_broscheit_2026-05-26.docx ist für die Fallauswertung
      vorhanden.
    path: 01_mandatsvermerk_ra_broscheit_2026-05-26.docx
  - id: datei-02-anfechtungsschreiben-verwalterin-2026-05-11
    check_type: file_exists
    description: Das Primäraktenstück 02_anfechtungsschreiben_verwalterin_2026-05-11.docx ist für die Fallauswertung
      vorhanden.
    path: 02_anfechtungsschreiben_verwalterin_2026-05-11.docx
  - id: norm-und-zeitraum
    check_type: human_review
    description: Die richtige Anfechtungsnorm und der richtige Dreimonatszeitraum werden bestimmt.
  - id: belastende-indizienkette
    check_type: human_review
    description: Die belastenden Indizien fuer die Kenntnis der Zahlungsunfaehigkeit werden vollstaendig aus den
      verstreuten Aktenstuecken gesammelt.
  - id: entlastende-indizien
    check_type: human_review
    description: Die entlastenden Umstaende werden nicht unterschlagen, sondern in die Wuerdigung nach Paragraf
      130 Abs. 2 InsO eingestellt.
  - id: insolvenzreife-aus-rohdaten
    check_type: human_review
    description: Die objektive Zahlungsunfaehigkeit wird ohne Gutachten aus der BWA-Reihe und der OPOS-Liste rekonstruiert.
  - id: diskrepanz-verwalterschreiben
    check_type: human_review
    description: Der Widerspruch zwischen der Datierung im Anfechtungsschreiben (Zahlungsunfaehigkeit erst ab 12.10.2025)
      und den mitgelieferten Anlagen wird erkannt und strategisch eingeordnet.
  - id: rechtsfolgen-und-vergleich
    check_type: human_review
    description: Rechtsfolgen, Sekundaerpunkte und Vergleichsoptionen werden behandelt.
