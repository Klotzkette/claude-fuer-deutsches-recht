name: rentenrecht-fremdrente-russlanddeutscher-sibirien-bielefeld
description: Kontenklärung eines 1992 zugezogenen Russlanddeutschen mit FRG-Zeiten, Qualifikationsgruppenstreit, Sechstelkürzung glaubhaft gemachter Zeiten und abweichenden Archivnummern.
checks:
  - Nachweis und Glaubhaftmachung strikt trennen und je Zeitraum getrennt bearbeiten.
  - Qualifikationsgruppenzuordnung anhand der Tätigkeit im Herkunftsgebiet prüfen, nicht anhand der fehlenden deutschen Anerkennung des Abschlusses.
  - Abweichende Archivnummern über den Fondswechsel R-2214/R-2298 aufklären statt als Widerspruch stehen zu lassen.
  - Namensvarianten (Klassen/Klasssen) als Transliterationsfrage behandeln und dokumentieren.
  - Sechstelanrechnung glaubhaft gemachter Zeiten und Entgeltpunktbegrenzung als getrennte Angriffspunkte erkennen.
  - Erklärung zu ausländischem Rentenbezug fristgerecht abgeben; Mitwirkungsfrist 17.07.2026 und Widerspruchsfrist auseinanderhalten.
  - Studienzeit 1976 bis 1981 als möglichen Anrechnungszeittatbestand nicht fallen lassen.
  - Keine ausländerrechtliche Nebenberatung; Fokus auf Versicherungsverlauf und Bewertung.
