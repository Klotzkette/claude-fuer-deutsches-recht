name: strafrecht-tkue-zufallsfund-verwertung-korruption-leipzig
plugin: "aktenaufbereiter-strafrecht"
description: Zufallsfund aus einer TKUe nach Paragraf 100a StPO in einem BtM-Verfahren belegt Bestechlichkeit eines
  Sachbearbeiters der Fahrerlaubnisbehoerde; zu pruefen sind die Verwendungsregel des Paragraf 479 Abs. 2 StPO mit
  hypothetischem Ersatzeingriff und die Quantifizierung des Telefonat-Termin-Einzahlungs-Musters aus drei CSV-Dateien
  samt Widerlegung der Flohmarkt-Einlassung durch den Ehefrau-Chat.
checks:
  - id: datei-01-tkue-beschluss-ag-leipzig-2025-10-06
    check_type: file_exists
    description: Das Primäraktenstück 01_tkue_beschluss_ag_leipzig_2025-10-06.docx ist für die Fallauswertung vorhanden.
    path: 01_tkue_beschluss_ag_leipzig_2025-10-06.docx
  - id: datei-02-vermerk-kpi-zufallsfund-2026-01-20
    check_type: file_exists
    description: Das Primäraktenstück 02_vermerk_kpi_zufallsfund_2026-01-20.docx ist für die Fallauswertung vorhanden.
    path: 02_vermerk_kpi_zufallsfund_2026-01-20.docx
  - id: p1-verwendungsregel-katalogtat
    check_type: human_review
    description: Wird die richtige Verwendungsschranke fuer den Zufallsfund identifiziert und angewendet?
  - id: p2-hypothetischer-ersatzeingriff
    check_type: human_review
    description: Streitpunkt Einzelfallschwere und Subsidiaritaet beim hypothetischen Ersatzeingriff (Paragraf 100a
      Abs. 1 Satz 1 Nr. 2 und 3 StPO).
  - id: p3-muster-quantifizieren
    check_type: human_review
    description: 'Datenauswertungs-Kern mit konkreten Werten: Das Muster muss aus Gespraechs-CSV, Terminkalender-CSV
      und Konto-CSV zusammengesetzt und beziffert werden.'
  - id: p4-diskrepanz-flohmarkt-chat
    check_type: human_review
    description: 'Diskrepanz-Pflichtpunkt: Die Flohmarkt-Einlassung des Beschuldigten widerspricht dem Chat mit
      der Ehefrau.'
  - id: p5-dienstpflichtverletzung-abgrenzung
    check_type: human_review
    description: Abgrenzung Paragraf 332 zu Paragraf 331 StGB fuer die fuenf Faelle ohne fehlende Nachweise.
  - id: p6-fernwirkung-folgebeweise
    check_type: human_review
    description: Reichweite eines etwaigen Verwertungsverbots fuer Terminkalender, Kontodaten, Durchsuchungsfunde
      und Chat.
