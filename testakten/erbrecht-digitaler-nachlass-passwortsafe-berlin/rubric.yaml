name: erbrecht-digitaler-nachlass-passwortsafe-berlin
plugin: "fachanwalt-erbrecht"
description: Fachspezifische Qualitätsprüfung der vollständigen Akte erbrecht-digitaler-nachlass-passwortsafe-berlin.
checks:
  - id: datei-02-chronologie-arbeitsstand
    check_type: file_exists
    description: Das Primäraktenstück 02_chronologie_arbeitsstand.docx ist vorhanden.
    path: 02_chronologie_arbeitsstand.docx
  - id: fachpruefung-01
    check_type: human_review
    description: Erbrechtlichen Übergang von Nutzerkonten, Passwortsafe, Studiorechner und Bildarchiv von urheber-
      und datenschutzrechtlichen Grenzen trennen.
  - id: fachpruefung-02
    check_type: human_review
    description: Testament, Notizzettel, Erbschein und Besitzlage der Zugangsmittel auf Erbenstellung, Auslegung
      und Beweisrisiken prüfen.
  - id: fachpruefung-03
    check_type: human_review
    description: Sicherung, Auskunft, Herausgabe, Kontozugang und Verwertung der Bildrechte als abgestufte Nachlassstrategie
      mit konkreten Anträgen formulieren.
