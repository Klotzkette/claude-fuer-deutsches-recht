name: bauwirtschaft-hoai-8-bauueberwachung-kita-verden
plugin: bauwirtschaft
description: 'Erweiterung einer Kita mit verspätem Detailversand, konkret protokollierter
  Ortskontrolle, verdecktem Türanschluss, gemeinsamem geometrischem Aufmaß, kumulativer
  Schlussrechnung und nur teilweise bestätigtem Nachtrag. Präzises Übungsgebiet: tatsächliche
  Bauüberwachung mit Erkenntnisgrenzen, Mengen-/Kostenabgleich, Abnahmevorbehalte,
  Übergabe und Nachkontrolle der Abnahmemängel.'
checks:
- id: vorort
  check_type: human_review
  description: Tatsächliche Beobachter, Planversand und verdeckte Bereiche unterscheiden.
    Aus dem nachgereichten Plan oder der Fertigmeldung keine eigene Ortskontrolle
    oder vollständige Anschlussfreigabe erzeugen.
- id: mengen
  check_type: human_review
  description: 216 m² aus 18 mal 12 geometrisch prüfen; sechs Meter Zusatzanschluss
    nicht als zusätzliche Fläche übernehmen. Vertragsbasis 36986 EUR netto, bestätigtes
    N1 900 EUR netto und nicht bestätigtes N2 980 EUR auseinanderhalten.
- id: rechnung
  check_type: human_review
  description: Unternehmerforderung 39640 EUR netto mit geometrischer Basis abgleichen.
    Tatsächlich gezahlte 29750 EUR brutto nur einmal abziehen; Rechnungskorrektur
    und mangelsbezogenen Einbehalt getrennt prüfen.
- id: abnahme
  check_type: human_review
  description: Abnahme 30.07. mit M-01/M-02 von Übergabe 14.08. trennen. Nachkontrolle
    bestätigt nur M-02; M-01 bleibt hinter dem Türfuß ungeprüft. Abnahmemängel bleiben
    LPH-8-Beseitigungsüberwachung.
- id: kosten
  check_type: human_review
  description: Projektjournal enthält Eingangsrechnungen und Vertragswerte, keine
    fertige Kostenfeststellung. Gebäudeabschluss nicht allein aus Dachrechnung erklären;
    Planerleistung, Gebühren und andere Gewerke getrennt führen.
