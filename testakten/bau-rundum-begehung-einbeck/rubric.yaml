name: bau-rundum-begehung-einbeck
plugin: bauwirtschaft-anfaenger
author: Klotzkette
description: "Begehungsmemo, Randnotizen, Messwerte und zwei illustrierte Befundskizzen zu Ausbauarbeiten; getrennte Vertrags- und Abnahmestände der beteiligten Gewerke."
checks:
  - id: fachpruefung-1
    check_type: human_review
    description: "Einzelbeobachtungen mit Raum, Bauteil, Zeit, Quelle und Messgrenze erfassen; B01 0,4 mm nicht zu 4 mm machen und L14 nicht als L12 führen."
  - id: fachpruefung-2
    check_type: human_review
    description: "Gewerke und Firmen zuordnen, aber bei Fensteranschluss und Bodenablauf keine alleinige Verursachung aus der Vertragskarte ableiten."
  - id: fachpruefung-3
    check_type: human_review
    description: "Abnahme Elektro vom 10.09. getrennt von den noch nicht abgenommenen Gewerken behandeln; passende Rechtsgrundlage und Fristen fachlich prüfen lassen, nicht blind vereinheitlichen."
  - id: fachpruefung-4
    check_type: human_review
    description: "Skizzen nicht als Fotos oder Messpläne bezeichnen; angebotene Termine nicht zu gesetzten Fristen und Beobachtungen nicht zu bewiesenen Ursachen umdeuten."
  - id: original-01
    check_type: file_exists
    path: "01_Lenz_an_Doering.eml"
    description: "Eigenständige Originalunterlage 01_Lenz_an_Doering.eml"
