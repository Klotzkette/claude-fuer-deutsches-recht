name: strafrecht-untreue-vereinskasse-kassel
description: Untreueverfahren gegen einen Vereinsvorstand mit Kassenbuch, Sponsoringgeldern, Barabhebungen, Einziehungsfragen und zivilrechtlicher Rückforderung.
checks:
  - Verfahrensrolle, Fristen und nächstes Arbeitsprodukt vor der materiellen Prüfung klären.
  - Belastende und entlastende Tatsachen nicht vermischen, sondern je Beweismittel ausweisen.
  - Sicherstellungskette, Belehrung und digitale Originaldaten gesondert prüfen.
  - Normanker nur als Arbeitshilfe verwenden und Subsumtion am konkreten Sachverhalt durchführen.
  - Nebenfolgen wie Einziehung, Fahrerlaubnis, Kontaktverbot, Haft oder Berufsfolgen ausdrücklich mitdenken.
  - Aus dem Kassenbuch-Konto-Abgleich (Datei 10) die Summe der Barabhebungen von 71500.00 EUR und die anerkannten Belege von 22880.00 EUR ermitteln, daraus den ungeklaerten Fehlbetrag von 48620.00 EUR errechnen, die drei nicht anerkannten Quittungen ueber 4150.00 EUR gesondert ausweisen und dies der Einlassung (bare Auslagen, Belege beim Umzug verloren) gegenueberstellen.
