name: bau-rundum-behinderung-soest
plugin: bauwirtschaft-anfaenger
author: Klotzkette
description: "Ein Bauleiterdiktat und zeitnahe Ausführungsbelege zu einer nicht freigegebenen Arbeitsfläche, einem geänderten Öffnungsplan und verfügbaren Ausweicharbeiten. Eine förmliche Anzeige liegt noch nicht vor."
checks:
  - id: fachpruefung-1
    check_type: human_review
    description: "Aus Diktat und Belegen erst einen förmlichen Entwurf erstellen; die Akte enthält noch keine bereits versandte Behinderungsanzeige."
  - id: fachpruefung-2
    check_type: human_review
    description: "Offene Rinne und geändertes Bewehrungsdetail mit jeweils eigenem Beginn, Ursache, Betroffenheit und Nachweis darstellen; Adressat und Zugang vor Versand prüfen."
  - id: fachpruefung-3
    check_type: human_review
    description: "Ausweicharbeiten West und freie Ostabschnitte berücksichtigen; Koordination und Warten nicht ohne Aufschlüsselung als Stillstand abrechnen."
  - id: fachpruefung-4
    check_type: human_review
    description: "Keine sichere Verlängerung bis zum Rohbauende, keine ungeprüfte Geldforderung und keine erfundene Freigabe erklären; technische und rechtliche Kontrolle vor Versand vorsehen."
