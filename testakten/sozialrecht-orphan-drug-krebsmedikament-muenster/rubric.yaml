name: sozialrecht-orphan-drug-krebsmedikament-muenster
description: Eilfall zur Kostenübernahme eines extrem teuren Orphan-Drug-Krebsmedikaments mit Tumorboard, MD-Ablehnung, Kassenbescheid und Eilantrag.
checks:
  - Lebensbedrohliche Erkrankung und fehlende Standardalternative herausarbeiten und belegen.
  - Orphan-Drug-Zulassung für eine andere Tumorentität nicht mit sicherer Leistungspflicht verwechseln.
  - Wirtschaftlichkeit konkret gegen Nutzen- und Folgenabwägung stellen, ohne die Kostendimension kleinzureden.
  - MD-Aktenlage auf fehlende persönliche Befassung, fehlende Würdigung des LZ-4-Befunds und den abstrakten Verweis auf Best Supportive Care prüfen.
  - Eilantrag mit konkretem Anordnungsgrund aus Therapieslot 11.07.2026 und Herstellerreservierung bis 05.07.2026 formulieren.
  - Das gestufte Vorgehen (erste Dosis mit Monitoring und erneuter Entscheidung) als Vergleichslinie erkennen und rechtlich einordnen.
