name: bau-rundum-nachtrag-northeim
plugin: bauwirtschaft-fortgeschrittene
description: Angebot für eine geänderte Rohrdimension mit unklarer Reichweite einer
  Baustellenanweisung, abschnittsweisen Mengen, ursprünglicher Preisermittlung, aktuellem
  Lieferangebot und noch ausstehender Bauherrenentscheidung.
checks:
- id: sachpruefung-1
  check_type: human_review
  description: Änderungswunsch, technische Anweisung, Vertretungsmacht und Preisvereinbarung
    anhand getrennter Belege beurteilen.
- id: sachpruefung-2
  check_type: human_review
  description: Geänderte, entfallende und unveränderte Mengen sowie Preisbestandteile
    nachvollziehbar abgrenzen.
- id: sachpruefung-3
  check_type: human_review
  description: Fristen und offene Entscheidungen aus dem Schriftverkehr führen, ohne
    bereits eine Beauftragung oder einen Anspruch zu unterstellen.
- id: original-01
  check_type: file_exists
  path: 01_Bauauftrag_Entwaesserung.docx
  description: Eigenständige Originalunterlage vorhanden.
