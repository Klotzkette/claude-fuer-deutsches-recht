name: bau-rundum-angebotspruefung-goslar
plugin: bauwirtschaft-fortgeschrittene
description: Öffentliches Bauvergabeverfahren mit verschlossenem elektronischem Eingang,
  drei positionsbezogenen Angeboten, technischen Abweichungen, fehlenden Nachweisen
  und begrenztem Zugriff auf Bieterdaten.
checks:
- id: sachpruefung-1
  check_type: human_review
  description: Eingang, Öffnung und Integrität von Vollständigkeit und Wertung getrennt
    behandeln.
- id: sachpruefung-2
  check_type: human_review
  description: Bieterforderungen, Verfahrensvorgaben und rechtliche Zulässigkeit einer
    Nachforderung unterscheiden.
- id: sachpruefung-3
  check_type: human_review
  description: Drei Angebotssummen positionsbezogen nachvollziehen; Produktgleichwertigkeit
    nicht aus einem Werbetext ableiten.
- id: sachpruefung-4
  check_type: human_review
  description: Vertraulichkeit wahren und weder Nachforderung noch Zuschlag eigenständig
    versenden.
- id: original-01
  check_type: file_exists
  path: 01_Verfahrensbedingungen.docx
  description: Eigenständige Originalunterlage vorhanden.
