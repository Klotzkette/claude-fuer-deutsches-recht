name: unterhalt-stufenklage-selbststaendiger-hamburg
plugin: "fachanwalt-familienrecht"
description: Fachspezifische Qualitätsprüfung der vollständigen Akte unterhalt-stufenklage-selbststaendiger-hamburg.
checks:
  - id: datei-02-familien-und-kinderdaten
    check_type: file_exists
    description: Das Primäraktenstück 02_familien_und_kinderdaten.docx ist vorhanden.
    path: 02_familien_und_kinderdaten.docx
  - id: fachpruefung-01
    check_type: human_review
    description: Auskunft, Belegvorlage, eidesstattliche Versicherung und Zahlung in der Stufenklage prozessual
      sauber trennen.
  - id: fachpruefung-02
    check_type: human_review
    description: Einkommen des Selbständigen aus BWA, Entnahmen, Firmenwagen und Ferienwohnung mehrjährig aufbereiten
      und Lücken oder Manipulationsrisiken kennzeichnen.
  - id: fachpruefung-03
    check_type: human_review
    description: Kindes- und Trennungsunterhalt, Mehrbedarf, Verzug und vorläufigen Rechtsschutz mit konkreten Anträgen
      und offenen Zahlenvarianten verbinden.
