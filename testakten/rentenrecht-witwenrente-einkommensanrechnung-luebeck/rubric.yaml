name: rentenrecht-witwenrente-einkommensanrechnung-luebeck
plugin: "rentenpruefer"
description: Witwenrente mit Sterbevierteljahr, grosser Witwenrente, Einkommensanrechnung, Betriebsrente, privater
  Sofortrente, KVdR-Abzuegen und daenischer Kontenluecke.
checks:
  - id: datei-14-daenemark-mappe
    check_type: file_exists
    description: Die Abschrift der Mappe Dänemark 1984 bis 1986 ist als eigenes Aktenstück vorhanden.
    path: 14_daenemark_mappe_nordbaltic_unterlagen.docx
  - id: datei-02-drv-bescheid-witwenrente
    check_type: file_exists
    description: Das Primäraktenstück 02_drv_bescheid_witwenrente.docx ist für die Fallauswertung vorhanden.
    path: 02_drv_bescheid_witwenrente.docx
  - id: r01-anrechnung-datenkern
    check_type: human_review
    description: Einkommensanrechnung und Zahlbetrag je Monat aus der Tabelle 13_witwenrente_anrechnung_berechnung.csv
      nachrechnen.
  - id: r02-sterbevierteljahr-trennen
    check_type: human_review
    description: Sterbevierteljahr von der Zeit ab August 2026 trennen.
  - id: r03-private-sofortrente
    check_type: human_review
    description: Private Sofortrente nicht ohne Pruefung wie Arbeitsentgelt behandeln und die Herkunft aus einer
      Einmalzahlung wuerdigen.
  - id: r04-betriebsrente-abgrenzen
    check_type: human_review
    description: Eigene HZVK-Betriebsrente der Witwe von der HansePort-Witwenversorgung des Verstorbenen abgrenzen.
  - id: r05-kvpv-differenz
    check_type: human_review
    description: Differenz zwischen Beitragsabzug im Bescheid und Krankenkassenmitteilung erkennen und klaeren.
  - id: r06-daenemark-kontenklaerung
    check_type: human_review
    description: Kontenklaerung der daenischen Beschaeftigungszeiten als eigenen Antrag erkennen und widerspruechliche
      Arbeitgeberangaben aufklaeren.
