name: rentenrecht-witwenrente-einkommensanrechnung-luebeck
description: Witwenrente mit Sterbevierteljahr, großer Witwenrente, Einkommensanrechnung, Betriebsrente, privater Sofortrente, KVdR-Abzügen und dänischer Kontenlücke.
checks:
  - Sterbevierteljahr von der Zeit ab August 2026 trennen.
  - Große Witwenrente und Einkommensanrechnung nach Einkommensarten aufarbeiten.
  - Bescheidbetrag nicht übernehmen, sondern Zwischenschritte und Freibetrag nachfordern.
  - Private Sofortrente nicht ohne Prüfung wie Arbeitsentgelt behandeln; Herkunft aus Einmalzahlung würdigen.
  - Eigene HZVK-Betriebsrente der Witwe von der HansePort-Witwenversorgung des Verstorbenen abgrenzen.
  - Differenz zwischen Beitragsabzug im Bescheid und Krankenkassenmitteilung erkennen und klären.
  - Kontenklärung der dänischen Beschäftigungszeiten als eigenen Antrag erkennen; widersprüchliche Arbeitgeberangaben (Nordbaltic Kolding, NordSø Esbjerg) aufklären statt glätten.
  - Behandlung von Einmalzahlungen (Urlaubsgeld, Jahressonderzahlung) bei der Anrechnung hinterfragen.
