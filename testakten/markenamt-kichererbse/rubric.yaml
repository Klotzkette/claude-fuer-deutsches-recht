- id: fachpruefung-1
  check_type: human_review
  description: Die Erwiderung ordnet das deutsche ältere Recht, den unvollständigen Übertragungsnachweis und das
    nach Brexit nicht allein tragfähige UK-Recht getrennt zu.
- id: fachpruefung-2
  check_type: human_review
  description: Ein Benutzungsnachweis wird nur bei gegebenen Voraussetzungen und für den einschlägigen Zeitraum
    verlangt. Lizenzvertrag, Artikelnummer, Rechnung und Zeichenbenutzung werden konkret zusammengeführt.
- id: fachpruefung-3
  check_type: human_review
  description: Eine Rechnung aus 2026 ersetzt den fehlenden Beleg aus dem maßgeblichen früheren Zeitraum nicht ohne
    weitere Begründung. OSSA wird mit seinen Grenzen verwendet.
- id: fachpruefung-4
  check_type: human_review
  description: Die breite Vergleichsklausel wird auf Rechte, Gebiete, Waren, Verzicht und Kosten geprüft; ihr Versand
    und eine Rücknahme benötigen eine konkrete Autorisierung.
