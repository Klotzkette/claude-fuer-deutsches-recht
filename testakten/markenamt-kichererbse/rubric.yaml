name: markenamt-kichererbse
plugin: markenamt-assistent
description: Eine Berliner Lebensmittelherstellerin bereitet die Verteidigung ihrer Unionsmarkenanmeldung vor. Ein
  älteres Zeichen, eine unklare Übertragung, britische Benutzungsunterlagen und eine jüngere Lizenz erzeugen mehrere
  voneinander unabhängige Beweisfragen.
