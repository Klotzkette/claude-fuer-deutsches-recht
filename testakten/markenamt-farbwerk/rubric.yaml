- id: fachpruefung-1
  check_type: human_review
  description: Die Prüfung unterscheidet die abstrakte Farbe von farbigem Logo und Produktgestaltung. Beide Befragungen
    werden nach Auswahl, Verkehrskreis und Aussagegegenstand gewürdigt.
- id: fachpruefung-2
  check_type: human_review
  description: Der Firmenbestand und die Umfirmierung werden anhand der Unterlagen vom rechtsgeschäftlichen Inhaberwechsel
    getrennt.
- id: fachpruefung-3
  check_type: human_review
  description: Die Monatsendnotiz wird mit dem belegten Eintragungsdatum 2021 und der Übergangsgrenze des §159 MarkenG
    abgeglichen, statt allein aus der Anmeldung 2018 übernommen.
- id: fachpruefung-4
  check_type: human_review
  description: Die unbelegte Herkunftswerbung 1897 wird mit den konkreten Qualitäts- und Traditionsaussagen geprüft;
    Fauré Le Page wird nicht als allgemeines Verbot von Zahlen behandelt.
- id: fachpruefung-5
  check_type: human_review
  description: OBI-Orange wird hinsichtlich Verkehrskreis, Beweislast und abweichendem Altantragsrecht eingeordnet.
    Eine einzelne Befragungsquote erzeugt keine automatische Schutzfähigkeit.
