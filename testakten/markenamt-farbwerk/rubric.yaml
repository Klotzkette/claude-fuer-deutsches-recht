name: markenamt-farbwerk
plugin: markenamt-assistent
description: Eine inhabergeführte Baumarktkette verteidigt eine abstrakte Farbmarke. Zwei Befragungen verwenden
  unterschiedliche Grundgesamtheiten und Stimuli. Parallel sind Umfirmierung, Registeranschrift, Verlängerung und
  ein privates Gebührenangebot zu bearbeiten.
checks:
- id: originalbestand
  check_type: working_file_count
  description: Zwanzig getrennte Arbeitsunterlagen ohne Bewertungs- oder Downloadmetadaten liegen vor.
  min: 20
- id: beleg-01
  check_type: file_exists
  path: 01_Mandatsaufnahme.docx
  description: Aufnahme Farbwerk
- id: beleg-02
  check_type: file_exists
  path: 02_Registerblatt_Abschrift.pdf
  description: Arbeitsabschrift des Markenbestands
