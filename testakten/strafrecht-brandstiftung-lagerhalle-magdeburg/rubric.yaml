name: strafrecht-brandstiftung-lagerhalle-magdeburg
plugin: "fachanwalt-strafrecht"
description: Brandstiftungsakte mit Versicherungsmotiv, Brandsachverstaendigem, Videoausfall und Zutrittslog; Kern
  ist das Minutenprotokoll der Brandnacht zur Ableitung des Legungsindizes sowie der Abgleich von Versicherungssumme
  und Inventarwert zur Ueberversicherung.
checks:
  - id: datei-neu-primaerbeleg
    check_type: file_exists
    description: Der Primaerbeleg 13_brandursachengutachten_2026-06-12.docx ist vorhanden.
    path: 13_brandursachengutachten_2026-06-12.docx
  - id: datei-02-sachverhalt-chronologie
    check_type: file_exists
    description: Das Primäraktenstück 02_sachverhalt_chronologie.docx ist für die Fallauswertung vorhanden.
    path: 02_sachverhalt_chronologie.docx
  - id: p1-rolle-fristen-arbeitsprodukt
    check_type: human_review
    description: Verfahrensrolle, Fristen und naechstes Arbeitsprodukt vor der materiellen Pruefung klaeren.
  - id: p2-belastend-entlastend-trennen
    check_type: human_review
    description: Belastende und entlastende Tatsachen je Beweismittel getrennt ausweisen.
  - id: p3-sicherstellung-digital
    check_type: human_review
    description: Sicherstellungskette, Belehrung und digitale Originaldaten gesondert pruefen.
  - id: p4-brandnacht-und-ueberversicherung
    check_type: human_review
    description: Datenauswertungs-Kern mit konkreten Werten aus Ereignisprotokoll, Gutachten und Versicherungsdaten.
  - id: p5-diskrepanz-technischer-defekt
    check_type: human_review
    description: 'Diskrepanz-Pflichtpunkt: Die Einlassung technischer Defekt und Aufenthalt zu Hause widerspricht
      der Aktenlage.'
  - id: p6-materielle-pruefung-nebenfolgen
    check_type: human_review
    description: Subsumtion der Brand- und Betrugsdelikte, Haftgruende und Nebenfolgen mitdenken.
