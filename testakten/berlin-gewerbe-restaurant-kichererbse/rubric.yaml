offene_pruefkriterien:
- Wird Fritz Fröhlich als Inhaber der alten Erlaubnis von der übernehmenden GmbH unterschieden, ohne
  aus Kaufvertrag oder Gewerbeempfang eine Betriebserlaubnis abzuleiten?
- Wird der geplante Start am 16. Oktober 2026 nach dem dann geltenden GastG beurteilt und die erst
  ab 9. Januar 2027 geltende neue Berliner Regelung nicht vorgezogen? Werden vorläufige Erlaubnis
  bei Übernahme und vorübergehende Gestattung korrekt getrennt?
- Werden 24 Innenplätze, sechs Gehwegtische und Alkoholausschank gesondert behandelt? Wird der Nachtrag
  zum vorläufigen Verzicht auf Wein berücksichtigt, ohne baurechtliche, hygienische oder straßenrechtliche
  Freigaben zu erfinden?
- Werden die Luftanzeige von 10,8 Grad und eine nicht belegte Produkttemperatur auseinandergehalten?
  Werden Warenrückgabe und späterer Servicebericht zeitlich eingeordnet, ohne nachträgliche Messwerte
  oder bereits erfolgten Verkauf zu erfinden?
- Wird die Personalnotiz mit dem belegten Schulungsstand ausgewertet und zwischen erforderlicher
  IfSG-Belehrung, Folgebelehrung und betrieblichen Hygienenachweisen unterschieden, statt aus einer
  älteren Schulung vollständige aktuelle Erfüllung abzuleiten?
- Enthält der Word-Entwurf eine konkrete freundliche Antwort auf die Nachforderung sowie passende
  Anlagenbezeichnungen; bleibt der Excel-Eröffnungsplan bedingt und stellt jede offene Voraussetzung
  nachvollziehbar dar? Keine Einreichung ohne gesonderten Auftrag.
