name: strafrecht-vermoegensabschoepfung-einziehung-taterloese-mannheim
plugin: "aktenaufbereiter-strafrecht"
description: Einziehung von Tatertraegen nach den Paragrafen 73 ff. StGB bei gewerbsmaessigem Abrechnungsbetrug
  eines Pflegedienstes mit eigenstaendiger Berechnung des Erlangten aus CSV-Daten, Streit um das Abzugsverbot fuer
  Lohnkosten, Drittempfaenger-Einziehung gegen die Ehefrau, Vermoegensarrest auf das Privathaus und einem bewussten
  Rechenfehler der Staatsanwaltschaft.
checks:
  - id: datei-01-strafanzeige-aok-2025-09-18
    check_type: file_exists
    description: Das Primäraktenstück 01_strafanzeige_aok_2025-09-18.docx ist für die Fallauswertung vorhanden.
    path: 01_strafanzeige_aok_2025-09-18.docx
  - id: datei-02-verfuegung-sta-einleitung-2025-10-02
    check_type: file_exists
    description: Das Primäraktenstück 02_verfuegung_sta_einleitung_2025-10-02.docx ist für die Fallauswertung vorhanden.
    path: 02_verfuegung_sta_einleitung_2025-10-02.docx
  - id: p1-erlangtes-berechnen
    check_type: human_review
    description: 'Datenauswertungs-Kern: Das Erlangte muss aus der Abrechnungs-CSV und der Tourenplan-CSV selbst
      berechnet werden.'
  - id: p2-rechenfehler-sta
    check_type: human_review
    description: Die Replik der StA vom 19.06.2026 nennt nach angeblicher Ueberpruefung 416.280 EUR. Wird der Fehler
      gefunden und lokalisiert?
  - id: p3-abzugsverbot-lohnkosten
    check_type: human_review
    description: Die Verteidigung will 148.560 EUR anteilige Lohnkosten nach Paragraf 73d Abs. 1 Satz 1 StGB abziehen.
  - id: p4-diskrepanz-gps
    check_type: human_review
    description: 'Diskrepanz-Pflichtpunkt: Die Einlassung "alle Touren gefahren, nur Dokumentationsfehler" muss
      gegen die GPS-CSV gestellt werden.'
  - id: p5-drittempfaenger-ehefrau
    check_type: human_review
    description: Einziehung gegen die Ehefrau nach Paragraf 73b StGB fuer 24 Ueberweisungen zu je 2.750 EUR (66.000
      EUR).
  - id: p6-arrest-verhaeltnismaessigkeit
    check_type: human_review
    description: Vermoegensarrest nach Paragraf 111e StPO mit Sicherungshypothek auf dem Familienheim, Kontenpfaendungen
      und Streit um Uebersicherung.
