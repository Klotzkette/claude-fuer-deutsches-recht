# Auto-generierte Baseline-Rubric (v301).
# Manuelle Anpassung empfohlen - mindestens 3 weitere fall-spezifische
# Pass/Fail-Checks hinzufuegen (BAG-Az., Frist-Erwaehnung, spezifische Anlage).

name: "Kuendigungsschutzklage Weber Techlogix"
plugin: "arbeitsrecht"

checks:
  - id: r01-readme-vorhanden
    check_type: file_exists
    description: "README.md vorhanden"
    path: "README.md"

  - id: r02-gesamt-pdf-vorhanden
    check_type: file_exists
    description: "Gesamt-PDF gebaut"
    path: "gesamt-pdf/kuendigungsschutzklage-weber-techlogix_gesamt.pdf"

  - id: r03-kschg-3-wochen-frist
    check_type: regex_match
    description: "Drei-Wochen-Frist / Paragraph 4 KSchG (Ablauf 20.05.2026) sichtbar"
    path: "README.md"
    pattern: "(3-Wochen|drei.{0,3}Wochen|4 KSchG|20.05.2026|Klagefrist)"

  - id: r04-betriebsrat-erwaehnt
    check_type: regex_match
    description: "Betriebsratsanhoerung Paragraph 102 BetrVG erwaehnt"
    path: "README.md"
    pattern: "(Betriebsrat|BR-Anh|102 BetrVG)"

  - id: r05-eml-anlagen
    check_type: file_count
    description: "mindestens 3 EML-Anlagen (Kuendigungsbegleitschreiben, BR-Anhoerung, Gueteterminladung)"
    glob: "eml/*.eml"
    min: 3

  - id: r06-sozialauswahl-datenkern
    check_type: regex_match
    description: "Datenauswertungs-Kern: Sozialauswahl-Punktematrix nachrechenbar - Weber 15 Punkte (hoechster Sozialschutz) gekuendigt, Grunewald nur 2 Punkte behalten; Fehlauswahl nach Paragraph 1 Abs. 3 KSchG"
    path: "sozialauswahl_punktematrix.csv"
    pattern: "Marcus Weber,Senior IT-Administrator.*,8,2,1,4,0,15,ja"
    erwartung: "Sozialpunkte Weber 15, Grunewald 2, Sonnleitner 13; Weber gekuendigt trotz hoechstem Sozialschutz, Grunewald mit geringstem Schutz weiterbeschaeftigt"
