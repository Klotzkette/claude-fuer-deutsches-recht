name: "Kuendigungsschutzklage Weber Techlogix"
plugin: "arbeitsrecht"

checks:
  - id: r01-readme-vorhanden
    check_type: file_exists
    description: "README.md vorhanden"
    path: "README.md"

  - id: r02-gesamt-pdf-vorhanden
    check_type: file_exists
    description: "Gesamt-PDF gebaut"
    path: "gesamt-pdf/kuendigungsschutzklage-weber-techlogix_gesamt.pdf"

  - id: r03-kschg-3-wochen-frist
    check_type: regex_match
    description: "Drei-Wochen-Frist nach Paragraf 4 KSchG mit Ablauf am 20.05.2026 sichtbar"
    path: "README.md"
    pattern: "(3-Wochen|drei.{0,3}Wochen|4 KSchG|20.05.2026|Klagefrist)"

  - id: r04-betriebsrat-erwaehnt
    check_type: regex_match
    description: "Betriebsratsanhörung nach Paragraf 102 BetrVG erwähnt"
    path: "README.md"
    pattern: "(Betriebsrat|BR-Anh|102 BetrVG)"

  - id: r05-eml-anlagen
    check_type: file_count
    description: "Mindestens drei E-Mail-Anlagen zu Kündigung, Betriebsratsanhörung und Gütetermin vorhanden"
    glob: "eml/*.eml"
    min: 3

  - id: r06-sozialauswahl-datenkern
    check_type: regex_match
    description: "Sozialauswahl-Punktematrix weist Weber mit 15 und Grunewald mit zwei Punkten aus"
    path: "sozialauswahl_punktematrix.csv"
    pattern: "Marcus Weber,Senior IT-Administrator.*,8,2,1,4,0,15,ja"
    erwartung: "Sozialpunkte Weber 15, Grunewald 2, Sonnleitner 13; Weber gekündigt, Grunewald weiterbeschäftigt"

  - id: r07-gespraechsvermerk-vorhanden
    check_type: file_exists
    description: "Gesprächsvermerk zur Betriebsratsanhörung vorhanden"
    path: "gespraechsvermerk_haehnel_br_anhoerung.docx"

  - id: r08-exportfaehige-unterlagen
    check_type: working_file_count
    description: "Mindestens 22 exportierbare Arbeitsunterlagen vorhanden"
    min: 22
