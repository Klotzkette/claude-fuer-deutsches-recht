name: bau-rundum-lv-abgleich-detmold
plugin: bauwirtschaft-anfaenger
author: Klotzkette
description: "Zwei Fassungen der Baubeschreibung, ein noch nicht freigegebenes Ausbau-LV und eigenständige Planungsbeiträge für den Umbau eines privaten Lernateliers."
checks:
  - id: fachpruefung-1
    check_type: human_review
    description: "Fundstellen bis zu Fassung, Seite, Abschnitt und LV-Position nachvollziehbar belegen; BB-02 ersetzt BB-01 nur in seinem erklärten Geltungsbereich."
  - id: fachpruefung-2
    check_type: human_review
    description: "Wandaufbau, Q3/Q2, Linoleum/PVC, Sockelhöhe, T12 und Revisionsöffnungen getrennt erfassen; fehlendes Türblatt und fehlenden Deckenspiegel nicht erfinden."
  - id: fachpruefung-3
    check_type: human_review
    description: "96,00 m² Einbaufläche und 105,60 m² einschließlich Verschnitt unterscheiden; 14,88 und 29,76 m² sind verschiedene Ansichtsdefinitionen, kein Rechenfehler."
  - id: fachpruefung-4
    check_type: human_review
    description: "Keine Versand- oder technische Freigabe behaupten und den gewünschten Belegabgleich nicht durch eigenmächtige LV-Neufassung ersetzen."
  - id: fachpruefung-5
    check_type: human_review
    description: "Örtliche Boden- und Türbefunde, Lieferauskunft und Sockelstrecken zusätzlich quellenbezogen einordnen; Bestandsmaß, Planungsansatz, Einbaumenge und Liefermenge nicht gleichsetzen und Materialmuster nicht als Nutzerfreigabe behandeln."
  - id: original-01
    check_type: file_exists
    path: "01_Kuester_LV_Abgleich.eml"
    description: "Eigenständige Originalunterlage 01_Kuester_LV_Abgleich.eml"
