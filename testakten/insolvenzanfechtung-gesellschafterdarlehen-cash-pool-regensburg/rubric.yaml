name: insolvenzanfechtung-gesellschafterdarlehen-cash-pool-regensburg
plugin: "fachanwalt-insolvenz-sanierungsrecht"
description: Insolvenzanfechtung aus Verwaltersicht gegen die Konzernmutter eines Regensburger Automobilzulieferers
  wegen Cash-Pool-Rueckfuehrungen von saldiert 640.000 EUR im letzten Jahr vor dem Antrag und der Besicherung eines
  Altdarlehens durch Sicherungsuebereignung des Maschinenparks. Prueft die Qualifikation von Cash-Pool-Salden als
  Gesellschafterdarlehen, die Berechnung der anfechtbaren Rueckfuehrung (Saldo- vs. Einzelbetrachtung), Paragraf
  135 Abs. 1 Nr. 1 und Nr. 2 InsO, das Kleinbeteiligtenprivileg des Paragraf 39 Abs. 5 InsO und die Diskrepanz zwischen
  Eigenantrag und Konzern-Reporting beim Eintritt der Insolvenzreife.
checks:
  - id: datei-01-mandatsvermerk-verfahrensuebersicht
    check_type: file_exists
    description: Das Primäraktenstück 01_mandatsvermerk_verfahrensuebersicht.docx ist für die Fallauswertung vorhanden.
    path: 01_mandatsvermerk_verfahrensuebersicht.docx
  - id: datei-02-handelsregisterauszug
    check_type: file_exists
    description: Das Primäraktenstück 02_handelsregisterauszug.docx ist für die Fallauswertung vorhanden.
    path: 02_handelsregisterauszug.docx
  - id: p1-cash-pool-als-gesellschafterdarlehen
    check_type: human_review
    description: Qualifikation der Cash-Pool-Salden als Gesellschafterdarlehen im Sinne des Paragraf 39 Abs. 1 Nr.
      5 InsO.
  - id: p2-berechnung-saldo-vs-einzelbetrachtung
    check_type: human_review
    description: Nachvollziehen und Bewerten der Saldenberechnung des Verwalters (brutto 3.540.000 EUR, hilfsweise
      640.000 EUR).
  - id: p3-jahresfrist-und-kenntnisunabhaengigkeit
    check_type: human_review
    description: Fristberechnung nach Paragraf 135 Abs. 1 Nr. 2 InsO und Erkenntnis, dass es auf Kenntnis nicht
      ankommt.
  - id: p4-besicherung-nr1-zehnjahresfrist
    check_type: human_review
    description: Anfechtung der Sicherungsuebereignung des Maschinenparks nach Paragraf 135 Abs. 1 Nr. 1 InsO.
  - id: p5-kleinbeteiligtenprivileg-falle
    check_type: human_review
    description: Fallenpruefung zum Kleinbeteiligtenprivileg fuer die Rueckzahlung an den Mitgesellschafter Kastl.
  - id: p6-insolvenzreife-diskrepanz
    check_type: human_review
    description: Aufdeckung der Diskrepanz zwischen Eigenantrag und Konzernunterlagen beim Eintritt der Insolvenzreife.
