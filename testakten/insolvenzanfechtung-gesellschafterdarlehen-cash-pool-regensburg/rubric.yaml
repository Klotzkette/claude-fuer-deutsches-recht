name: insolvenzanfechtung-gesellschafterdarlehen-cash-pool-regensburg
beschreibung: Insolvenzanfechtung aus Verwaltersicht gegen die Konzernmutter eines Regensburger Automobilzulieferers wegen Cash-Pool-Rueckfuehrungen von saldiert 640.000 EUR im letzten Jahr vor dem Antrag und der Besicherung eines Altdarlehens durch Sicherungsuebereignung des Maschinenparks. Prueft die Qualifikation von Cash-Pool-Salden als Gesellschafterdarlehen, die Berechnung der anfechtbaren Rueckfuehrung (Saldo- vs. Einzelbetrachtung), Paragraf 135 Abs. 1 Nr. 1 und Nr. 2 InsO, das Kleinbeteiligtenprivileg des Paragraf 39 Abs. 5 InsO und die Diskrepanz zwischen Eigenantrag und Konzern-Reporting beim Eintritt der Insolvenzreife.
pruefpunkte:
  - id: p1_cash_pool_als_gesellschafterdarlehen
    beschreibung: Qualifikation der Cash-Pool-Salden als Gesellschafterdarlehen im Sinne des Paragraf 39 Abs. 1 Nr. 5 InsO.
    erwartung: Der Bearbeiter erkennt, dass die Sollsalden der Schuldnerin auf dem Verrechnungskonto nach Ziffer 2 des Rahmenvertrags ausdruecklich Darlehensforderungen der Poolfuehrerin sind und dass die Kreditgewaehrung durch die 92-Prozent-Gesellschafterin ueber das Zero-Balancing dem Regime der Gesellschafterdarlehen unterfaellt. Er setzt sich mit dem Gegenargument der reinen Verrechnungsbeziehung auseinander, statt es zu uebergehen.
  - id: p2_berechnung_saldo_vs_einzelbetrachtung
    beschreibung: Nachvollziehen und Bewerten der Saldenberechnung des Verwalters (brutto 3.540.000 EUR, hilfsweise 640.000 EUR).
    erwartung: Der Bearbeiter rechnet die Saldenliste nach (Anfangssaldo 1.480.000 EUR, Endsaldo 840.000 EUR, Abfuehrungen 3.540.000 EUR, Zufuehrungen 2.900.000 EUR), stellt die Streitfrage der Einzel- gegenueber der Saldo- bzw. Hoechstsaldenbetrachtung beim revolvierenden Kontokorrent dar und erkennt, dass die Neuzufuehrungen der Holding fuer die Anspruchshoehe eine tragfaehige Begrenzungsargumentation liefern koennen, ohne die Frage als geklaert auszugeben.
  - id: p3_jahresfrist_und_kenntnisunabhaengigkeit
    beschreibung: Fristberechnung nach Paragraf 135 Abs. 1 Nr. 2 InsO und Erkenntnis, dass es auf Kenntnis nicht ankommt.
    erwartung: Der Bearbeiter bestimmt die Jahresfrist ab dem 16.02.2025 (Antragseingang 16.02.2026, Paragraf 139 InsO), ordnet die Rueckfuehrungen vollstaendig diesem Zeitraum zu und erkennt, dass Paragraf 135 InsO weder Zahlungsunfaehigkeit noch Kenntnis der Gesellschafterin voraussetzt, so dass die Kenntnisdebatte des Konzern-Antwortschreibens neben der Sache liegt.
  - id: p4_besicherung_nr1_zehnjahresfrist
    beschreibung: Anfechtung der Sicherungsuebereignung des Maschinenparks nach Paragraf 135 Abs. 1 Nr. 1 InsO.
    erwartung: Der Bearbeiter erkennt, dass die nachtraegliche Besicherung des seit 2019 unbesicherten Gesellschafterdarlehens am 18.06.2025 als Sicherung innerhalb der Zehnjahresfrist anfechtbar ist, und wuerdigt das Gegenargument der schon 2019 vereinbarten Nachbesicherungsklausel kritisch, einschliesslich des Umstands, dass das Sicherungsverlangen erst auf das Krisenreporting 2025 gestuetzt wurde und der Buchwert des Sicherungsguts die gesicherte Forderung deutlich uebersteigt.
  - id: p5_kleinbeteiligtenprivileg_falle
    beschreibung: Fallenpruefung zum Kleinbeteiligtenprivileg fuer die Rueckzahlung an den Mitgesellschafter Kastl.
    erwartung: Der Bearbeiter erkennt, dass die Rueckzahlung der 45.000 EUR am 30.09.2025 zwar in der Jahresfrist liegt, Herr Kastl aber als nicht geschaeftsfuehrender Gesellschafter mit 8 Prozent unter das Privileg des Paragraf 39 Abs. 5 InsO faellt, so dass sein Darlehen nicht nachrangig und die Rueckzahlung nicht nach Paragraf 135 Abs. 1 Nr. 2 InsO anfechtbar ist. Er prueft die Privilegvoraussetzungen (Beteiligungshoehe, keine Geschaeftsfuehrung, keine Koordinierungsabrede) anhand der Gesellschafterliste und der Stellungnahme des Steuerberaters, statt reflexhaft auch diesen Betrag zurueckzufordern.
  - id: p6_insolvenzreife_diskrepanz
    beschreibung: Aufdeckung der Diskrepanz zwischen Eigenantrag und Konzernunterlagen beim Eintritt der Insolvenzreife.
    erwartung: Der Bearbeiter erkennt, dass der Eigenantrag die Zahlungsunfaehigkeit erst auf Mitte Dezember 2025 datiert, waehrend das Konzern-Reporting und das Treasury-Memo vom 31.03.2025 bereits ab Maerz 2025 negatives Eigenkapital und eine ueber Wochen anhaltende Deckungsluecke von deutlich ueber zehn Prozent der faelligen externen Verbindlichkeiten ausweisen, wuerdigt die Rolle der Konzernlinie fuer die Zahlungsfaehigkeitsbetrachtung (jederzeit kuendbare interne Linie als verfuegbares Mittel?) und zieht die Konsequenzen fuer die Beweislage und etwaige Folgefragen wie die Antragspflicht nach Paragraf 15a InsO.
