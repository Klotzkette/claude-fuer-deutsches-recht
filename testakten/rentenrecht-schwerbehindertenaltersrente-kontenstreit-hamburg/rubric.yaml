name: rentenrecht-schwerbehindertenaltersrente-kontenstreit-hamburg
plugin: "rentenpruefer"
description: 'Vorgezogene Altersrente fuer schwerbehinderte Menschen mit streitiger Wartezeit von 35 Jahren (420
  Kalendermonate). Die DRV erkennt 406 Monate an; es fehlen 14 Monate, die aus Kontenluecken (Ausbildungsrest, zwei
  Werftbeschaeftigungen, Arbeitslosigkeit 1993, Pflegezeiten, Minijob 2016) durch Beweisersatz zu schliessen sind.
  Prueffragen: Wartezeitberechnung aus dem Datenkern, Schwerbehinderteneigenschaft zum Rentenbeginn, Nachweisqualitaet
  je Luecke, Amtsermittlung und Beweisersatz, rechtzeitiger Antrag, wirtschaftlicher Vergleich der Rentenbeginn-Varianten.'
checks:
  - id: datei-02-drv-auskunft-wartezeit
    check_type: file_exists
    description: Das Primäraktenstück 02_drv_auskunft_wartezeit.docx ist für die Fallauswertung vorhanden.
    path: 02_drv_auskunft_wartezeit.docx
  - id: p1-wartezeit-datenkern
    check_type: human_review
    description: Datenauswertungs-Kern - Aus 12_kontenstreit_datenkern.csv und 07_berechnungsmatrix_wartezeit.csv
      muss die Erfuellung der Wartezeit von 420 Kalendermonaten selbststaendig nachgerechnet werden.
  - id: p2-schwerbehinderteneigenschaft-zum-rentenbeginn
    check_type: human_review
    description: Die Schwerbehinderteneigenschaft zum Rentenbeginn, die Wartezeit und die Abschlagsfrage sind strikt
      zu trennen.
  - id: p3-nachweisqualitaet-und-beweisersatz
    check_type: human_review
    description: Die streitigen Zeiten sind je Luecke nach Nachweisqualitaet zu bewerten, ohne sichere Beitragszahlung
      zu behaupten.
  - id: p4-amtsermittlung
    check_type: human_review
    description: Statt nur eigene Belege zu sammeln, ist die Amtsermittlung anzustossen.
  - id: p5-antrag-und-fristen
    check_type: human_review
    description: Der Rentenantrag ist rechtzeitig zu stellen; die Auskunft ist kein Bescheid.
  - id: p6-varianten-und-formalien
    check_type: human_review
    description: Die Rentenbeginn-Varianten sind wirtschaftlich zu vergleichen; das Arbeitsprodukt ist ausformuliert
      und ohne halluzinierte Fundstellen.
