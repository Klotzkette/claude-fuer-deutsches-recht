name: rentenrecht-schwerbehindertenaltersrente-kontenstreit-hamburg
description: Vorgezogene Altersrente für schwerbehinderte Menschen mit streitiger Wartezeit von 35 Jahren, Kontenlücken aus Ausbildung, Werftjahren, Arbeitslosigkeit 1993 und Pflegezeiten sowie Beweisersatz durch Altunterlagen.
checks:
  - Schwerbehinderteneigenschaft zum Rentenbeginn, Wartezeit von 420 Monaten und Abschlagsfragen strikt trennen.
  - Fehlende 14 Monate gegen die streitigen Zeiträume rechnen und je Lücke die Nachweisqualität bewerten.
  - Alte Lohnsteuerkarten, Arbeitszeugnis und AOK-Karteikarte als Indizienkette (Beweisersatz) einsetzen, ohne sichere Beitragszahlung zu behaupten.
  - Amtsermittlung anstoßen (Staatsarchiv, Krankenkasse, Agentur für Arbeit, Pflegekasse) statt nur eigene Belege zu sammeln.
  - Pflegezeiten monatsweise prüfen; Meldelücke nach dem Arbeitgeberwechsel im Oktober 2013 und den Stundenumfang 2012 als getrennte Fragen behandeln.
  - Minijob 2016 realistisch als geringe Chance einordnen (Befreiungsstatus klären).
  - Rentenantrag rechtzeitig vor dem 01.11.2026 stellen; Auskunft vom 18.06.2026 nicht mit einem Bescheid verwechseln.
  - Rentenbeginn-Varianten wirtschaftlich vergleichen, ohne die Kontenklärung vorwegzunehmen.
