name: bau-rundum-vgv-bewerbung-hameln
plugin: bauwirtschaft-fortgeschrittene
description: VgV-Teilnahmeantrag eines Planungsbüros mit veröffentlichten Auswahlkriterien,
  belastbaren Referenzbelegen, Kapazitätskonflikten und einem vorläufigen Konzept
  für die spätere Angebotsphase.
checks:
- id: sachpruefung-1
  check_type: human_review
  description: Mindestanforderungen, Bewerberauswahl und spätere Zuschlagskriterien
    auseinanderhalten.
- id: sachpruefung-2
  check_type: human_review
  description: Referenzen nach Zeitraum, eigenem Leistungsanteil und tatsächlich dokumentierter
    Leistung auswählen.
- id: sachpruefung-3
  check_type: human_review
  description: Teamkapazität und Fremdleistungen belegen; fehlende Zusagen nicht durch
    Konzeptbehauptungen ersetzen.
- id: original-01
  check_type: file_exists
  path: 01_Bekanntmachungsdaten.pdf
  description: Eigenständige Originalunterlage vorhanden.
