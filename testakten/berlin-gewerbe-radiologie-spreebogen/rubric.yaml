    geklärt? Keine fachgutachterliche Abschirmungsfreigabe durch Textgenerierung.
  note: 'Offen: noch kein konkretes Modellergebnis anhand dieses Kriteriums menschlich bewertet.
    Ein bestandener Strukturcheck ersetzt diese Prüfung nicht.'
- id: fach-produkt
  check_type: human_review
  description: Enthält der Antwortentwurf konkrete Nachreichungen und Rückfragen; bleiben Patiententermine
