    Ein bestandener Strukturcheck ersetzt diese Prüfung nicht.'
- id: fach-frist
  check_type: human_review
  description: Wird der Widerspruch zwischen der aktuellen gesetzlichen Zweiwochenfrist und dem vierwöchigen
