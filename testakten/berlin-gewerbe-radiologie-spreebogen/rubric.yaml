  note: 'Offen: noch kein konkretes Modellergebnis anhand dieses Kriteriums menschlich bewertet.
    Ein bestandener Strukturcheck ersetzt diese Prüfung nicht.'
offene_pruefkriterien:
- Wird die ärztliche GbR anhand ihrer tatsächlichen Tätigkeit eingeordnet, ohne aus CT, Personal
  oder Umsatz allein Gewerblichkeit abzuleiten? Werden Gewerbeanzeige, Berufsrecht und Betriebszulässigkeit
  getrennt?
- Werden vorhandener MRT-Betrieb, geplanter medizinischer CT-Einsatz, erst erwogene Teleradiologie
  und ein etwaiger Umgang mit radioaktiven Stoffen getrennt geprüft? Keine pauschale Übertragung
  des Anzeigewegs auf Genehmigungsfälle.
- Wird der Widerspruch zwischen der aktuellen gesetzlichen Zweiwochenfrist und dem vierwöchigen Portalhinweis
  erkannt? Beginnt die Rechnung nicht ungeprüft mit einer unvollständigen Anzeige; bleibt die besondere
  Genehmigungspflicht nach dem einschlägigen Fall gesondert geprüft?
- Werden vorläufiger Sachverständigenauszug, noch offene Türprüfung und abgeschnittene Fachkundekopie
  als konkrete Lücken behandelt? Ersetzen Hersteller-Startsignal, technische Übergabe am 5. Oktober
  oder Schweigen der Behörde keine nachgewiesene Startberechtigung?
- Werden alte und neue Raumnummer demselben ehemaligen Archiv nachvollziehbar zugeordnet und genehmigter
  Nutzungsbestand, bauliche Änderung sowie Strahlenschutzanforderungen getrennt geklärt? Keine fachgutachterliche
  Abschirmungsfreigabe durch Textgenerierung.
- Enthält der Antwortentwurf konkrete Nachreichungen und Rückfragen; bleiben Patiententermine am
  19. Oktober ausdrücklich vorläufig? Sind Verantwortungszuordnung und Fachkunde nicht mit einem
  bloßen Entwurf als wirksam erledigt behandelt und ist der Startplan an nachweisbare Voraussetzungen
  gebunden?
