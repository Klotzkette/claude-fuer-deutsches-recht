name: 'Spreebogen: vorhandenes MRT und geplanter CT-Start'
plugin: berliner-gewerbeaufsicht-betrieb
stand: '2026-10-02'
pruefstatus: Fachliche menschliche Ergebnisprüfung offen; keine Modellleistung als bestanden behauptet.
bewertungsgrundlage:
  rohakte: berlin-gewerbe-radiologie-spreebogen
  fachprofil: quality/evals/berliner-gewerbeaufsicht-betrieb.json
  hinweis: Kriterien beruhen auf Rohunterlagen und fachlichem Evalprofil. Dateiexistenz und Dateizahl
    bestätigen ausschließlich den Bestand.
erwartete_ergebnisformate:
- datei: Antwort_LAGetSi.docx
  zweck: Ausformulierter Nachreichungs- und Klärungsentwurf mit konkreten fehlenden Unterlagen.
- datei: Betriebsvermerk.docx
  zweck: Einordnung von ärztlicher Tätigkeit, Nutzung des ehemaligen Archivs und unterschiedlichen
    Gerätearten.
- datei: Bedingter_CT_Startplan.xlsx
  zweck: Nachweis- und Terminplan ohne unbelegte Betriebsfreigabe.
ergebnisformat_hinweis: Die genannten Ergebnisdateien sind Bewertungsziele einer späteren Bearbeitung,
  keine bereits gelieferten Dateien und keine automatisch geprüften Bestandsvoraussetzungen. DOCX
  bleibt bearbeitbar; XLSX soll bei Berechnungen nachvollziehbare Formeln und kenntliche Annahmen
  enthalten. PDF kann zusätzlich als Lesefassung dienen.
checks:
- id: unterlagenumfang
  check_type: working_file_count
  description: Der exportierbare Bestand umfasst mindestens 18 eigenständige native Unterlagen; Gesamt-PDF
    und Bewertungsdatei zählen nicht mit.
  min: 18
- id: native-docx
  check_type: file_count
  description: Mindestens 8 native DOCX-Unterlagen sind im Aktenordner vorhanden.
  glob: '*.docx'
  min: 8
- id: native-eml
  check_type: file_count
  description: Mindestens 7 native EML-Unterlagen sind im Aktenordner vorhanden.
  glob: '*.eml'
  min: 7
- id: native-txt
  check_type: file_count
  description: Mindestens 2 native TXT-Unterlagen sind im Aktenordner vorhanden.
  glob: '*.txt'
  min: 2
- id: native-xlsx
  check_type: file_count
  description: Mindestens 1 native XLSX-Unterlagen sind im Aktenordner vorhanden.
  glob: '*.xlsx'
  min: 1
- id: lesefassung
  check_type: file_exists
  description: Die vollständige Lesefassung ergänzt die nativen Originaldateien.
  path: gesamt-pdf/berlin-gewerbe-radiologie-spreebogen_gesamt.pdf
- id: kernbeleg-1
  check_type: file_exists
  description: Der für die konkrete fachliche Prüfung benötigte Originalbeleg ist vorhanden.
  path: 09_LAGetSi_Nachforderung.docx
- id: kernbeleg-2
  check_type: file_exists
  description: Der für die konkrete fachliche Prüfung benötigte Originalbeleg ist vorhanden.
  path: 13_Pruefbericht_Auszug.docx
- id: kernbeleg-3
  check_type: file_exists
  description: Der für die konkrete fachliche Prüfung benötigte Originalbeleg ist vorhanden.
  path: 16_Verantwortungszuordnung_Entwurf.docx
- id: fach-beruf
  check_type: human_review
  description: Wird die ärztliche GbR anhand ihrer tatsächlichen Tätigkeit eingeordnet, ohne aus
    CT, Personal oder Umsatz allein Gewerblichkeit abzuleiten? Werden Gewerbeanzeige, Berufsrecht
    und Betriebszulässigkeit getrennt?
  note: 'Offen: noch kein konkretes Modellergebnis anhand dieses Kriteriums menschlich bewertet.
    Ein bestandener Strukturcheck ersetzt diese Prüfung nicht.'
- id: fach-geraete
