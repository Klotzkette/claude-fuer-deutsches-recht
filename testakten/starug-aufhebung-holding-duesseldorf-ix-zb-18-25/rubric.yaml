name: starug-aufhebung-holding-duesseldorf-ix-zb-18-25
description: StaRUG-Restrukturierungssache einer Duesseldorfer Beteiligungs-Holding, die nach Anzeige der Zahlungsunfaehigkeit aufgehoben wird; Handakte durch drei Instanzen bis zur ersten BGH-Entscheidung zum StaRUG (IX ZB 18/25) mit Planentwurf, ungesichertem Drittbeitrag und Quotenvergleich.
checks:
  - Aufhebungssystematik des Paragraf 33 Abs. 2 Satz 1 Nr. 1 StaRUG sauber gliedern (Regel Halbsatz 1, Ausnahmen Halbsatz 2 und 3, Ermessen).
  - Erkennen, dass der Massstab des Halbsatzes 2 nicht der Vorteil der Insolvenz, sondern das offensichtliche Nicht-im-Gesamtinteresse ist, und die Quotenunsicherheit (1 Prozent gegen 0 bei 6.119,51 EUR Verteilvolumen) einordnen.
  - Den nicht unterzeichneten Drittbeitrag als Kernschwaeche des Halbsatzes 3 identifizieren und Sicherungswege benennen.
  - Die Darlegungslast des Schuldners fuer alle Absehens-Umstaende herausarbeiten.
  - Das Rechtsschutzinteresse der Beschwerde trotz Paragraf 31 Abs. 4 Nr. 3 und Nr. 4 StaRUG begruenden.
  - Das beiliegende amtliche BGH-PDF als Beweis- und Zitatquelle korrekt verwerten (Gericht, Datum, Aktenzeichen, ECLI, Randnummern).
