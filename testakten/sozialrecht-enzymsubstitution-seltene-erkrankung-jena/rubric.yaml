name: sozialrecht-enzymsubstitution-seltene-erkrankung-jena
description: Krankenversicherungsakte zur Enzymsubstitution bei seltener Erkrankung mit Off-Label-Nähe, Minderjähriger, drohenden irreversiblen Schäden und Eilrechtsschutz.
checks:
  - Off-Label-Nähe präzise von zugelassener Standardversorgung trennen.
  - Befristeten Therapieversuch mit objektiven Verlaufsparametern und Abbruchkriterien herausarbeiten.
  - Minderjährigenschutz, Schule und Teilhabe konkret mit den Belegen aus Schulstellungnahme, E-Mail der Oberstufenleitung und Pflegeberatung belegen.
  - MD-Aktenlage gegen die fachklinische Stellungnahme abwägen; die fehlende kinder- und stoffwechselmedizinische Befassung des internistischen Gutachters benennen.
  - Eilbedürftigkeit nicht abstrakt, sondern am drohenden Funktionsverlust und am Therapiefenster August 2026 darstellen.
  - Die abweichenden Kostenangaben (Jahreskosten im Klinikantrag gegenüber Monatskosten im Dosisplan) erkennen und offenlegen, statt sie stillschweigend zu übernehmen.
