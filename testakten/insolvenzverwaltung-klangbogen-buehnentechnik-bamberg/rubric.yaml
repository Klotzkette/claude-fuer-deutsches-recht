- id: r09-rechenkonsistenz
  check_type: human_review
  description: Massebestand 538776.34, Reserven 119776.27, Verteilungsmasse 419000.07
    und Forderungsbasis 1764825.62 stimmen ueberein.
- id: r10-gates
  check_type: human_review
  description: Der letzte Bericht benennt Schlussreife, ohne Freigabe, gerichtliche
    Zustimmung, Zahlung oder Aufhebung zu erfinden.
