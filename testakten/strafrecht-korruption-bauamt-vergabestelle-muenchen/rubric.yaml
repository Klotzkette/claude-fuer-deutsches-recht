name: strafrecht-korruption-bauamt-vergabestelle-muenchen
plugin: "fachanwalt-strafrecht"
description: Korruptionsakte aus einer kommunalen Vergabestelle mit drei Zuschlaegen knapp unter der internen Kontrollschwelle,
  Einladungsvorteilen und einer als Beratungshonorar getarnten Zahlung; Kern ist der zeitliche Abgleich von Zuschlagsliste,
  Kalender und Kontobewegungen zur Ableitung der Unrechtsvereinbarung und der Vorteilssumme.
checks:
  - id: datei-02-sachverhalt-chronologie
    check_type: file_exists
    description: Das Primäraktenstück 02_sachverhalt_chronologie.docx ist für die Fallauswertung vorhanden.
    path: 02_sachverhalt_chronologie.docx
  - id: p1-rolle-fristen-arbeitsprodukt
    check_type: human_review
    description: Verfahrensrolle, Fristen und naechstes Arbeitsprodukt vor der materiellen Pruefung klaeren.
  - id: p2-belastend-entlastend-trennen
    check_type: human_review
    description: Belastende und entlastende Tatsachen je Beweismittel getrennt ausweisen.
  - id: p3-sicherstellung-digital
    check_type: human_review
    description: Sicherstellungskette, Belehrung und digitale Originaldaten gesondert pruefen.
  - id: p4-abgleich-zuschlaege-vorteile
    check_type: human_review
    description: Datenauswertungs-Kern mit konkreten Werten aus der Zuschlagsliste, dem Kalender und den Kontobewegungen.
  - id: p5-diskrepanz-beratungshonorar
    check_type: human_review
    description: 'Diskrepanz-Pflichtpunkt: Die Einlassung Beratungshonorar widerspricht dem Zeitmuster und der Vorankuendigung.'
  - id: p6-materielle-pruefung-nebenfolgen
    check_type: human_review
    description: Subsumtion der Amtsdelikte, Abgrenzung 331 zu 332 StGB und Nebenfolgen mitdenken.
