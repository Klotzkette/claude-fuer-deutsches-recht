name: strafrecht-stalking-digitales-kontaktverbot-hannover
plugin: "fachanwalt-strafrecht"
description: Nachstellungsakte mit GPS-Sender, wechselnden Fake-Profilen, Kontaktverbot und Gewaltschutz; Kern ist
  die kanaluebergreifende Kontaktchronologie zur Quantifizierung der Beharrlichkeit und der Verstoesse gegen das
  Kontaktverbot.
checks:
  - id: datei-neu-primaerbeleg
    check_type: file_exists
    description: Der Primaerbeleg 12_providerauskunft_rufnummern_und_sim_2026-07-02.docx ist vorhanden.
    path: 12_providerauskunft_rufnummern_und_sim_2026-07-02.docx
  - id: datei-02-sachverhalt-chronologie
    check_type: file_exists
    description: Das Primäraktenstück 02_sachverhalt_chronologie.docx ist für die Fallauswertung vorhanden.
    path: 02_sachverhalt_chronologie.docx
  - id: p1-rolle-fristen-arbeitsprodukt
    check_type: human_review
    description: Verfahrensrolle, Fristen und naechstes Arbeitsprodukt vor der materiellen Pruefung klaeren.
  - id: p2-belastend-entlastend-trennen
    check_type: human_review
    description: Belastende und entlastende Tatsachen je Beweismittel getrennt ausweisen und Kontakte nicht ueberdehnen.
  - id: p3-sicherstellung-digital
    check_type: human_review
    description: Sicherstellungskette, Beweissicherung und digitale Originaldaten gesondert pruefen.
  - id: p4-kontaktchronologie-quantifizieren
    check_type: human_review
    description: Datenauswertungs-Kern mit konkreten Werten aus der Kontaktchronologie.
  - id: p5-diskrepanz-nur-einmal
    check_type: human_review
    description: 'Diskrepanz-Pflichtpunkt: Die Einlassung nur einmal geschrieben widerspricht der Logzahl.'
  - id: p6-materielle-pruefung-nebenfolgen
    check_type: human_review
    description: Subsumtion der Nachstellung, Bewertung der Verstoesse und Schutzfolgen mitdenken.
