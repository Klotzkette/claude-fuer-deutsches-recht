name: rentenrecht-fruehrente-kontenluecken-werft-kiel
plugin: "rentenpruefer"
description: Vorgezogene Altersrente einer Werftmitarbeiterin mit Kontenluecken, streitigen Wartezeitmonaten fuer
  die Rente fuer langjaehrig und besonders langjaehrig Versicherte sowie Abschlagsfrage beim Wunschbeginn.
checks:
  - id: datei-02-drv-versicherungsverlauf
    check_type: file_exists
    description: Das Primäraktenstück 02_drv_versicherungsverlauf.docx ist für die Fallauswertung vorhanden.
    path: 02_drv_versicherungsverlauf.docx
  - id: fachpruefung-01
    check_type: human_review
    description: Datenkern nachrechnen - aus dem Kontenspiegel ergeben sich fuer die Wartezeit von 45 Jahren nur
      462 gemeldete Pflichtmonate (38 Jahre 6 Monate) gegenueber bis zu 524 belegbaren Monaten; die 62 streitigen
      Zusatzmonate (Nordstahl 26, Minijob 10, Pflege 4 und 14, Arbeitslosigkeit 8) und die Luecke von 78 Monaten
      zu 540 muessen benannt werden.
  - id: fachpruefung-02
    check_type: human_review
    description: Wartezeit von 35 und von 45 Jahren strikt trennen - die 35 Jahre sind mit 470 Monaten erfuellt,
      die 45 Jahre nicht; Anrechnungszeit Arbeitslosigkeit zaehlt fuer 35, nicht ohne Weiteres fuer 45.
  - id: fachpruefung-03
    check_type: human_review
    description: Abschlag beim Wunschbeginn 01.03.2027 mit 34 Monaten mal 0.3 Prozent gleich 10.2 Prozent nachvollziehen
      und die Ausgleichszahlung erst nach Kontenklaerung verorten.
  - id: fachpruefung-04
    check_type: human_review
    description: Je Lueckenkomplex die Nachweisqualitaet bewerten - Nordstahl (nur Krankenversicherung, keine Rentenmeldung),
      Minijob (Mai und Juni bar, ohne Beleg), Pflege (Zuordnungsfehler bei der Einzugsstelle bestaetigt).
  - id: fachpruefung-05
    check_type: human_review
    description: Amtsermittlung anstossen (Einzugsstelle, Agentur fuer Arbeit, Pflegekasse) statt nur eigene Belege
      zu sammeln; die Korrekturmeldung der AOK und die Zwischenmitteilung der DRV auswerten.
  - id: fachpruefung-06
    check_type: human_review
    description: Erreichbarkeit des abschlagsfreien 45-Jahre-Beginns zum 01.01.2028 realistisch einordnen - selbst
      mit Weiterarbeit bis 12/2027 werden 540 Monate nur bei Anerkennung nahezu aller streitigen Zeiten knapp erreicht.
