name: insolvenzrecht-forderungspruefung-mietkaution-berlin
plugin: "insolvenzrecht"
description: Fachspezifische Qualitätsprüfung der vollständigen Akte insolvenzrecht-forderungspruefung-mietkaution-berlin.
checks:
  - id: datei-01-forderungsanmeldung-vermieter-2026-06-18
    check_type: file_exists
    description: Das Primäraktenstück 01_forderungsanmeldung_vermieter_2026-06-18.docx ist vorhanden.
    path: 01_forderungsanmeldung_vermieter_2026-06-18.docx
  - id: datei-02-mietvertrag-kautionsklausel-auszug-2022
    check_type: file_exists
    description: Das Primäraktenstück 02_mietvertrag_kautionsklausel_auszug_2022.docx ist vorhanden.
    path: 02_mietvertrag_kautionsklausel_auszug_2022.docx
  - id: tabellenauszug-aktenzeichen
    check_type: text_contains
    description: Der Tabellenauszug führt das konkrete Insolvenzverfahren.
    path: 07_auszug_insolvenztabelle_2026-07-06.pdf
    contains: 36g IN 892/26
  - id: tabellenauszug-kaution
    check_type: text_contains
    description: Der Tabellenauszug enthält das konkrete Kautionsguthaben.
    path: 07_auszug_insolvenztabelle_2026-07-06.pdf
    contains: 64400,00 EUR
  - id: fachpruefung-01
    check_type: human_review
    description: Kautionsart, Verpfändung, Bankverrechnung und insolvenzrechtliche Zuordnung von Aussonderung, Absonderung
      oder Insolvenzforderung urkundsbezogen bestimmen.
  - id: fachpruefung-02
    check_type: human_review
    description: Mietschäden, Betriebskosten, Rückgabezustand und Gegenforderungen nach Entstehung, Fälligkeit,
      Beleg und Rang einzeln prüfen.
  - id: fachpruefung-03
    check_type: human_review
    description: Forderungsanmeldung, Bestreiten im Prüfungstermin, Tabellenwirkung und mögliche Feststellungsklage
      mit bezifferten Positionen vorbereiten.
