name: familienrecht-sorge-umgang-gewaltschutz-essen
plugin: "fachanwalt-familienrecht"
description: Fachspezifische Qualitätsprüfung der vollständigen Akte familienrecht-sorge-umgang-gewaltschutz-essen.
checks:
  - id: datei-02-chronologie-arbeitsstand
    check_type: file_exists
    description: Das Primäraktenstück 02_chronologie_arbeitsstand.docx ist vorhanden.
    path: 02_chronologie_arbeitsstand.docx
  - id: datei-07-notruf
    check_type: file_exists
    description: Das zeitgestempelte Notruf- und Dispositionsprotokoll ist vorhanden.
    path: 07_notruf_und_einsatzdisposition.docx
  - id: datei-08-befundbericht
    check_type: file_exists
    description: Der ärztliche Befundbericht mit getrennter Anamnese und objektivem Befund ist vorhanden.
    path: 08_aerztlicher_befundbericht.docx
  - id: datei-10-jugendamt
    check_type: file_exists
    description: Der Jugendamtsvermerk zu Hausbesuch und Kindergesprächen ist als eigenes Aktenstück vorhanden.
    path: 10a_jugendamt_hausbesuchsvermerk_2026-06-26.docx
  - id: datei-10-jugendamt-hilfeplan
    check_type: file_exists
    description: Der vorläufige Hilfeplan des Jugendamts ist als eigenes Aktenstück vorhanden.
    path: 10b_jugendamt_vorlaeufiger_hilfeplan_2026-06-27.docx
  - id: fachpruefung-01
    check_type: human_review
    description: Gewaltschutz, elterliche Sorge, Umgang und Kindeswohl als getrennte Verfahrensgegenstände mit jeweils
      passenden Anträgen behandeln.
  - id: fachpruefung-02
    check_type: human_review
    description: Polizeivermerk, Schulnotiz, Parteivortrag und Fotoblatt auf unmittelbare Wahrnehmung, Widersprüche
      und aktuelle Gefährdung prüfen.
  - id: fachpruefung-03
    check_type: human_review
    description: Eilbedürftigkeit, geschützte Übergabe, Umgangsbegleitung, Anhörung des Kindes und mildere Maßnahmen
      in einen konkreten Eilantrag überführen.
  - id: fachpruefung-04
    check_type: human_review
    description: Parteianamnese, objektive Verletzungsbefunde, Notrufangaben, Zeugenwahrnehmung und spätere Deutung
      mit ihrem jeweils begrenzten Beweiswert auseinanderhalten.
