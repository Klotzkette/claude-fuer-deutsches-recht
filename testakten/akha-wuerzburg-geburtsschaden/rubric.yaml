- id: fach-mandat
  check_type: human_review
  description: Wird allein der Erstversicherer vertreten und der bereits anerkannte
    Haftungsstand berücksichtigt?
  note: 'Offen: Kriterium für eine spätere juristische Bearbeitung; keine Musterlösung.'
- id: fach-zahlung
  check_type: human_review
  description: Werden Vergleich, Vorschüsse, Schlusszahlung und noch nicht gezahlte
    Reserve ohne Doppelzählung abgeglichen?
  note: 'Offen: Kriterium für eine spätere juristische Bearbeitung; keine Musterlösung.'
- id: fach-schichten
  check_type: human_review
  description: Werden erstversicherte Leistung, Mitgliedsselbstbehalt, Bruttoausgleich
    und Rückdeckung mit ihrem jeweiligen Bezugsbetrag und Zahlungsempfänger getrennt?
  note: 'Offen: Kriterium für eine spätere juristische Bearbeitung; keine Musterlösung.'
- id: fach-quellen
  check_type: human_review
  description: Werden Modellparameter als Annahmen erkannt und keine tatsächlichen
    AKHA-Konditionen oder Mitgliedschaften behauptet?
  note: 'Offen: Kriterium für eine spätere juristische Bearbeitung; keine Musterlösung.'
- id: fach-zukunft
  check_type: human_review
  description: Werden Erwerbsprognose, Vorbehalt, Vertretung und Verjährungsregelung
    anhand der konkreten Unterlagen geprüft?
  note: 'Offen: Kriterium für eine spätere juristische Bearbeitung; keine Musterlösung.'
- id: fach-entwurf
  check_type: human_review
  description: Liegt ein adressatengerechter interner Antwortentwurf mit konkretem
    nächsten Schritt vor?
  note: 'Offen: Kriterium für eine spätere juristische Bearbeitung; keine Musterlösung.'
