name: strafrecht-revision-beweisantrag-lg-duisburg
plugin: "fachanwalt-strafrecht"
description: Revisionsakte nach Verurteilung vor dem Landgericht Duisburg mit Protokollruege, abgelehntem Beweisantrag
  und Aufklaerungsruege; Kern ist der Abgleich der Hauptverhandlungs-Chronologie mit zwei Protokollfassungen zur
  Rekonstruktion des Verfahrensfehlers.
checks:
  - id: datei-02-sachverhalt-chronologie
    check_type: file_exists
    description: Das Primäraktenstück 02_sachverhalt_chronologie.docx ist für die Fallauswertung vorhanden.
    path: 02_sachverhalt_chronologie.docx
  - id: p1-rolle-fristen-arbeitsprodukt
    check_type: human_review
    description: Verfahrensrolle, Fristen und naechstes Arbeitsprodukt vor der materiellen Pruefung klaeren.
  - id: p2-belastend-entlastend-trennen
    check_type: human_review
    description: Belastende und entlastende Tatsachen je Beweismittel getrennt ausweisen.
  - id: p3-protokolllage-274
    check_type: human_review
    description: Sicherstellungskette der Verfahrenstatsachen, hier die Protokolllage und die Beweiskraft nach Paragraf
      274 StPO, gesondert pruefen.
  - id: p4-chronologie-divergenzen
    check_type: human_review
    description: Datenauswertungs-Kern mit konkreten Werten aus der Sitzungschronologie und den Protokollfassungen.
  - id: p5-diskrepanz-ablehnung-protokoll
    check_type: human_review
    description: 'Diskrepanz-Pflichtpunkt: Die Ablehnungsbegruendung widerspricht dem tatsaechlichen Antragsinhalt.'
  - id: p6-revisionsbegruendung-ruegen
    check_type: human_review
    description: Verfahrensruge, Aufklaerungsruge und Sachruge sauber trennen und tragfaehig formulieren.
