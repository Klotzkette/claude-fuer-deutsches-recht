name: Franchiserecht Systemgastronomie Expansion Streit
plugin: franchiserecht-praxis
checks:
- id: r01-readme-vorhanden
  check_type: file_exists
  description: Die Aktenbeschreibung ist vorhanden.
  path: README.md
- id: r02-gesamt-pdf-vorhanden
  check_type: file_exists
  description: Die vollständige Lesefassung ist gebaut.
  path: gesamt-pdf/franchiserecht-systemgastronomie-expansion-streit_gesamt.pdf
- id: r03-vollstaendiger-arbeitsbestand
  check_type: working_file_count
  description: Mindestens zehn exportierbare Originalunterlagen sind vorhanden.
  min: 10
- id: r04-franchisevertrag
  check_type: file_exists
  description: Der unterzeichnete Franchisevertrag ist vorhanden.
  path: 01-franchisevertrag-knusperkrone-karaca.docx
- id: r05-gebietsanlage
  check_type: file_exists
  description: Die gesonderte Gebietsanlage mit Standortfreigabe ist vorhanden.
  path: 02-standortfreigabe-und-gebietsanlage.docx
- id: r06-auditaufforderung-meldewert
  check_type: text_contains
  description: Die Auditaufforderung enthält den gemeldeten April-Netto-Umsatz.
  path: 05-auditaufforderung-kassendaten-03-06-2026.docx
  contains: 97761,00 Euro
- id: r07-kassenexport-rohwert
  check_type: text_contains
  description: Der Kassenexport enthält den Restaurant-Rohwert für April 2026.
  path: 10-kassenexport-2025-2026.csv
  contains: 2026-04;Restaurant;1852;68760,20
- id: r08-gebietsschutz-korrespondenz
  check_type: text_contains
  description: Die Antwort der Franchisenehmerin benennt den Drei-Kilometer-Radius.
  path: 08-email-karaca-umsatz-und-gebietsschutz-02-06-2026.eml
  contains: Drei-Kilometer-Radius
