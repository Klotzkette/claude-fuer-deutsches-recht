    bezeichnet Angebote als solche; keine unautorisierte Rechtsbehelfseinlegung oder Zahlung.
  note: 'Offen: noch kein konkretes Modellergebnis anhand dieses Kriteriums menschlich bewertet.
    Ein bestandener Strukturcheck ersetzt diese Prüfung nicht.'
offene_pruefkriterien:
- Werden Balduin als Eigentümer und Berta als letzte Gewahrsamsinhaberin mit ihrer Abholerklärung
  getrennt behandelt? Wird der konkrete Herausgabeempfänger nach dem aktuellen § 41 Absatz 1 ASOG
  geprüft statt allein nach Eigentumstitel bestimmt?
- Werden Rahmennummer HR-2024-773 und abweichende Verlustmeldung mit Endziffern 778 samt Werkstattbefund
  verarbeitet? Die geklärte Abweichung und der noch ausstehende Rückruf beweisen nicht automatisch
  die Rechtswidrigkeit jeder ursprünglichen Maßnahme.
- Wird nach dem aktuellen fortbestehenden Sicherstellungs- oder Verwahrgrund gefragt und eine tatsächliche
  Rückgabemöglichkeit verlangt, ohne eine behördliche Freigabe zu erfinden? Ein mögliches Strafverfahren
  wird nicht allein aus einer Verlustmeldung angenommen.
- Werden unverbindliche Kostenankündigung, fehlender Kostenbescheid, Mietangebot von 24 Euro täglich
  plus 15 Euro Bereitstellung und tatsächlich noch nicht bezahlte Ausgaben unterschieden? Kosten
  gehören beim aktuellen § 41 ASOG in Absatz 4, nicht in die Erlösregel des Absatzes 3.
- Berücksichtigt der Entwurf Bertas zeitliche Verfügbarkeit, beide Schlüssel und gelben Gurt, bestätigten
  Abholtermin und erforderliche Nachweise datensparsam? Kein Kostenanerkenntnis oder Anspruchsverzicht
  als vermeintlich bereits erklärt einsetzen.
- Entsteht ein konkretes Herausgabeschreiben mit realistischer Dringlichkeit ab Montag, 5. Oktober,
  ohne sämtliche Lieferungen als zwingend unmöglich darzustellen? Der Kostenvermerk bezeichnet Angebote
  als solche; keine unautorisierte Rechtsbehelfseinlegung oder Zahlung.
