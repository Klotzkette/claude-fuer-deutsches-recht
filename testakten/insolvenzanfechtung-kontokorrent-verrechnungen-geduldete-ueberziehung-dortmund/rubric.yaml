name: insolvenzanfechtung-kontokorrent-verrechnungen-geduldete-ueberziehung-dortmund
plugin: "fachanwalt-insolvenz-sanierungsrecht"
description: 'Kontokorrent-Anfechtung gegen eine Volksbank. Linie 250.000 EUR, geduldete Ueberziehung bis knapp
  310.000 EUR, im Dreimonatszeitraum 412.000 EUR Eingaenge verrechnet, Rueckfuehrung vom Hoechststand 309.900 EUR
  auf den Tiefststand 221.480 EUR. Prueffragen: Aufteilung der Rueckfuehrung in einen inkongruenten Teil (geduldete
  Ueberziehung, Paragraf 131 InsO) und einen kongruenten Teil innerhalb der Linie (Paragraf 130 InsO), richtige
  Saldodifferenzbetrachtung, Bargeschaeftseinwand, Globalzessions-Einwand gegen die Glaeubigerbenachteiligung, Kenntnis
  der Bank aus eigenen Kontodaten und Vermerken, tatsaechlicher Eintritt der Zahlungsunfaehigkeit.'
checks:
  - id: datei-01-eigenantrag-2026-04-15
    check_type: file_exists
    description: Das Primäraktenstück 01_eigenantrag_2026-04-15.docx ist für die Fallauswertung vorhanden.
    path: 01_eigenantrag_2026-04-15.docx
  - id: datei-02-eroeffnungsbeschluss-2026-06-01
    check_type: file_exists
    description: Das Primäraktenstück 02_eroeffnungsbeschluss_2026-06-01.docx ist für die Fallauswertung vorhanden.
    path: 02_eroeffnungsbeschluss_2026-06-01.docx
  - id: p01-aufteilung-kongruent-inkongruent
    check_type: human_review
    description: Die Bearbeitung muss die Saldenrueckfuehrung in den inkongruenten Teil (Rueckfuehrung der nur geduldeten
      Ueberziehung von 309.900 auf 250.000 EUR) und den kongruenten Teil (innerhalb der Linie von 250.000 auf den
      Tiefststand) trennen und die unterschiedlichen Tatbestandsvoraussetzungen der Paragrafen 130 und 131 InsO
      zuordnen.
  - id: p02-saldodifferenzrechnung
    check_type: human_review
    description: Die Bearbeitung muss die konkurrierenden Berechnungswege (Anfangssaldo zu Endsaldo, Hoechststand
      zu Endsaldo, Hoechststand zu Tiefststand) aus der Tagessaldenliste nachrechnen und begruendet waehlen.
  - id: p03-bargeschaeft
    check_type: human_review
    description: Der Bargeschaeftseinwand der Bank (412.000 EUR Eingaenge gegen 339.550 EUR wieder zugelassene Verfuegungen)
      muss geprueft werden.
  - id: p04-globalzession
    check_type: human_review
    description: Der Einwand fehlender Glaeubigerbenachteiligung wegen der Globalzession und des Absonderungsrechts
      muss erkannt und behandelt werden.
  - id: p05-kenntnis-bank
    check_type: human_review
    description: Die Kenntnispruefung nach Paragraf 130 Abs. 1 und Abs. 2 InsO muss auf die konkreten Beweisanzeichen
      der Akte gestuetzt werden.
  - id: p06-zahlungsunfaehigkeit-diskrepanz
    check_type: human_review
    description: Der tatsaechliche Eintritt der Zahlungsunfaehigkeit muss aus dem Liquiditaetsstatus selbststaendig
      ermittelt und der Datierung im Eigenantrag gegenuebergestellt werden.
