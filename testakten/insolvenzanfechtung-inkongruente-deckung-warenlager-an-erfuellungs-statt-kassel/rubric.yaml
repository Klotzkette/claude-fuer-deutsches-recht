name: insolvenzanfechtung-inkongruente-deckung-warenlager-an-erfuellungs-statt-kassel
beschreibung: Insolvenzanfechtung aus Verwaltersicht gegen den Hauptlieferanten eines Kasseler Baustoffhandels, der im zweiten Monat vor dem Eigenantrag das Restlager Daemmplatten an Erfuellungs statt und zwei Kundenforderungen zur Tilgung von 118.000 EUR erhielt. Prueft Inkongruenz der Leistung an Erfuellungs statt, das Verhaeltnis von Paragraf 131 Abs. 1 Nr. 2 und Nr. 3 InsO, Bargeschaefts-Einwand, Beweiswuerdigung ambivalenter Kenntnisindizien und die Diskrepanz zwischen Eigenantrag und tatsaechlichem Eintritt der Zahlungsunfaehigkeit.
pruefpunkte:
  - id: p1_inkongruenz_erfuellungs_statt
    beschreibung: Einordnung der Uebereignung des Warenlagers und der Forderungsabtretungen als inkongruente Deckung.
    erwartung: Der Bearbeiter erkennt, dass der Lieferant faellige Geldforderungen hatte und die Befriedigung durch Uebereignung von Ware an Erfuellungs statt nebst Abtretungen eine Deckung ist, die er nicht in der Art zu beanspruchen hatte (Paragraf 131 Abs. 1 InsO), und dass die am selben Tag getroffene Ersetzungsabrede die Kongruenz nicht herstellt. Das Gegenargument der ueblichen Warenruecknahme wird geprueft und anhand der Vereinbarung (ausdrueckliche Leistung an Erfuellungs statt) verworfen oder jedenfalls kritisch gewuerdigt.
  - id: p2_verhaeltnis_nr2_nr3
    beschreibung: Sauberes Auseinanderhalten von Paragraf 131 Abs. 1 Nr. 2 InsO (objektive Zahlungsunfaehigkeit, keine Kenntnis erforderlich) und Nr. 3 (Kenntnis der Glaeubigerbenachteiligung).
    erwartung: Der Bearbeiter ordnet den 18.12.2025 dem zweiten Monat vor dem Antrag vom 09.02.2026 zu (Zeitraum 09.12.2025 bis 08.01.2026, Paragraf 139 InsO), prueft Nr. 2 allein anhand der objektiven Zahlungsunfaehigkeit am Stichtag und zieht Nr. 3 nur hilfsweise heran. Er erkennt, dass die Kenntnisfrage fuer Nr. 2 unerheblich ist und nur bei Nr. 3 auf die Indizien ankommt.
  - id: p3_zahlungsunfaehigkeit_stichtag
    beschreibung: Feststellung der Zahlungsunfaehigkeit am 18.12.2025 aus den Finanzdaten der Akte.
    erwartung: Der Bearbeiter entnimmt dem Liquiditaetsstatus die zum 15.12.2025 bestehende Unterdeckung von 92.6 Prozent und die seit dem 01.02.2025 durchgehende Luecke von weit ueber zehn Prozent ueber mehr als drei Wochen, ergaenzt um die vollstaendige Nichtzahlung der Daemmtec-Rechnungen seit August 2025 und den Lieferstopp, und bejaht die Zahlungsunfaehigkeit am Stichtag mit rechnerischer Begruendung.
  - id: p4_kenntnisindizien_ambivalent
    beschreibung: Beweiswuerdigende Diskussion der Kenntnisindizien fuer Paragraf 131 Abs. 1 Nr. 3 InsO statt einseitiger Aufloesung.
    erwartung: Der Bearbeiter stellt die belastenden Indizien (E-Mail des Geschaeftsfuehrers Hillebrand vom 09.12.2025 mit der Formulierung bevor die Bude kippt nehmen wir Ware, Besichtigungsprotokoll mit leergeraeumten Sortimenten, WhatsApp-Bitte um unauffaellige Abholung, Sparkassen-Hinweis) den entlastenden Deutungen gegenueber (beherrschbare Uebergangsphase laut Grebe, Sanierungsbeitrag, Wiederbelieferungszusage) und thematisiert Herkunft und Verwertbarkeit der vom ausgeschiedenen Mitarbeiter ueberlassenen Unterlagen, ohne die Wuerdigung als eindeutig darzustellen.
  - id: p5_bargeschaeft_142
    beschreibung: Pruefung und Zurueckweisung des Bargeschaefts-Einwands.
    erwartung: Der Bearbeiter erkennt, dass Paragraf 142 InsO auf die Tilgung von Altverbindlichkeiten aus August bis November 2025 mangels Unmittelbarkeit nicht passt und fuer inkongruente Deckungen von vornherein nicht eroeffnet ist, und wuerdigt die Wiederbelieferungszusage (nur gegen Vorkasse) als hierfuer unzureichende Gegenleistung.
  - id: p6_insolvenzreife_diskrepanz_und_rechtsfolgen
    beschreibung: Aufdeckung der Diskrepanz zwischen Eigenantrag und Aktenlage sowie Rechtsfolgen der Anfechtung.
    erwartung: Der Bearbeiter erkennt, dass der Eigenantrag den Eintritt der Zahlungsunfaehigkeit auf Mitte Januar 2026 datiert, waehrend Liquiditaetsstatus und das nie erfuellte Zuschuss-Erfordernis des Kurzgutachtens vom 10.12.2024 den Eintritt auf Februar 2025 datieren, und benennt die Rechtsfolgen: Herausgabe der Restbestaende, Wertersatz fuer Abverkauftes, Rueckabtretung und Auskehrung vereinnahmter Betraege nach Paragraf 143 Abs. 1 InsO sowie Wiederaufleben der Lieferantenforderung nach Paragraf 144 Abs. 1 InsO.
