name: insolvenzanfechtung-inkongruente-deckung-warenlager-an-erfuellungs-statt-kassel
plugin: "fachanwalt-insolvenz-sanierungsrecht"
description: Insolvenzanfechtung aus Verwaltersicht gegen den Hauptlieferanten eines Kasseler Baustoffhandels, der
  im zweiten Monat vor dem Eigenantrag das Restlager Daemmplatten an Erfuellungs statt und zwei Kundenforderungen
  zur Tilgung von 118.000 EUR erhielt. Prueft Inkongruenz der Leistung an Erfuellungs statt, das Verhaeltnis von
  Paragraf 131 Abs. 1 Nr. 2 und Nr. 3 InsO, Bargeschaefts-Einwand, Beweiswuerdigung ambivalenter Kenntnisindizien
  und die Diskrepanz zwischen Eigenantrag und tatsaechlichem Eintritt der Zahlungsunfaehigkeit.
checks:
  - id: datei-01-mandatsvermerk-verfahrensuebersicht
    check_type: file_exists
    description: Das Primäraktenstück 01_mandatsvermerk_verfahrensuebersicht.docx ist für die Fallauswertung vorhanden.
    path: 01_mandatsvermerk_verfahrensuebersicht.docx
  - id: datei-02-handelsregisterauszug
    check_type: file_exists
    description: Das Primäraktenstück 02_handelsregisterauszug.docx ist für die Fallauswertung vorhanden.
    path: 02_handelsregisterauszug.docx
  - id: p1-inkongruenz-erfuellungs-statt
    check_type: human_review
    description: Einordnung der Uebereignung des Warenlagers und der Forderungsabtretungen als inkongruente Deckung.
  - id: p2-verhaeltnis-nr2-nr3
    check_type: human_review
    description: Sauberes Auseinanderhalten von Paragraf 131 Abs. 1 Nr. 2 InsO (objektive Zahlungsunfaehigkeit,
      keine Kenntnis erforderlich) und Nr. 3 (Kenntnis der Glaeubigerbenachteiligung).
  - id: p3-zahlungsunfaehigkeit-stichtag
    check_type: human_review
    description: Feststellung der Zahlungsunfaehigkeit am 18.12.2025 aus den Finanzdaten der Akte.
  - id: p4-kenntnisindizien-ambivalent
    check_type: human_review
    description: Beweiswuerdigende Diskussion der Kenntnisindizien fuer Paragraf 131 Abs. 1 Nr. 3 InsO statt einseitiger
      Aufloesung.
  - id: p5-bargeschaeft-142
    check_type: human_review
    description: Pruefung und Zurueckweisung des Bargeschaefts-Einwands.
  - id: p6-insolvenzreife-diskrepanz-und-rechtsfolgen
    check_type: human_review
    description: Aufdeckung der Diskrepanz zwischen Eigenantrag und Aktenlage sowie Rechtsfolgen der Anfechtung.
