name: strafrecht-verkehrsunfall-alleinrennen-berlin
description: Verkehrsstrafakte zu einem nächtlichen Alleinrennen in Berlin mit Dashcam, EDR-Daten, Unfallflucht, Führerscheinmaßnahme und Schadensgutachten.
checks:
  - Verfahrensrolle, Fristen und nächstes Arbeitsprodukt vor der materiellen Prüfung klären.
  - Belastende und entlastende Tatsachen nicht vermischen, sondern je Beweismittel ausweisen.
  - Sicherstellungskette, Belehrung und digitale Originaldaten gesondert prüfen.
  - Normanker nur als Arbeitshilfe verwenden und Subsumtion am konkreten Sachverhalt durchführen.
  - Nebenfolgen wie Einziehung, Fahrerlaubnis, Kontaktverbot, Haft oder Berufsfolgen ausdrücklich mitdenken.
  - Aus der EDR-/Telematik-Zeitreihe (Datei 10) die Hoechstgeschwindigkeit von 151 km/h, die elf Sekunden ununterbrochener Fahrt ueber 100 km/h, den EDR-Stuetzwert von 128 km/h fuenf Sekunden vor dem Aufprall, den Bremsweg von rund 162 m ab Bremsbeginn und die Rotphase beim Ueberfahren der Haltelinie ableiten und diese Werte der Einlassung, es sei nur kurz beschleunigt worden, gegenueberstellen.
