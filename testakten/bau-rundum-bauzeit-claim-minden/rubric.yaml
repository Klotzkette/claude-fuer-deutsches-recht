name: bau-rundum-bauzeit-claim-minden
plugin: bauwirtschaft-fortgeschrittene
description: Bauzeitforderung mit vereinbartem Ablauf, tatsächlichen Vorgängen, zwei
  überlappenden Störungen, Wetter- und Personalaufzeichnungen sowie belegten Kostenansätzen
  und bestrittenen Zeitanteilen.
checks:
- id: sachpruefung-1
  check_type: human_review
  description: Störungszeitraum, konkrete Tätigkeit, kausale Verschiebung und Kostenzeitraum
    jeweils belegen.
- id: sachpruefung-2
  check_type: human_review
  description: Überlappende Störungen und anderweitige Einsatzmöglichkeiten berücksichtigen,
    ohne Tage pauschal zu addieren.
- id: sachpruefung-3
  check_type: human_review
  description: Wetter, Unterbesetzung und abweichende Zeitaufzeichnungen als Gegenmaterial
    würdigen.
- id: sachpruefung-4
  check_type: human_review
  description: Forderung und Anspruchsgrundlage getrennt prüfen; aus der Rechnungsaufstellung
    keine rechtliche Anerkennung ableiten.
- id: original-01
  check_type: file_exists
  path: 01_Bauvertrag_Termine.docx
  description: Eigenständige Originalunterlage vorhanden.
