name: bauwirtschaft-hoai-7-vergabe-bibliothek-melle
plugin: bauwirtschaft
description: 'Ein privates Stiftungsprojekt mit drei vollständigen Fensterangeboten,
  verbindlicher Antwort zur Elementleistung, bedingtem Skonto, abweichender Montagezeit
  und noch offener Förderentscheidung. Präzises Übungsgebiet: positionsbezogene Angebotswertung,
  zulässige Aufklärung, Auftraggeber- und Förderbindung sowie Zusammenstellung des
  Vertragssatzes ohne eigenen Zuschlag.'
checks:
- id: angebote
  check_type: human_review
  description: Alle acht Positionen aus drei vollständigen Angeboten vergleichen;
    Skonto nicht als unbedingten Nachlass behandeln. Die Erfüllung von Uw und Montagezeit
    bleibt gesondert zu prüfen.
- id: verfahren
  check_type: human_review
  description: Stiftungsorganisation und noch nicht bewilligte Förderung aus den Originalen
    würdigen. Weder automatisch kommunale EU-Vergabe noch vollständige Verhandlungsfreiheit
    behaupten.
- id: aufklaerung
  check_type: human_review
  description: BG-78-Antwort klärt die angebotene Beschaffenheit noch nicht vollständig.
    Neue warme Kante nicht heimlich als unverändertes Angebot übernehmen. Kein selbst
    ausgeführter Zuschlag.
- id: vertrag
  check_type: human_review
  description: Vertragsunterlagen nach exaktem Stand mit Antwort vom 07.09. zusammenstellen.
    Budget, Nettosumme, Bindefrist und Wiedereröffnung voneinander unterscheiden.
