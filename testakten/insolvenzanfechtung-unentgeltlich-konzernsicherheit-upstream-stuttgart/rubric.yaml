name: insolvenzanfechtung-unentgeltlich-konzernsicherheit-upstream-stuttgart
plugin: "fachanwalt-insolvenz-sanierungsrecht"
description: Anfechtung einer aufsteigenden Konzernsicherheit (Grundschuld und Buergschaft der Tochter fuer den
  Konsortialkredit der Mutter) nach Paragraf 134 InsO mit Dreiecksverhaeltnis-Analyse, Werthaltigkeitspruefung des
  Rueckgriffs und Insolvenzreife-Diskrepanz.
checks:
  - id: datei-01-eroeffnungsbeschluss-tochter-2026-05-01
    check_type: file_exists
    description: Das Primäraktenstück 01_eroeffnungsbeschluss_tochter_2026-05-01.docx ist für die Fallauswertung
      vorhanden.
    path: 01_eroeffnungsbeschluss_tochter_2026-05-01.docx
  - id: datei-02-eigenantrag-tochter-2026-03-02
    check_type: file_exists
    description: Das Primäraktenstück 02_eigenantrag_tochter_2026-03-02.docx ist für die Fallauswertung vorhanden.
    path: 02_eigenantrag_tochter_2026-03-02.docx
  - id: p1-dreiecksverhaeltnis
    check_type: human_review
    description: Die Sicherheiten wurden fuer eine fremde Schuld (Kredit der Mutter) bestellt. Prueft der Bearbeiter
      die Unentgeltlichkeit im richtigen Verhaeltnis?
  - id: p2-werthaltigkeit-rueckgriff
    check_type: human_review
    description: Entgeltlichkeit koennte sich nur aus einem werthaltigen Rueckgriffsanspruch gegen die Mutter im
      Bestellungszeitpunkt ergeben. Wertet der Bearbeiter die zeitgenoessischen Unterlagen aus?
  - id: p3-mittelbare-vorteile
    check_type: human_review
    description: Die Bank beruft sich auf Konzernfortbestand, Auftraege der Gruppe, Cash-Pooling und Zeitgewinn
      als Gegenleistung. Wird das Argument sauber verarbeitet?
  - id: p4-kenntnis-irrelevant
    check_type: human_review
    description: Die Bank-Erwiderung argumentiert ausfuehrlich mit Vertrauensschutz, Gutglaeubigkeit und Unkenntnis
      von einer Krise der Tochter. Erkennt der Bearbeiter die Falle?
  - id: p5-frist-und-gegenstand
    check_type: human_review
    description: Wird die Vierjahresfrist korrekt gerechnet und der richtige Anfechtungsgegenstand benannt?
  - id: p6-insolvenzreife-diskrepanz
    check_type: human_review
    description: Der Eigenantrag datiert die Zahlungsunfaehigkeit der Tochter auf den 09.02.2026; Liquiditaetsstatus-CSV
      und interne E-Mail vom 12.05.2025 zeigen anderes.
