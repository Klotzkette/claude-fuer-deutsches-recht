name: strafrecht-funkzellenauswertung-alibi-raubserie-essen
plugin: "aktenaufbereiter-strafrecht"
description: Haftsache der StA Essen wegen einer Raubserie auf drei Spaetverkaufsstellen (17.04., 02.05. und 15.05.2026).
  Der Beschuldigte beruft sich fuer alle drei Abende auf ein Alibi bei seiner Schwester in Duisburg-Hochfeld; die
  Schwester bestaetigt pauschal. Die Bearbeitung muss die Verkehrsdaten-CSV, die Taten-Uebersicht, den Fahrzeiten-Vermerk
  und den WhatsApp-Export selbst zusammenfuehren und tatgenau differenzieren, wo die Standortdaten belasten und
  wo sie entlasten. Rechtlich zu pruefen sind die Voraussetzungen des Paragraf 100g StPO, der Beweiswert von Zellen-Standortdaten
  und die Maengel der Wahllichtbildvorlage.
checks:
  - id: datei-01-anzeige-tatortbericht-tat1-2026-04-17
    check_type: file_exists
    description: Das Primäraktenstück 01_anzeige_tatortbericht_tat1_2026-04-17.docx ist für die Fallauswertung vorhanden.
    path: 01_anzeige_tatortbericht_tat1_2026-04-17.docx
  - id: datei-02-anzeige-tatortbericht-tat2-2026-05-02
    check_type: file_exists
    description: Das Primäraktenstück 02_anzeige_tatortbericht_tat2_2026-05-02.docx ist für die Fallauswertung vorhanden.
    path: 02_anzeige_tatortbericht_tat2_2026-05-02.docx
  - id: p01-standortdaten-je-tat
    check_type: human_review
    description: Die Standortlage muss fuer jede der drei Taten getrennt aus der CSV rekonstruiert werden.
  - id: p02-fahrzeiten-und-verkehrsmittel
    check_type: human_review
    description: Die Bewegungsluecken muessen mit dem Fahrzeiten-Vermerk abgeglichen und auf das Verkehrsmittel
      hin ausgewertet werden.
  - id: p03-diskrepanz-alibi-whatsapp
    check_type: human_review
    description: Der Widerspruch zwischen der pauschalen Alibibestaetigung der Schwester und dem Chatverlauf muss
      aufgedeckt werden.
  - id: p04-100g-stpo-voraussetzungen
    check_type: human_review
    description: Die Rechtmaessigkeit der Verkehrsdatenerhebung muss normbezogen geprueft werden.
  - id: p05-lichtbildvorlage-maengel
    check_type: human_review
    description: Die Maengel des Wiedererkennungsverfahrens muessen identifiziert und in ihrer Beweiswertfolge bewertet
      werden.
  - id: p06-differenzierte-gesamtwuerdigung
    check_type: human_review
    description: Die Gesamtwuerdigung muss die personenungebundene Natur der Geraetedaten konsequent durchhalten.
