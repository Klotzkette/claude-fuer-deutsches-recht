# Auto-generierte Baseline-Rubric (v301).
# Manuelle Anpassung empfohlen - mindestens 3 weitere fall-spezifische
# Pass/Fail-Checks hinzufuegen (BAG-Az., Frist-Erwaehnung, spezifische Anlage).

name: "Befristungskontrollklage Vogt Stadtwerke"
plugin: "arbeitsrecht"

checks:
  - id: r01-readme-vorhanden
    check_type: file_exists
    description: "README.md vorhanden"
    path: "README.md"

  - id: r02-gesamt-pdf-vorhanden
    check_type: file_exists
    description: "Gesamt-PDF gebaut"
    path: "gesamt-pdf/befristungskontrollklage-vogt-stadtwerke_gesamt.pdf"

  - id: r03-drei-wochen-frist
    check_type: regex_match
    description: "Drei-Wochen-Frist / Paragraph 17 TzBfG (Ablauf 23.03.2026) sichtbar"
    path: "README.md"
    pattern: "(3-Wochen|drei.{0,3}Wochen|17 TzBfG|23.03.2026|Fristende)"

  - id: r04-schriftform-14-abs-4
    check_type: regex_match
    description: "Schriftformverstoss Paragraph 14 Abs. 4 TzBfG erwaehnt"
    path: "README.md"
    pattern: "(14 Abs. 4|Schriftform|126 BGB)"

  - id: r05-eml-anlagen
    check_type: file_count
    description: "mindestens 3 EML-Anlagen (Personalabteilung Verlaengerung, Vorgesetzter Weiterbeschaeftigung, Betriebsrat)"
    glob: "eml/*.eml"
    min: 3

  - id: r06-vertragskette-datenkern
    check_type: regex_match
    description: "Datenauswertungs-Kern: Vertragskette nachrechenbar - sachgrundlose Befristung 24 Monate (Hoechstgrenze Paragraph 14 Abs. 2 Satz 1 ausgeschoepft), null Verlaengerungen, Vorbeschaeftigungsabstand 2 Jahre 5 Monate; Diskrepanz Projektstelle Smart-Meter vs Daueraufgabe Kundenservice"
    path: "vertragskette_beschaeftigungsverlauf.csv"
    pattern: "Sachgrundlose Befristung,01.03.2024,28.02.2026,24,.*Daueraufgabe"
    erwartung: "sachgrundlose Dauer 24 Monate, Verlaengerungen 0, Abstand Vorbeschaeftigung 2 Jahre 5 Monate; interne Deklaration Projekt Smart-Meter-Rollout widerspricht tatsaechlicher Daueraufgabe Kundenservice und Vertragsmanagement"
