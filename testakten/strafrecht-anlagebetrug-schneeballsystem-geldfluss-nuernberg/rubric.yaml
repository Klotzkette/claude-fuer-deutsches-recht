name: strafrecht-anlagebetrug-schneeballsystem-geldfluss-nuernberg
plugin: "aktenaufbereiter-strafrecht"
description: Wirtschaftsstrafsache gegen den Geschaeftsfuehrer der Frankenland Kapitalpartner GmbH (Nuernberg).
  Von Februar 2023 bis Februar 2026 zahlten 61 Anleger insgesamt 4.2 Mio. EUR fuer angebliche Photovoltaik-Projektbeteiligungen
  mit 8 Prozent Ausschuettung pro Jahr. Der polizeiliche Auswertevermerk liefert bewusst nur Jahressummen; die monatsgenaue
  Geldflussanalyse (Kipppunkt des Schneeballsystems) muss die Bearbeitung aus der Kontoauszugs-CSV und der Anlegerliste-CSV
  selbst errechnen und mit der wechselnden Einlassung des Beschuldigten sowie der internen Vertriebsmail vom 17.09.2024
  abgleichen.
checks:
  - id: datei-01-strafanzeige-kronawitter-2026-02-16
    check_type: file_exists
    description: Das Primäraktenstück 01_strafanzeige_kronawitter_2026-02-16.docx ist für die Fallauswertung vorhanden.
    path: 01_strafanzeige_kronawitter_2026-02-16.docx
  - id: datei-02-vermerk-kripo-uebernahme-2026-02-24
    check_type: file_exists
    description: Das Primäraktenstück 02_vermerk_kripo_uebernahme_2026-02-24.docx ist für die Fallauswertung vorhanden.
    path: 02_vermerk_kripo_uebernahme_2026-02-24.docx
  - id: p01-kipppunkt-berechnung
    check_type: human_review
    description: Der Kipppunkt des Systems muss aus der Monatsuebersicht des Geschaeftskontos monatsgenau errechnet
      werden.
  - id: p02-summen-nachrechnung
    check_type: human_review
    description: Die zentralen Summen muessen aus beiden CSVs nachgerechnet und gegeneinander abgeglichen werden.
  - id: p03-diskrepanz-einlassung
    check_type: human_review
    description: Der Widerspruch zwischen der Einlassung des Beschuldigten und der Aktenlage muss konkret belegt
      werden.
  - id: p04-betrugsdogmatik-schneeball
    check_type: human_review
    description: Die materielle Pruefung des Betrugs beim Schneeballsystem muss sauber aufgebaut sein.
  - id: p05-luecke-anklageentwurf
    check_type: human_review
    description: Die im Anklageentwurf offen gelassene Stelle muss erkannt und geschlossen werden.
  - id: p06-vermoegensabschoepfung-und-privatentnahmen
    check_type: human_review
    description: Vermoegensabschoepfung und Privatentnahmen muessen verknuepft werden.
