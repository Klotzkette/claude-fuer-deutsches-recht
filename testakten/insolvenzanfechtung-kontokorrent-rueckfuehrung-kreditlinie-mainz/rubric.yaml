name: insolvenzanfechtung-kontokorrent-rueckfuehrung-kreditlinie-mainz
plugin: "fachanwalt-insolvenz-sanierungsrecht"
description: 'Kontokorrent-Anfechtung gegen eine Sparkasse. Keine Kuendigung, sondern dreistufige Herabsetzung der
  Linie von 480.000 auf 120.000 EUR im Dreimonatszeitraum, Vereinnahmung der Eingaenge zur Saldenreduzierung und
  Rueckfuehrung des Solls um 360.000 EUR. Prueffragen: Kongruenz oder Inkongruenz der Verrechnungen, Kenntnis aus
  eigenen Kontodaten, Verrechnung nach Zustellung einer Drittglaeubiger-Kontopfaendung, tatsaechlicher Eintritt
  der Zahlungsunfaehigkeit.'
checks:
  - id: datei-01-vermerk-verfahrensuebersicht-2026-05-04
    check_type: file_exists
    description: Das Primäraktenstück 01_vermerk_verfahrensuebersicht_2026-05-04.docx ist für die Fallauswertung
      vorhanden.
    path: 01_vermerk_verfahrensuebersicht_2026-05-04.docx
  - id: datei-02-kreditvertrag-kontokorrent-2022-03-15
    check_type: file_exists
    description: Das Primäraktenstück 02_kreditvertrag_kontokorrent_2022-03-15.docx ist für die Fallauswertung vorhanden.
    path: 02_kreditvertrag_kontokorrent_2022-03-15.docx
  - id: p01-berechnung-rueckfuehrung
    check_type: human_review
    description: Die Bearbeitung muss die angefochtene Saldenrueckfuehrung selbststaendig aus der Tagessaldenliste
      nachrechnen.
  - id: p02-inkongruenz-linienreduzierung
    check_type: human_review
    description: Die zentrale Rechtsfrage der erzwungenen Linienreduzierung mit anschliessender Verrechnung muss
      als Kongruenzproblem des Paragraf 131 Abs. 1 InsO erkannt und beidseitig diskutiert werden.
  - id: p03-kenntnis-aus-kontodaten
    check_type: human_review
    description: Die Beweisanzeichen fuer die Kenntnis der Sparkasse (Paragraf 130 Abs. 2 InsO) muessen aus den
      Datendateien zusammengetragen und gewichtet werden.
  - id: p04-verrechnung-nach-pfaendung
    check_type: human_review
    description: Die Verrechnung nach Zustellung des Pfaendungs- und Ueberweisungsbeschlusses am 26.01.2026 muss
      als eigenstaendiger Anfechtungskomplex behandelt werden.
  - id: p05-insolvenzreife-diskrepanz
    check_type: human_review
    description: Die Diskrepanz zwischen dem Eigenantrag (Zahlungsunfaehigkeit Mitte Januar 2026) und den Finanzdaten
      muss aufgedeckt werden.
  - id: p06-kein-bargeschaeft-und-rechtsfolge
    check_type: human_review
    description: Der Bargeschaefts- und Betriebsfortfuehrungseinwand der Sparkasse muss geprueft und die Rechtsfolge
      zutreffend bestimmt werden.
