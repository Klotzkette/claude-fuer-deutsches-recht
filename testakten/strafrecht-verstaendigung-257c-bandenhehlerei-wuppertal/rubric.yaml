name: strafrecht-verstaendigung-257c-bandenhehlerei-wuppertal
plugin: "aktenaufbereiter-strafrecht"
description: Verstaendigung nach Paragraf 257c StPO in einer Bandenhehlerei-Sache vor dem LG Wuppertal mit Rekonstruktion
  der Verstaendigungs-Chronologie aus E-Mails und Protokollen, fehlender Belehrungs-Protokollierung, Beweiskraft
  des Protokolls und Loesung des Gerichts nach neuen Erkenntnissen.
checks:
  - id: datei-01-aktenvorblatt-bandakte-2026-07-01
    check_type: file_exists
    description: Das Primäraktenstück 01_aktenvorblatt_bandakte_2026-07-01.docx ist für die Fallauswertung vorhanden.
    path: 01_aktenvorblatt_bandakte_2026-07-01.docx
  - id: datei-02-anklageschrift-2026-02-02
    check_type: file_exists
    description: Das Primäraktenstück 02_anklageschrift_2026-02-02.docx ist für die Fallauswertung vorhanden.
    path: 02_anklageschrift_2026-02-02.docx
  - id: p1-chronologie-rekonstruktion
    check_type: human_review
    description: Die Verstaendigungs-Chronologie ist ueber E-Mails, Eroerterungsvermerk und Protokolle verstreut.
      Wird sie vollstaendig und in der richtigen Reihenfolge zusammengesetzt?
  - id: p2-foermlichkeiten-belehrung-fehlt
    check_type: human_review
    description: 'Datenauswertungs-Kern: Aus dem Protokoll des 1. Sitzungstages muss abgeglichen werden, welche
      Foermlichkeiten des Verstaendigungsverfahrens dokumentiert sind und welche fehlen.'
  - id: p3-diskrepanz-vermerk-protokoll
    check_type: human_review
    description: Der Kammervermerk vom 29.04.2026 behauptet eine muendlich erteilte Belehrung, das Protokoll schweigt.
      Wird der Widerspruch erkannt und ueber Paragraf 274 StPO aufgeloest?
  - id: p4-loesungsvoraussetzungen
    check_type: human_review
    description: Die Kammer will sich wegen des neu entdeckten Erwerbsvorgangs vom 24.10.2025 von der Verstaendigung
      loesen. Werden die Voraussetzungen des Paragraf 257c Abs. 4 Satz 1 StPO sauber geprueft?
  - id: p5-verwertungsverbot-reichweite
    check_type: human_review
    description: Streit um die Reichweite des Verwertungsverbots nach Paragraf 257c Abs. 4 Satz 3 StPO fuer das
      Gestaendnis, auch mit Blick auf das neue Verfahren 26 Js 902/26.
  - id: p6-zahlenwerk-beute
    check_type: human_review
    description: 'Datenauswertung mit konkreten Werten: Beuteliste und Plattform-Auszahlungen muessen rechnerisch
      nachvollzogen und mit Anklage und Gestaendnis abgeglichen werden.'
