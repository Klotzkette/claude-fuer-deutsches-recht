name: ki-recht-konformitaetsbewertung-luecken-medizinprodukt-triage-freiburg
plugin: "ki-vo-ai-act-pruefer"
description: 'Konformitaetsbewertung eines Hochrisiko-KI-Systems an der Schnittstelle zum Medizinprodukterecht nach
  der Verordnung (EU) 2024/1689 und der Verordnung (EU) 2017/745. Die SaniScore Medizintechnik GmbH will das Software-Medizinprodukt
  TriageAssist in Verkehr bringen. Die technische Dokumentation und der Entwurf der EU-Konformitaetserklaerung behaupten
  vollstaendige Konformitaet und eine ueber alle Patientengruppen gleichwertige Leistung, waehrend Datenuebersicht,
  Performance-Log, Aufsichtskonzept und Risikoregister Luecken zeigen. Prueffragen: Genauigkeit und Subgruppenleistung,
  Daten-Governance, Risikomanagement, menschliche Aufsicht, Protokollierung und Cybersicherheit, Zusammenspiel mit
  der benannten Stelle sowie Normstand-Sorgfalt.'
checks:
  - id: datei-01-produktbeschreibung-triageassist-2025-11
    check_type: file_exists
    description: Das Primäraktenstück 01_produktbeschreibung_triageassist_2025-11.docx ist für die Fallauswertung
      vorhanden.
    path: 01_produktbeschreibung_triageassist_2025-11.docx
  - id: datei-02-zweckbestimmung-und-medizinprodukt-einordnung-2025-11
    check_type: file_exists
    description: Das Primäraktenstück 02_zweckbestimmung_und_medizinprodukt_einordnung_2025-11.docx ist für die
      Fallauswertung vorhanden.
    path: 02_zweckbestimmung_und_medizinprodukt_einordnung_2025-11.docx
  - id: p01-datenauswertung-sensitivitaet
    check_type: human_review
    description: Die Ueberschaetzung der Genauigkeit fuer die Altersgruppe ab achtzig Jahren muss aus dem Performance-Log
      (Aktenstueck 06) und der Datenuebersicht (Aktenstueck 05) selbststaendig berechnet werden.
  - id: p02-diskrepanz-konformitaetserklaerung
    check_type: human_review
    description: Die gewollte Diskrepanz zwischen dem Entwurf der EU-Konformitaetserklaerung und der tatsaechlichen
      Aktenlage muss erkannt und rechtlich verwertet werden.
  - id: p03-normstand-sorgfalt
    check_type: human_review
    description: Der Umgang mit dem beweglichen Normstand der KI-Verordnung muss dem Normstand-Vermerk (Aktenstueck
      13) entsprechen.
  - id: p04-menschliche-aufsicht-und-risikomanagement
    check_type: human_review
    description: Die Luecken bei menschlicher Aufsicht und Risikomanagement muessen praezise herausgearbeitet werden.
  - id: p05-daten-governance-und-cybersicherheit
    check_type: human_review
    description: Daten-Governance, Genauigkeitsnachweis und Cybersicherheit muessen als unvollstaendig erkannt werden.
  - id: p06-schnittstelle-medizinprodukt-benannte-stelle
    check_type: human_review
    description: Das Zusammenspiel von KI-Verordnung und Medizinprodukterecht und die Rolle der benannten Stelle
      muessen zutreffend eingeordnet werden.
