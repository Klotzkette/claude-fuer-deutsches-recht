name: strafrecht-haeusliche-gewalt-koerperverletzung-dresden
description: Ermittlungsakte zu häuslicher Gewalt in Dresden mit ärztlichem Befund, Nachbarzeugen, Kontaktverbot, Aussagekonstanz und Verteidigungs- wie Opferschutzperspektive.
checks:
  - Verfahrensrolle, Fristen und nächstes Arbeitsprodukt vor der materiellen Prüfung klären.
  - Belastende und entlastende Tatsachen nicht vermischen, sondern je Beweismittel ausweisen.
  - id: p03-eskalationschronologie-vs-einlassung
    beschreibung: >
      Aus der Eskalations- und Einsatzchronologie muss die Zahl der
      Polizeieinsaetze vor dem 04.06.2026 ermittelt und der Einlassung des
      Beschuldigten gegenuebergestellt werden, es habe zuvor nie
      polizeiliche Massnahmen gegeben; ergaenzend ist die Erst- gegen die
      Folgeaussage des Beschuldigten zu halten.
    erwartung: >
      Aus der CSV ergeben sich zwei dokumentierte Polizeieinsaetze vor der
      Tat, am 22.03.2026 und am 19.05.2026, sowie ein Zeitraum von 74 Tagen
      zwischen dem ersten Einsatz und der Tat; das widerlegt die Einlassung,
      es habe zuvor nie polizeiliche Massnahmen gegeben. Zusaetzlich ist die
      Verschiebung in den Angaben des Beschuldigten aufzuzeigen, der am
      Einsatzort ein blosses Herunterfallen der Flasche ohne Anfassen
      angab und spaeter eine Selbstverletzung der Geschaedigten beim
      Durchsuchen seiner Tasche behauptet.
  - Normanker nur als Arbeitshilfe verwenden und Subsumtion am konkreten Sachverhalt durchführen.
  - Nebenfolgen wie Einziehung, Fahrerlaubnis, Kontaktverbot, Haft oder Berufsfolgen ausdrücklich mitdenken.
  - Nebenklagefähige Aktenauswertung, Schutzantragsentwurf und Beweisanregung zur Sicherung der Originalfotos sowie der Funkstreifenwagen-Bodycam-Metadaten.
