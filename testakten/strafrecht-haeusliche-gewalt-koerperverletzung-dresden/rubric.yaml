name: strafrecht-haeusliche-gewalt-koerperverletzung-dresden
plugin: "fachanwalt-strafrecht"
description: Ermittlungsakte zu häuslicher Gewalt in Dresden mit ärztlichem Befund, Nachbarzeugen, Kontaktverbot,
  Aussagekonstanz und Verteidigungs- wie Opferschutzperspektive.
checks:
  - id: datei-neu-primaerbeleg
    check_type: file_exists
    description: Der Primaerbeleg 13_lichtbildmappe_verletzungsdokumentation_2026-06-04.docx ist vorhanden.
    path: 13_lichtbildmappe_verletzungsdokumentation_2026-06-04.docx
  - id: datei-02-sachverhalt-chronologie
    check_type: file_exists
    description: Das Primäraktenstück 02_sachverhalt_chronologie.docx ist für die Fallauswertung vorhanden.
    path: 02_sachverhalt_chronologie.docx
  - id: fachpruefung-01
    check_type: human_review
    description: Verfahrensrolle, Fristen und nächstes Arbeitsprodukt vor der materiellen Prüfung klären.
  - id: fachpruefung-02
    check_type: human_review
    description: Belastende und entlastende Tatsachen nicht vermischen, sondern je Beweismittel ausweisen.
  - id: p03-eskalationschronologie-vs-einlassung
    check_type: human_review
    description: Aus der Eskalations- und Einsatzchronologie muss die Zahl der Polizeieinsaetze vor dem 04.06.2026
      ermittelt und der Einlassung des Beschuldigten gegenuebergestellt werden, es habe zuvor nie polizeiliche Massnahmen
      gegeben; ergaenzend ist die Erst- gegen die Folgeaussage des Beschuldigten zu halten.
  - id: fachpruefung-04
    check_type: human_review
    description: Normanker nur als Arbeitshilfe verwenden und Subsumtion am konkreten Sachverhalt durchführen.
  - id: fachpruefung-05
    check_type: human_review
    description: Nebenfolgen wie Einziehung, Fahrerlaubnis, Kontaktverbot, Haft oder Berufsfolgen ausdrücklich mitdenken.
  - id: fachpruefung-06
    check_type: human_review
    description: Nebenklagefähige Aktenauswertung, Schutzantragsentwurf und Beweisanregung zur Sicherung der Originalfotos
      sowie der Funkstreifenwagen-Bodycam-Metadaten.
