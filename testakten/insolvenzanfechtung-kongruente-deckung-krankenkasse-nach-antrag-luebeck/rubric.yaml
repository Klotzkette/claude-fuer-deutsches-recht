name: insolvenzanfechtung-kongruente-deckung-krankenkasse-nach-antrag-luebeck
plugin: "fachanwalt-insolvenz-sanierungsrecht"
description: Prueft, ob ein Bearbeiter die Anfechtung einer nach dem Eroeffnungsantrag geleisteten kongruenten Beitragszahlung
  nach Paragraf 130 Abs. 1 Satz 1 Nr. 2 InsO beherrscht, die Kenntnis- und Wissenszurechnungsfrage anhand der ambivalenten
  Beweismittel diskutiert und die in der Akte verborgene Insolvenzreife-Diskrepanz findet.
checks:
  - id: datei-01-verfahrensvermerk-verwalter
    check_type: file_exists
    description: Das Primäraktenstück 01_verfahrensvermerk_verwalter.docx ist für die Fallauswertung vorhanden.
    path: 01_verfahrensvermerk_verwalter.docx
  - id: datei-02-fremdantrag-holstein-2026-02-09
    check_type: file_exists
    description: Das Primäraktenstück 02_fremdantrag_holstein_2026-02-09.docx ist für die Fallauswertung vorhanden.
    path: 02_fremdantrag_holstein_2026-02-09.docx
  - id: norm-und-tatbestand
    check_type: human_review
    description: Die richtige Tatbestandsvariante wird identifiziert und von den Nachbartatbestaenden abgegrenzt.
  - id: kenntnis-eroeffnungsantrag
    check_type: human_review
    description: Die Beweismittel zur Kenntnis des Eroeffnungsantrags werden vollstaendig gehoben und gewuerdigt.
  - id: wissenszurechnung-koerperschaft
    check_type: human_review
    description: Das Problem der Wissenszurechnung innerhalb der Krankenkasse wird erkannt und mit Argumenten beider
      Seiten entwickelt.
  - id: kenntnis-zahlungsunfaehigkeit-alternative
    check_type: human_review
    description: Die zweite Tatbestandsalternative (Kenntnis der Zahlungsunfaehigkeit beziehungsweise entsprechender
      Umstaende nach Paragraf 130 Abs. 2 InsO) wird eigenstaendig geprueft.
  - id: insolvenzreife-diskrepanz
    check_type: human_review
    description: Die Diskrepanz zwischen dem Kurzgutachten (Zahlungsunfaehigkeit zum 31.03.2025) und der Datierung
      im Verwalterschreiben (Krise nach aussen manifest erst ab Januar 2026) wird gefunden und rechnerisch nachvollzogen.
  - id: rechtsfolgen-und-prozess
    check_type: human_review
    description: Rechtsfolgen und prozessuale Punkte werden zutreffend benannt.
