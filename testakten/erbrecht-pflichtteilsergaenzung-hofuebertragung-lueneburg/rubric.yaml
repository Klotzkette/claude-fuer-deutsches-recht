name: erbrecht-pflichtteilsergaenzung-hofuebertragung-lueneburg
plugin: "fachanwalt-erbrecht"
description: Pflichtteils- und Pflichtteilsergänzungsakte mit Hofübertragung, Vorbehaltsrechten, Baugrundstücken,
  Depotlücke, Pflegebehauptung und Auskunftsstufe.
checks:
  - id: datei-02-testament-und-nachlassverzeichnis
    check_type: file_exists
    description: Die eigenständige Testamentsabschrift ist für die Fallauswertung vorhanden.
    path: 02_testament_helmut_rieken_2022.docx
  - id: fachpruefung-01
    check_type: human_review
    description: Pflichtteil und Pflichtteilsergänzung getrennt berechnen.
  - id: fachpruefung-02
    check_type: human_review
    description: Vorbehaltsrechte (Wohnungsrecht, Obstwiese, Scheunenpacht, Rückauflassungsvormerkung) und Gegenleistungen
      nicht pauschal behandeln.
  - id: fachpruefung-03
    check_type: human_review
    description: Auskunft, Wertermittlung, eidesstattliche Versicherung und Zahlungsstufe unterscheiden.
  - id: fachpruefung-04
    check_type: human_review
    description: Zehnjahresbetrachtung, Fristbeginn und wirtschaftlichen Vollzug der Übertragung 2019 problematisieren.
  - id: fachpruefung-05
    check_type: human_review
    description: Zahlung von 35.000 EUR an Moritz als mögliche Anrechnung gesondert würdigen und dabei erkennen,
      dass eine dem Empfänger mitgeteilte Anrechnungsbestimmung nicht belegt ist.
  - id: fachpruefung-06
    check_type: human_review
    description: Diskrepanz zwischen Nachlassaufstellung der Erbin (Stück 02) und Bankauskunft (Stück 08, fortbestehende
      Bundesanleihe, Überweisungen an Alva und Jannik) als Aufklärungspunkt benennen.
  - id: fachpruefung-07
    check_type: human_review
    description: Bewertungsspanne (Geschäftswert 410.000 EUR gegen Maklereinschätzung 740.000 bis 820.000 EUR ohne
      Innenbesichtigung) nicht als feststehenden Wert übernehmen.
