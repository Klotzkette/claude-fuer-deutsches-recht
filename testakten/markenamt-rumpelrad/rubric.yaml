name: markenamt-rumpelrad
plugin: markenamt-assistent
description: Drei Berliner Gründer bauen ein kompaktes Lastenfahrrad. Die Markenakte beginnt vor der Registereintragung
  der Gesellschaft und enthält zwei Logoentwürfe, einen ähnlich klingenden Registertreffer, eine fehlerhafte Gebührenanforderung
  und eine noch nicht abgeschickte Anmeldung.
