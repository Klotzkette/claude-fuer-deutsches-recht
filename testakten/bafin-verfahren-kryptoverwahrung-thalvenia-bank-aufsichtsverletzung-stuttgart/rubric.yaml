# Strukturelle Baseline-Rubrik. Fallbezogene Inhaltschecks bleiben erhalten.
name: Bafin Verfahren Kryptoverwahrung Thalvenia Bank Aufsichtsverletzung Stuttgart
plugin: regulatorisches-recht
checks:
- id: r01-readme-vorhanden
  check_type: file_exists
  description: README.md vorhanden
  path: README.md
- id: r02-gesamt-pdf-vorhanden
  check_type: file_exists
  description: Gesamt-PDF gebaut
  path: gesamt-pdf/bafin-verfahren-kryptoverwahrung-thalvenia-bank-aufsichtsverletzung-stuttgart_gesamt.pdf
- id: r03-mindestens-3-arbeitsunterlagen
  check_type: working_file_count
  description: Mindestens drei exportierbare Arbeitsunterlagen vorhanden
  min: 3
- id: r-bafin-erwaehnt
  check_type: text_contains
  description: BaFin als Aufsichtsbehoerde benannt
  path: README.md
  contains: BaFin
- id: r-kwg-paragrafen
  check_type: regex_match
  description: KWG-Paragrafen referenziert
  path: README.md
  pattern: KWG
- id: r-micar
  check_type: text_contains
  description: MiCAR erwaehnt
  path: README.md
  contains: MiCAR
