# Strukturelle Baseline-Rubrik. Fallbezogene Inhaltschecks bleiben erhalten.
name: Starug Schutzschirm Grossbach Druckguss Erfurt
plugin: fachanwalt-insolvenz-sanierungsrecht
checks:
- id: r01-readme-vorhanden
  check_type: file_exists
  description: README.md vorhanden
  path: README.md
- id: r02-gesamt-pdf-vorhanden
  check_type: file_exists
  description: Gesamt-PDF gebaut
  path: gesamt-pdf/starug-schutzschirm-grossbach-druckguss-erfurt_gesamt.pdf
- id: r03-mindestens-3-arbeitsunterlagen
  check_type: working_file_count
  description: Mindestens drei exportierbare Arbeitsunterlagen vorhanden
  min: 3
- id: r-starug-erwaehnt
  check_type: text_contains
  description: StaRUG genannt
  path: README.md
  contains: StaRUG
- id: r-paragraf-270b-inso
  check_type: regex_match
  description: Schutzschirm-Verfahren / Paragraf 270b InsO
  path: README.md
  pattern: (Schutzschirm|270b)
