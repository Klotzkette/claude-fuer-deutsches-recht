	<title>Figur P · Zeichnung zum ursprünglichen Prioritätsbeleg P0</title>
	<desc>Blick von oben auf die angehaltene Fruchtkiste vor der Kamera. Die eingezeichneten Sicht- und Beleuchtungslinien treffen denselben Wandabschnitt. Die beiden Leuchten werden zeitlich nacheinander aktiviert. Die Steuerung gibt nach dem Bildvergleich das Signal an einen Anschluss für die Weiche aus. Zeichnungsstand der Fallabschrift vom 2. Dezember 2025.</desc>
