	<title>Figur 1 · Raststelle an der Stützenwand, Schieber eingefahren</title>
	<desc>Schnitt durch eine Führungswange, schematisch und ohne Maßstab. Links liegt der Innenraum der Stütze, rechts der von außen erreichbare Schieber. Die Unterbrechung in der Stützenwand ist das Rastfenster. Die Zunge ist unten am Fußkörper gehalten. Der am oberen Ende eingezeichnete Vorsprung greift durch das Fenster. Der schraffurfreie rechteckige Kopf rechts hinter der Zunge gehört zum Schieber. Die Führung lässt seine Rücknahme nach rechts zu. Die Zeichnung beschreibt die Sperrstellung. Ein Lastantrieb oder ein federnder Bodenteller ist in dieser Figur nicht eingezeichnet.</desc>
