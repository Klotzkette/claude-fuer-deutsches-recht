# Konfiguration für mutmut 3.x (Mutationstests der Hausstil- und Prüfhash-Werkzeuge).
# Aufruf: HYPOTHESIS_PROFILE=mutmut mutmut run; Ergebnis: mutmut results.
# mutmut kopiert nur source_paths und also_copy nach mutants/; hausstil.json und die
# Prüfprofile braucht die Testsuite zur Laufzeit. mutants/ nie neben audit-hausstil.py
# oder apply-hausstil.py stehen lassen; beide sehen es sonst über git ls-files --others.
[mutmut]
source_paths = scripts
only_mutate =
    scripts/hausstil.py
    scripts/pruefhashes.py
    scripts/apply-hausstil.py
    scripts/audit-hausstil.py
    scripts/refresh-pruefhashes-nach-hausstil.py
    scripts/inject-ausformulierungspflicht.py
do_not_mutate =
    scripts/tests/*
also_copy =
    hausstil.json
    quality/evals
pytest_add_cli_args_test_selection =
    scripts/tests/test_hausstil.py
    scripts/tests/test_pruefhashes.py
