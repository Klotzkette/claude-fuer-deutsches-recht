name: Qualitätsrunde Skills und Prompts

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Unbenutzter Komponententag aus dem Release-Scope'
        required: true
        default: qualitaetsrunde-v445.36.9
      expected_commit:
        description: 'Vollständiger geprüfter Main-Commit (40 Hexadezimalzeichen)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: skill-quality-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag }}
      EXPECTED_COMMIT: ${{ inputs.expected_commit }}
      SCOPE: ${{ inputs.tag == 'qualitaetsrunde-v445.36.12' && 'scripts/data/interstate-ag-release-scope.json' || inputs.tag == 'qualitaetsrunde-v445.36.13' && 'scripts/data/qualitaetsrunde-v445.36.13-scope.json' || contains(fromJSON('["qualitaetsrunde-v445.36.14","qualitaetsrunde-v445.36.15","qualitaetsrunde-v445.36.16","qualitaetsrunde-v445.36.17","qualitaetsrunde-v445.36.18"]'), inputs.tag) && format('scripts/data/{0}-scope.json', inputs.tag) || 'scripts/data/skill-quality-release-scope.json' }}
    steps:
      - name: Nur geprüften Main-Workflow zulassen
        if: github.ref != 'refs/heads/main'
        run: |
          echo 'Dieser Veröffentlichungsworkflow muss auf main gestartet werden.'
          exit 1
      - name: Unveränderliche Eingabe prüfen
        run: |
          [[ "$EXPECTED_COMMIT" =~ ^[a-f0-9]{40}$ ]]
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.expected_commit }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Herkunft und Release-Scope prüfen
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          git merge-base --is-ancestor HEAD origin/main
          if [[ "$TAG" == qualitaetsrunde-v445.36.12 || "$TAG" == qualitaetsrunde-v445.36.13 ]]; then
            test "$EXPECTED_COMMIT" = "$(git rev-parse "refs/tags/$TAG^{commit}")"
          fi
          test "$TAG" = "$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["tag"])' "$SCOPE")"
          test -s "docs/releases/$TAG.md"
          python3 -m pip install -r requirements.txt
      - name: Vergabestellen-Akten und installierbares Paket prüfen
        if: contains(fromJSON('["qualitaetsrunde-v445.36.12","qualitaetsrunde-v445.36.13","qualitaetsrunde-v445.36.15","qualitaetsrunde-v445.36.16","qualitaetsrunde-v445.36.17","qualitaetsrunde-v445.36.18"]'), inputs.tag)
        run: |
          RENDER_LIBS="$RUNNER_TEMP/vergabestelle-render"
          python3 -m pip install --target "$RENDER_LIBS" -r vergaberecht-werkstatt/requirements-dev.txt
          export PYTHONPATH="$RENDER_LIBS${PYTHONPATH:+:$PYTHONPATH}"
          python3 scripts/build-interstate-testakten.py --check
          python3 scripts/test-interstate-testakten.py
      - name: Patentanmelder-Ausgabe mit drei vollständigen Offline-Akten prüfen
        if: inputs.tag == 'qualitaetsrunde-v445.36.14'
        run: |
          RENDER_LIBS="$RUNNER_TEMP/patentanmelder-render"
          python3 -m pip install --target "$RENDER_LIBS" \
            reportlab==4.4.9 pypdf==6.21.4 openpyxl==3.1.5 python-docx==1.2.0 lxml==6.1.1
          PYTHONPATH="$RENDER_LIBS" python3 scripts/build-patentanmelder-akten.py --check
          python3 scripts/test-patentanmelder-workflow.py
          python3 scripts/test-patentanmelder-release.py
      - name: Struktur, Auswahl und Quellenbindung prüfen
        run: |
          node scripts/validate-plugin-structure.mjs
          node scripts/validate-marketplace-import.mjs
          python3 scripts/validate-yaml-frontmatter.py
          python3 scripts/validate-runtime-performance.py
          python3 scripts/audit-skill-activation.py
          python3 scripts/audit-skill-selection.py
          python3 scripts/audit-prompt-profile-routing.py
          python3 scripts/main_skill_revisions.py
          python3 scripts/quality_lab.py audit --require-editorial --require-workflow
          python3 scripts/validate-current-law-sentinels.py
          python3 scripts/consolidate-skill-cap.py --verify quality/skill-consolidation/2026-11-14/source-map.json --strict-links
          python3 scripts/validate-root-readme-overview.py
          python3 scripts/validate-readme-navigation.py
          python3 scripts/validate-markdown-structure.py
          python3 scripts/validate-testakten-gesamt-pdf.py
          python3 scripts/validate-testakten-readme-downloads.py
          python3 scripts/sync-werkstatt-visualisierung.py --check
      - name: Migration und Veröffentlichungsschranken testen
        run: |
          python3 scripts/test-skill-cap-migration.py
          python3 scripts/test-skill-cap-integration.py
          python3 scripts/test-skill-registry-preparation.py
          python3 scripts/test-final-decision-generator.py
          python3 scripts/test-plugin-consolidation.py
          python3 scripts/test-skill-activation.py
          python3 scripts/test-skill-source-replacements.py
          python3 scripts/test-marketplace-import.py
          python3 scripts/test-skill-quality-release.py
          python3 scripts/test-jugendmedien-paket.py
          python3 scripts/test-prompt-workflow-preservation.py
          python3 scripts/test-readme-navigation.py
          python3 scripts/test-werkstatt-visualisierung.py
          python3 scripts/test-anfechtung-werkstattprompts.py
          python3 scripts/test-insolvenzanfechtung.py
          python3 scripts/test-main-skill-revisions.py
          python3 scripts/test-package-link-revisions.py
          python3 scripts/test-quality-lab.py
          python3 scripts/test-skill-package-links.py
          python3 scripts/test-runtime-performance.py
          python3 scripts/test-skill-selection.py
          python3 scripts/test-skill-sources.py
          python3 scripts/test-schwerpunkt-coverage.py
          python3 scripts/test-vergaberecht-module-routing.py
          python3 scripts/test-markdown-structure.py
          python3 scripts/test-current-law-fachinhalte.py
          python3 scripts/test-agenten-digitalrecht.py
          python3 scripts/test-datenschutz-fanpage-quellen.py
          node --test scripts/test-skill-map-references.mjs
          node --test scripts/test-audit-link-contexts.mjs
          python3 scripts/test-release-assets.py
          python3 scripts/test-release-rate-limits.py
          python3 scripts/test-scoped-release-routing.py
      - name: Akten-Erhalt für die Zusammenführungsrunde prüfen
        if: inputs.tag == 'qualitaetsrunde-v445.36.5'
        run: python3 scripts/validate-plugin-consolidation.py
      - name: Vollständige Pakete aus dem freigegebenen Commit bauen
        run: |
          python3 scripts/build-skill-quality-release.py --scope "$SCOPE" --dist "$RUNNER_TEMP/quality-dist" --expected-commit "$EXPECTED_COMMIT"
          python3 scripts/build-skill-quality-release.py --scope "$SCOPE" --dist "$RUNNER_TEMP/quality-dist" --verify --expected-commit "$EXPECTED_COMMIT"
      - name: Prüfnachweise sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qualitaetsrunde-pakete
          path: ${{ runner.temp }}/quality-dist/*
          if-no-files-found: ignore
          retention-days: 7
      - name: Geschützte Veröffentlichung nach Downloadprüfung
        env:
          GH_TOKEN: ${{ github.token }}
        # Der Publisher nutzt upload-release-assets.py --protect-published,
        # führt die vollständige --verify-download-Prüfung gegen die Quellen aus
        # und setzt erst danach --draft=false; bestehende Publikationen bleiben.
        run: |
          python3 scripts/publish-skill-quality-release.py --scope "$SCOPE" --dist "$RUNNER_TEMP/quality-dist" --expected-commit "$EXPECTED_COMMIT" --repo "$GITHUB_REPOSITORY"
