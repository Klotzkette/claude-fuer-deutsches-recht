name: Release Plugin ZIPs

# Baut bei jedem Tag oder bei manueller Ausloesung pro Plugin eine ZIP-Datei
# und haengt sie an den GitHub Release. Damit ergeben sich stabile Download-URLs:
#   https://github.com/Klotzkette/claude-fuer-deutsches-recht/releases/latest/download/<plugin>.zip
# Direkt einzeln in kompatiblen Plugin-Oberflaechen installierbar.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release-Tag (z. B. v1.1.0). Leer = nur ZIPs bauen, keinen Release anlegen.'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: release-plugin-zips-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Validator
        run: |
          node --test scripts/test-skill-map-references.mjs
          node scripts/validate-plugin-structure.mjs

      - name: Python-Abhängigkeiten installieren
        run: python3 -m pip install -r requirements.txt

      - name: Lokale Grundstücksrecherche prüfen
        run: |
          python3 -m pip install -r grundstuecksrecherche/app/requirements.txt
          python3 -m unittest discover -s grundstuecksrecherche/tests -v
          python3 scripts/test-app-only-integration.py

      - name: Versionsstände und Prüfprofile vor dem PDF-Build prüfen
        run: |
          python3 scripts/validate-root-readme-overview.py
          python3 scripts/quality-lab.py audit

      - name: Layoutgetreue Office-PDF-Konvertierung bereitstellen
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer libreoffice-calc libreoffice-impress fonts-dejavu-core fonts-liberation2

      - name: YAML-Frontmatter validieren
        run: python3 scripts/validate-yaml-frontmatter.py

      - name: Marketplace-Import validieren
        run: |
          python3 scripts/test-marketplace-import.py
          node scripts/validate-marketplace-import.mjs

      - name: Laufzeitbudgets der Plugins validieren
        run: python3 scripts/validate-runtime-performance.py

      - name: Qualitätslabor offline prüfen (keine Modellläufe)
        run: |
          python3 scripts/test-quality-lab.py
          python3 scripts/test-schwerpunkt-coverage.py
          python3 scripts/quality-lab.py audit --require-editorial --require-workflow --catalog QUALITY.md
          python3 scripts/generate-schwerpunkte.py

      - name: Technischen Testaktenbestand prüfen (keine Modellbewertung)
        run: |
          python3 scripts/test-run-eval.py
          python3 scripts/run-eval.py --quiet --structural-only

      - name: Release- und PDF-Helfer testen
        run: |
          python3 scripts/test-release-assets.py
          python3 scripts/test-complete-package.py
          python3 scripts/test-registerakten-print-profile.py --native "$RUNNER_TEMP/registerakten-print-qa"
          python3 scripts/test-release-routing.py
          python3 scripts/test-public-downloads.py
          python3 scripts/test-testakte-pdf-build.py
          python3 scripts/test-testakte-projektordner.py
          python3 scripts/test-fintech-bremen.py
          python3 scripts/test-modefuchs-lebensakte.py
          python3 scripts/test-gesellschafter-vorfuehrakten.py
          python3 scripts/test-kommunale-haftpflicht.py
          python3 scripts/test-geburtsschaden-akte.py
          python3 scripts/test-kommunale-alltagsakten.py
          python3 scripts/test-kommunale-schriftverkehr.py
          python3 scripts/test-kommunale-vertiefung.py
          python3 scripts/test-verletzungsrisiko-akte.py
          python3 scripts/test-office-resilience.py
          python3 scripts/test-testakten-email-quality.py
          python3 scripts/test-weg-hausverwaltungsakten.py
          python3 scripts/test-weg-kleinhausen.py
          python3 scripts/test-playbook-review.py
          python3 scripts/test-testakten-ohne-loesungen.py
          python3 scripts/validate-testakten-ohne-loesungen.py
          python3 scripts/test-testakte-bwa-abstimmung.py
          python3 scripts/test-testakte-pohlmann-fristen.py
          python3 scripts/test-datenschutz-fanpage-quellen.py
          python3 scripts/validate-testakte-bwa-abstimmung.py
          python3 scripts/test-grundsteuer-wolkenfels.py
          python3 scripts/test-grundsteuerrecht.py
          python3 scripts/test-digitaler-omnibus.py
          python3 scripts/test-schadensregulierung.py
          python3 scripts/test-pflegerecht-sgb-xi.py
          python3 scripts/test-einfache-sprache-pakete.py
          python3 scripts/test-antidiskriminierung-agg.py
          python3 scripts/test-mietchecker.py
          python3 scripts/test-eigenbedarfskuendigungschecker.py
          python3 scripts/test-registerwerkstaetten.py
          python3 scripts/test-insolvenzforderungen-export.py
          python3 scripts/test-insolvenzforderungen-checker.py
          python3 scripts/test-sektorenvergabe-workflow.py
          python3 scripts/test-bauvergabe.py
          python3 scripts/test-bauvergabe-skill-selection.py
          python3 scripts/test-bauwirtschaft-rundum.py
          python3 scripts/test-prompt-profile-app-boundary.py
          python3 scripts/test-insolvenzforderungen-baeckerei.py
          python3 scripts/test-insolvenzforderungen-asset-deal.py
          python3 scripts/test-vertragserstellung-mandatsakten.py
          python3 scripts/test-notariatswerkstatt.py
          python3 scripts/test-arbeitszeugnispruefer.py
          python3 scripts/test-ki-verordnung-hochrisiko-pruefer.py
          python3 scripts/test-ki-verordnung-transparenzpruefer.py
          python3 scripts/test-enteignung-artikel-14.py
          python3 scripts/test-vergesellschaftung-artikel-15.py
          python3 scripts/test-fachpruefer-integration.py
          python3 scripts/test-juristische-praesentationen.py
          python3 scripts/test-geldwaeschepraevention.py
          python3 scripts/test-arbeitsrecht-asset-deal.py
          python3 scripts/test-betriebskosten-hausverwaltung.py
          python3 scripts/test-rechtsabteilung-immobilien.py
          python3 scripts/test-zugewinnausgleich.py
          python3 scripts/test-strassennutzung.py
          python3 scripts/test-anwaltschaft-vertragswerkstatt.py
          python3 scripts/test-kompakte-wirtschaftspakete.py
          python3 scripts/test-vertragserstellung-kassel-akte.py
          python3 scripts/test-wirtschaftsanwalt-hannover-akte.py
          python3 scripts/test-bauwirtschaft.py
          python3 scripts/test-bauwirtschaft-einbeck.py
          python3 scripts/test-bauwirtschaft-northeim.py
          python3 scripts/test-bauwirtschaft-kaufmaennisch.py
          python3 scripts/test-bauwirtschaft-hoai-1-3.py
          python3 scripts/test-bauwirtschaft-hoai-4-6.py
          python3 scripts/test-bauwirtschaft-hoai-7-9.py
          python3 scripts/test-bauwirtschaft-hildesheim.py
          python3 scripts/test-bauwirtschaft-hildesheim-lebensakte.py

      - name: Skill-Aktivierungssignale prüfen
        run: |
          python3 scripts/audit-skill-activation.py
          python3 scripts/test-skill-selection.py
          python3 scripts/test-official-plugin-validation.py
          python3 scripts/audit-skill-selection.py

      - name: Gesamt-PDFs der Testakten reproduzierbar bauen und validieren
        run: |
          python3 scripts/validate-testakten-dokumentqualitaet.py
          python3 scripts/build-testakte-gesamt-pdf.py
          python3 scripts/validate-testakten-gesamt-pdf.py

      - name: Keine Markdown-Aktenstücke in Testakten validieren
        run: python3 scripts/validate-testakten-keine-markdown-aktenstuecke.py

      - name: CSV-Aktenstücke validieren
        run: python3 scripts/validate-testakten-csv.py

      - name: Downloadhinweise der Testakten erzeugen
        run: |
          python3 scripts/inject-gesamt-pdf-section.py

      - name: Werkstatt- und Schnellstart-Prompts erzeugen
        run: |
          # Werkstatt- und Schnellstart-Prompts sind reine Markdown-Begleitdateien,
          # die NICHT als Skills in die Plugin-Logik gehören.
          # Das frueher hier aufgerufene sync-schnellstart-skill.py wurde absichtlich
          # entfernt, weil es pro Plugin einen skills/<plugin>-schnellstart/SKILL.md
          # erzeugt hat. Diese Wrapper-Skills würden beim Marketplace-Install als
          # zusätzlicher Skill geladen, obwohl sie nur Einstiegsdateien enthalten.
          # Die Werkstatt- und Schnellstart-Prompts bleiben ausschließlich als
          # direkte Markdown-Downloads im Repository erreichbar. Sie gehören
          # weder in die Skill-Logik noch in die installierbaren Plugin-ZIPs.
          python3 scripts/generate-werkstatt-und-schnellstart-prompts.py
          python3 scripts/test-prompt-publication-profiles.py
          python3 scripts/test-prompt-generator-excerpts.py
          python3 scripts/test-prompt-routing-scope.py
          python3 scripts/test-prompt-workflow-preservation.py
          python3 scripts/test-prompt-hygiene-links.py
          python3 scripts/refine-speed-and-elegance.py
          python3 scripts/test-portable-starts.py
          python3 scripts/inject-streitstoff-beitrag-gerichtsplugins.py
          python3 scripts/generate-megaprompt.py
          python3 scripts/test-generate-megaprompt.py
          python3 scripts/inject-megaprompt-section.py
          python3 scripts/inject-direkt-loslegen-section.py
          python3 scripts/generate-skills-overview.py
          python3 scripts/inject-skills-logic-navigation.py
          python3 scripts/generate-werkstatt-und-schnellstart-coverage.py
          python3 scripts/audit-generated-prompt-hygiene.py
          python3 scripts/audit-prompt-profile-routing.py
          python3 scripts/audit-quickstart-usability.py
          python3 scripts/validate-current-law-sentinels.py
          python3 scripts/test-legal-calculators.py
          python3 scripts/test-gmbh-gesellschafterversammlung.py
          node scripts/test-liquiditaetsplanung-rechenlogik.mjs
          python3 scripts/test-liquiditaetsplanung-excel.py
          python3 scripts/test-bea-versandmappe.py
          python3 scripts/test-startup-gruender.py
          python3 scripts/test-schnittflug-erweiterung.py
          python3 scripts/test-schnittflug-finanz-native.py
          python3 scripts/test-schriftsatz-versandwerkstatt.py

      - name: Skill-Indizes neu erzeugen (SKILLS.md + skills-index, Stand = marketplace-Version)
        run: python3 scripts/generate-skills-md.py

      - name: Release-Asset-Index neu erzeugen
        run: python3 scripts/generate-asset-index.py

      - name: Vollständigen Plugin-Katalog in README.md neu erzeugen
        run: python3 scripts/generate-root-plugin-catalog.py

      - name: Root- und Index-Übersichten gegen Marketplace validieren
        run: |
          python3 scripts/validate-testakten-readme-downloads.py
          python3 scripts/validate-root-readme-overview.py
          python3 scripts/validate-readme-navigation.py
          python3 scripts/test-readme-navigation.py
          python3 scripts/validate-markdown-structure.py

      - name: Pluginlokale Gesamt-PDFs der Testakten bauen
        run: python3 scripts/build-plugin-testakte-gesamt-pdfs.py

      - name: Generierte Textdateien gegen den Tag prüfen
        run: git diff --exit-code -- . ':(exclude,glob)**/gesamt-pdf/*.pdf'

      - name: Liste aller Plugins aus marketplace.json lesen
        id: plugins
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, pathlib
          m = json.loads(pathlib.Path('.claude-plugin/marketplace.json').read_text())
          plugins = [
              {"name": p["name"], "source": p.get("source") or f"./{p['name']}"}
              for p in m["plugins"]
          ]
          names = [p["name"] for p in plugins]
          print('names=' + ' '.join(names))
          print('plugins_json=' + json.dumps(plugins, ensure_ascii=False, separators=(',', ':')))
          PY

      - name: ZIPs bauen
        env:
          PLUGINS_JSON: ${{ steps.plugins.outputs.plugins_json }}
        run: |
          rm -rf dist
          mkdir -p dist
          python3 - <<'PY' > dist/plugin-map.tsv
          import json
          import os

          for plugin in json.loads(os.environ["PLUGINS_JSON"]):
              print(f"{plugin['name']}\t{plugin['source']}")
          PY
          while IFS=$'\t' read -r plugin source; do
            source="${source#./}"
            if [ ! -d "$source" ]; then
              echo "Plugin-Quelle fehlt: $plugin -> $source" >&2
              exit 1
            fi
            echo "Baue $plugin.zip"
            (cd "$source" && zip -rq "${GITHUB_WORKSPACE}/dist/${plugin}.zip" . \
              -x '*.DS_Store' '*__pycache__*' '*.pyc' 'CLAUDE.md' \
                 '*-werkstatt.md' '*-schnellstart.md' '*-hauptproblem.md' \
                 '*-werkstatt.txt' '*-schnellstart.txt' '*-hauptproblem.txt' \
                 '*-werkstatt.docx' '*-werkstatt.pdf')
            ls -la "dist/${plugin}.zip"
          done < dist/plugin-map.tsv
          # Manifest fuer Marketplace-Komfort
          cp .claude-plugin/marketplace.json dist/marketplace.json

      - name: Release-ZIPs validieren
        run: python3 scripts/validate-release-zips.py dist .claude-plugin/marketplace.json

      - name: Portable Grundstücksrecherche ohne Vorgangsdaten bauen
        run: python3 grundstuecksrecherche/app/portable.py dist/grundstuecksrecherche-website.zip

      - name: Beispielakten separat verpacken (kein Teil der Plugins, testakte-Prefix)
        run: |
          # Beispielakten werden mit testakte-Prefix gepackt, damit sie sich im
          # Namespace klar von Plugin-ZIPs unterscheiden und niemals versehentlich
          # über 'Install from .zip' als Plugin geladen werden können.
          python3 scripts/build-testakten-release-zips.py dist
          ls -la dist/testakte-*.zip | head

      - name: Testakten-Release-ZIPs validieren
        run: python3 scripts/validate-testakten-release-zips.py dist

      - name: Einzel-PDF-ZIPs der Testakten bauen (jede Unterlage als eigene PDF)
        run: |
          # Pro Testakte ein ZIP, in dem jede Unterlage als separate PDF vorliegt
          # (im Gegensatz zum Gesamt-PDF, das alle Stücke in ein Dokument fasst).
          mkdir -p dist/testakten-einzelpdfs
          python3 scripts/build-testakten-einzelpdf-zips.py dist/testakten-einzelpdfs
          cp dist/testakten-einzelpdfs/alle-testakten-einzelpdfs.zip dist/alle-testakten-einzelpdfs.zip
          cp dist/testakten-einzelpdfs/testakte-*-einzelpdfs.zip dist/
          ls -la dist/testakten-einzelpdfs/testakte-*-einzelpdfs.zip | head
          ls -lh dist/alle-testakten-einzelpdfs.zip

      - name: Einzel-PDF-ZIPs validieren
        run: python3 scripts/validate-testakten-einzelpdf-zips.py dist/testakten-einzelpdfs

      - name: Bauwirtschaftliche Originale und veröffentlichbare Akten abgleichen
        run: |
          python3 scripts/test-bauwirtschaft-einbeck.py --assets dist
          python3 scripts/test-bauwirtschaft-northeim.py --assets dist
          python3 scripts/test-bauwirtschaft-kaufmaennisch.py --assets dist
          python3 scripts/test-bauwirtschaft-hoai-1-3.py --assets dist
          python3 scripts/test-bauwirtschaft-hoai-4-6.py --assets dist
          python3 scripts/test-bauwirtschaft-hoai-7-9.py --assets dist
          python3 scripts/test-bauwirtschaft-hildesheim.py --assets dist
          python3 scripts/test-bauwirtschaft-hildesheim-lebensakte.py --assets dist
          python3 scripts/test-fintech-bremen.py --assets dist
          python3 scripts/test-modefuchs-lebensakte.py --assets dist
          VORFUEHRAKTEN_ZIPS=dist python3 scripts/test-gesellschafter-vorfuehrakten.py
          KOMMUNALE_HAFTPFLICHT_ZIPS=dist python3 scripts/test-kommunale-haftpflicht.py
          KOMMUNALE_ALLTAG_ZIPS=dist python3 scripts/test-kommunale-alltagsakten.py
          KOMMUNALE_SCHRIFTVERKEHR_ZIPS=dist python3 scripts/test-kommunale-schriftverkehr.py
          KOMMUNALE_VERTIEFUNG_ZIPS=dist python3 scripts/test-kommunale-vertiefung.py
          VERLETZUNG_PAKETE=dist python3 scripts/test-verletzungsrisiko-akte.py

      - name: Skill-Markdown-Bundles bauen (echte Downloads pro Plugin)
        run: |
          # Pro Plugin ein ZIP mit allen SKILL.md, ihren Markdown-Referenzen
          # und dem Plugin-README.
          # Werkstatt und Schnellstart bleiben einzelne Markdown-Downloads.
          # Die Einzel-ZIPs wandern ins Komplettpaket; als Release-Asset wird nur
          # das Sammel-ZIP hochgeladen, damit die Asset-Zahl unter der GitHub-
          # Grenze bleibt.
          mkdir -p dist/skills-markdown
          python3 scripts/build-skills-markdown-bundles.py dist/skills-markdown
          cp dist/skills-markdown/alle-skills-markdown.zip dist/alle-skills-markdown.zip
          ls dist/skills-markdown/*-skills-markdown.zip | wc -l
          ls -lh dist/alle-skills-markdown.zip

      - name: Prompt-Verpackung validieren
        run: python3 scripts/validate-prompt-packaging.py dist .claude-plugin/marketplace.json

      - name: Pluginlokale Testakten-Bundles bauen
        run: |
          # Einige Plugins, insbesondere Gerichtsplugins, haben ihre
          # Demonstrationsakte direkt unter <plugin>/testakte. Diese Akten
          # bekommen eigene Release-Assets fuer echte Direkt-Downloads.
          python3 scripts/build-plugin-testakte-bundles.py dist
          python3 scripts/build-plugin-testakte-einzelpdf-zips.py dist
          python3 scripts/validate-plugin-testakte-assets.py dist
          ls dist/*-testakte.zip | wc -l
          ls -lh dist/alle-pluginlokalen-testakten.zip

      - name: Sammel-ZIPs bauen
        run: |
          # alle-plugins-megazip.zip enthaelt die installierbaren Einzel-ZIPs
          # plus marketplace.json, nicht die Rohordner.
          mkdir -p dist/mega-plugins
          cp dist/marketplace.json dist/mega-plugins/marketplace.json
          for plugin in ${{ steps.plugins.outputs.names }}; do
            cp "dist/${plugin}.zip" "dist/mega-plugins/${plugin}.zip"
          done
          (cd dist/mega-plugins && zip -rq "../alle-plugins-megazip.zip" . -x '*.DS_Store')
          rm -rf dist/mega-plugins

          # alle-testakten.zip wurde im vorherigen Schritt mit demselben
          # Arbeitsakten-Filter gebaut wie die Einzel-Testakten-ZIPs.
          test -s dist/alle-testakten.zip

          # Ein Download mit sämtlichen Einzelpaketen, Marketplace und
          # Übersichten. Sammel-ZIPs bleiben separate Downloads; ihre Pakete
          # werden hier nur einmal und bytegleich eingebettet.
          python3 scripts/build-complete-package.py dist

          test -s dist/alle-plugins-megazip.zip
          test -s dist/alle-testakten.zip
          test -s dist/alle-testakten-einzelpdfs.zip
          test -s dist/alle-skills-markdown.zip
          test -s dist/alle-pluginlokalen-testakten.zip
          test -s dist/alle-pluginlokalen-testakten-einzelpdfs.zip
          test -s dist/alles-komplettpaket.zip
          ls -lh dist/alle-plugins-megazip.zip dist/alle-testakten.zip dist/alle-testakten-einzelpdfs.zip dist/alle-skills-markdown.zip dist/alle-pluginlokalen-testakten.zip dist/alles-komplettpaket.zip

      - name: Checksums erzeugen
        run: python3 scripts/build-release-checksums.py dist

      - name: Fertige Assets nach Haupt- und Begleitrelease aufteilen
        run: python3 scripts/stage-release-assets.py dist release-staging

      - name: Tag bestimmen
        id: tagref
        env:
          REQUESTED_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${REQUESTED_TAG}" >> "$GITHUB_OUTPUT"
          fi

      - name: Beide Releases hochladen, verifizieren und geordnet veröffentlichen
        if: steps.tagref.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.tagref.outputs.tag }}
        run: |
          python3 scripts/publish-release-assets.py release-staging "$RELEASE_TAG" \
            --repo "${{ github.repository }}"

      - name: Artefakte hochladen (immer)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: plugin-zips
          path: |
            dist/*.zip
            dist/*.md
            dist/marketplace.json
            dist/checksums-sha256.txt
            release-staging/*/checksums-sha256.txt
          retention-days: 30
