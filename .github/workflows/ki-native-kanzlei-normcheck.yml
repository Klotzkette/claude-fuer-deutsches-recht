name: KI-native Kanzlei Normcheck

# Ruft die amtlichen Normtexte ab, auf die sich die Skills der KI-nativen Kanzlei stützen,
# und legt den gelesenen Wortlaut als Protokoll und Artefakt ab. Keine Änderung am Repository.

on:
  workflow_dispatch:
  push:
    branches:
      - 'claude/ki-native-kanzlei-**'
    paths:
      - 'scripts/data/ki-native-kanzlei-normcheck.json'
      - 'scripts/ki-native-kanzlei-normcheck.py'
      - '.github/workflows/ki-native-kanzlei-normcheck.yml'

permissions:
  contents: read

jobs:
  normcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: PDF-Leser
        run: python3 -m pip install pypdf
      - name: Erreichbarkeit der Quellen
        run: |
          for u in https://www.gesetze-im-internet.de/rvg/__13.html https://dejure.org/gesetze/RVG/13.html https://www.brak.de/fileadmin/02_fuer_anwaelte/berufsrecht/033-BORA_Stand_01.12.2025.pdf https://eur-lex.europa.eu/legal-content/DE/TXT/HTML/?uri=CELEX:32008R0593; do
            curl -sS -o /dev/null -A "Mozilla/5.0" --max-time 20 -w "%{http_code} %{time_total}s $u\n" "$u" || echo "FEHLER $u"
          done
      - name: Normtexte abrufen
        run: python3 -u scripts/ki-native-kanzlei-normcheck.py scripts/data/ki-native-kanzlei-normcheck.json normcheck.md
      - uses: actions/upload-artifact@v7
        with:
          name: ki-native-kanzlei-normcheck
          path: normcheck.md
          retention-days: 30
