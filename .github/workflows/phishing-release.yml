name: Phishing und Zahlungsdienste zu EuGH C-70/25

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Komponententag phishing-v445.35.4
        required: true
        default: phishing-v445.35.4
      publish:
        description: Geprüfte Pakete zusätzlich veröffentlichen
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: phishing-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TAG: ${{ inputs.tag }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Abhängigkeiten
        run: |
          python3 -m pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer libreoffice-calc poppler-utils fonts-liberation2 fonts-croscore fonts-crosextra-carlito
          sudo install -m 0644 scripts/data/gesellschafterstreit-fontconfig.conf /etc/fonts/conf.d/99-phishing.conf
          fc-cache -f
      - name: Quellen und Testakten prüfen
        run: |
          test "$TAG" = 'phishing-v445.35.4'
          test -s "docs/releases/$TAG.md"
          node scripts/validate-plugin-structure.mjs
          node scripts/validate-marketplace-import.mjs
          python3 scripts/validate-yaml-frontmatter.py
          python3 scripts/test-phishing-release.py
      - name: Office-Unterlagen und Prompts rendern und Pakete prüfen
        run: |
          python3 scripts/build-phishing-release.py --dist "$RUNNER_TEMP/phishing-dist"
          python3 scripts/test-phishing-release.py --dist "$RUNNER_TEMP/phishing-dist"
      - name: Geprüfte Pakete sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phishing-pakete
          path: ${{ runner.temp }}/phishing-dist
          if-no-files-found: ignore
          retention-days: 14
      - name: Release vollständig prüfen und veröffentlichen
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, time
          tag = os.environ['TAG']
          repo = os.environ['GH_REPO']
          sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          def gh(*args):
              return subprocess.check_output(['gh', *args], text=True).strip()
          def object_or_missing(endpoint):
              result = subprocess.run(['gh', 'api', endpoint], text=True, capture_output=True)
              if result.returncode == 0:
                  return json.loads(result.stdout)
              if 'HTTP 404' in result.stderr:
                  return None
              raise RuntimeError(result.stderr)
          if json.loads(gh('api', f'repos/{repo}/git/ref/heads/main'))['object']['sha'] != sha:
              raise RuntimeError('Veröffentlichung nur vom aktuellen main-Stand.')
          previous_latest = json.loads(gh('api', f'repos/{repo}/releases/latest'))['tag_name']
          existing = subprocess.run(['gh', 'release', 'view', tag, '--json', 'databaseId,isDraft'], text=True, capture_output=True)
          if existing.returncode == 0:
              raise RuntimeError('Release oder Entwurfsrelease existiert bereits; keine Assets überschreiben.')
          if 'release not found' not in existing.stderr.lower() and 'HTTP 404' not in existing.stderr:
              raise RuntimeError(existing.stderr)
          endpoint = f'repos/{repo}/git/ref/tags/{tag}'
          ref = object_or_missing(endpoint)
          if ref is None:
              gh('api', '--method', 'POST', f'repos/{repo}/git/refs', '-f', f'ref=refs/tags/{tag}', '-f', f'sha={sha}')
              for delay in (0, 2, 4, 8, 16):
                  if delay:
                      time.sleep(delay)
                  ref = object_or_missing(endpoint)
                  if ref is not None:
                      break
          if ref is None or ref['object']['sha'] != sha:
              raise RuntimeError('Tag fehlt oder verweist auf einen anderen Commit; keine Verschiebung.')
          gh('release', 'create', tag, '--target', sha, '--draft', '--title', 'Phishing und Zahlungsdienste 445.35.4',
             '--notes-file', f'docs/releases/{tag}.md', '--latest=false')
          for delay in (0, 2, 4, 8, 16):
              if delay:
                  time.sleep(delay)
              result = subprocess.run(['gh', 'release', 'view', tag, '--json', 'databaseId,isDraft,tagName'], text=True, capture_output=True)
              release = json.loads(result.stdout) if result.returncode == 0 else None
              if release is not None:
                  break
          if release is None or not release['isDraft'] or release['tagName'] != tag:
              raise RuntimeError('Entwurfsrelease nicht bestätigt; Veröffentlichung gestoppt.')
          from pathlib import Path
          dist = Path(os.environ['RUNNER_TEMP']) / 'phishing-dist'
          gh('release', 'upload', tag, *map(str, sorted(dist.iterdir())))
          subprocess.run(['python3', 'scripts/verify-betreuungsrecht-release.py', tag, str(dist)], check=True)
          if object_or_missing(endpoint)['object']['sha'] != sha:
              raise RuntimeError('Tagzuordnung hat sich verändert.')
          gh('release', 'edit', tag, '--draft=false', '--latest=false')
          published = json.loads(gh('api', f'repos/{repo}/releases/tags/{tag}'))
          import importlib.util
          spec = importlib.util.spec_from_file_location('phishing_release', 'scripts/build-phishing-release.py')
          module = importlib.util.module_from_spec(spec)
          import sys
          sys.path.insert(0, 'scripts')
          spec.loader.exec_module(module)
          expected_count = len(module.asset_names())
          if published['draft'] or published['prerelease'] or len(published['assets']) != expected_count:
              raise RuntimeError('Öffentlicher Releasestatus oder Assetumfang weicht ab.')
          if json.loads(gh('api', f'repos/{repo}/releases/latest'))['tag_name'] != previous_latest:
              raise RuntimeError('Der Komponentenrelease darf das neueste Gesamtrelease nicht ersetzen.')
          print(f'{tag}: {expected_count} Assets bytegenau bestätigt, Tag {sha}, Gesamtrelease unverändert.')
          PY
