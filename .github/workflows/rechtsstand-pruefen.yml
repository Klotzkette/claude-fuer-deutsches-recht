name: Rechtsstand-Rückfälle prüfen

on:
  pull_request:
    paths:
      - '**/*.md'
      - 'scripts/validate-current-law-sentinels.py'
      - 'scripts/test-externe-hinweise.py'
      - 'scripts/generator_cli.py'
      - 'scripts/test-generator-cli.py'
      - 'scripts/generate-*.py'
      - 'scripts/inject-*.py'
      - 'scripts/refine-*.py'
      - '.github/workflows/rechtsstand-pruefen.yml'
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - 'scripts/validate-current-law-sentinels.py'
      - 'scripts/test-externe-hinweise.py'
      - 'scripts/generator_cli.py'
      - 'scripts/test-generator-cli.py'
      - 'scripts/generate-*.py'
      - 'scripts/inject-*.py'
      - 'scripts/refine-*.py'
      - '.github/workflows/rechtsstand-pruefen.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruefen:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fehlermuster und Altjahresabgrenzung testen
        run: python3 scripts/test-externe-hinweise.py
      - name: Generator-Hilfe ohne Dateiveränderung prüfen
        run: python3 scripts/test-generator-cli.py
      - name: Quellenbestand auf bekannte Rückfälle prüfen
        run: python3 scripts/validate-current-law-sentinels.py
