name: GitHub Pages und Markdown-Downloads

on:
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - '**/*-werkstatt.txt'
      - '**/*-schnellstart.txt'
      - '**/*-hauptproblem.txt'
      - 'uebersicht-fachanwaltschaften/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Prepare site and prompt downloads
        shell: bash
        run: |
          mkdir -p _site/downloads
          cp -R uebersicht-fachanwaltschaften/. _site/
          find . \
            \( -path './.git' -o -path './_site' \) -prune -o \
            -type f \( -name '*.md' -o -name '*-werkstatt.txt' -o -name '*-schnellstart.txt' -o -name '*-hauptproblem.txt' \) \
            -exec cp --parents --target-directory=_site/downloads -- {} +
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
