name: Deploy uebersicht-fachanwaltschaften to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - 'uebersicht-fachanwaltschaften/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Prepare site and Markdown downloads
        shell: bash
        run: |
          mkdir -p _site/downloads
          cp -R uebersicht-fachanwaltschaften/. _site/
          while IFS= read -r -d '' file; do
            target="_site/downloads/${file#./}"
            mkdir -p "$(dirname "$target")"
            cp "$file" "$target"
          done < <(find . -type f -name '*.md' -not -path './.git/*' -not -path './_site/*' -print0)
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
