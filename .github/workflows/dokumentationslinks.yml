name: Interne Dokumentationslinks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dokumentationslinks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  navigation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Downloadseite mit erreichbaren und fehlenden Dateien testen
        run: node --test scripts/test-download-page.mjs
      - name: Werkzeuge für Markdown, Word und PDF installieren
        run: python -m pip install PyYAML 'markdown-it-py>=3,<5' 'linkify-it-py>=2,<3' 'python-docx>=1.2,<2' 'pypdf>=6,<7' 'reportlab>=4,<5'
      - name: Skillbeschreibungen in Plugin-READMEs und Detailseiten abgleichen
        run: python scripts/test-skill-overview-text.py
      - name: Schriftstücke, Prüfsummen und Aktenverweise abgleichen
        run: |
          python scripts/test-testakten-schriftstueck-satz.py
          python scripts/test-aktenarbeit-quellen.py
          python scripts/test-aktenbestand.py
          python scripts/aktenarbeit_katalog.py --check
          python scripts/aktenarbeit_einstiege.py --check
      - name: Ziele und Sprungmarken im Repository prüfen
        run: |
          python scripts/validate-readme-navigation.py
          python scripts/validate-testakten-readme-downloads.py
