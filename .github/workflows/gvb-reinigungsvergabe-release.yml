name: GVB Reinigungsvergabe und eigenständige Workflow-Vorlage

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Komponententag gvb-reinigungsvergabe-v1.0.0
        required: true
        default: gvb-reinigungsvergabe-v1.0.0

permissions:
  contents: write

concurrency:
  group: gvb-reinigungsvergabe-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Abhängigkeiten
        run: python3 -m pip install -r requirements.txt
      - name: Quellen und Pakete prüfen
        run: |
          VERSION=$(python3 -c "import json;print(json.load(open('gvb-reinigungsvergabe/.claude-plugin/plugin.json'))['version'])")
          test "gvb-reinigungsvergabe-v$VERSION" = "$TAG"
          test -s "docs/releases/$TAG.md"
          node scripts/validate-plugin-structure.mjs
          node scripts/validate-marketplace-import.mjs
          python3 scripts/validate-yaml-frontmatter.py
          python3 scripts/test-gvb-reinigungsvergabe.py
          python3 scripts/build-gvb-reinigungsvergabe-release.py --dist "$RUNNER_TEMP/gvb-dist"
          python3 scripts/test-gvb-reinigungsvergabe.py --dist "$RUNNER_TEMP/gvb-dist"
      - name: Prüfpakete bei Fehler sichern
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gvb-diagnose
          path: ${{ runner.temp }}/gvb-dist
          if-no-files-found: ignore
          retention-days: 7
      - name: Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release existiert bereits; kein Überschreiben."
            exit 1
          fi
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            echo "Tag existiert bereits; keine nachträgliche Verschiebung."
            exit 1
          fi
          gh release create "$TAG" --target "$(git rev-parse HEAD)" --draft --title "GVB Reinigungsvergabe 1.0.0" --notes-file "docs/releases/$TAG.md" --latest=false
          gh release upload "$TAG" "$RUNNER_TEMP"/gvb-dist/*
          python3 scripts/verify-betreuungsrecht-release.py "$TAG" "$RUNNER_TEMP/gvb-dist"
          gh release edit "$TAG" --draft=false --latest=false
