name: Insolvenzrecht Hauptplugin

on:
  pull_request:
    paths:
      - 'insolvenzrecht/**'
      - 'insolvenzrecht-plugins/**'
      - 'plugin-gruppen/insolvenzrecht/**'
      - 'fachanwalt-insolvenz-sanierungsrecht/**'
      - 'insolvenzverwaltung/**'
      - 'insolvenzsachbearbeitung/**'
      - 'insolvenzverwaltung-berichtsersteller/**'
      - 'scripts/*insolvenzrecht*'
      - 'scripts/data/insolvenzrecht-fachmodule.json'
      - '.claude-plugin/marketplace.json'
      - 'scripts/scoped-release-assets.json'
      - 'references/zitierweise.md'
      - 'references/quellenhygiene.md'
      - 'references/leitentscheidungen-anker.md'
      - 'references/anwalts-dashboard-konvention.md'
      - 'insolvenzplan-starug-planwerkstatt/assets/templates/**'
      - 'quality/evals/insolvenzrecht.json'
      - '.github/workflows/insolvenzrecht-release.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: Zu veröffentlichender Komponententag
        required: true
        default: insolvenzrecht-v445.35.4

permissions:
  contents: read

concurrency:
  group: insolvenzrecht-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prüfwerkzeuge installieren
        run: python3 -m pip install -r requirements.txt
      - name: Quellen, Navigation und Paket prüfen
        run: |
          node scripts/validate-marketplace-import.mjs
          node scripts/validate-plugin-structure.mjs
          python3 scripts/validate-yaml-frontmatter.py
          python3 scripts/validate-runtime-performance.py
          python3 scripts/validate-root-readme-overview.py
          python3 scripts/validate-readme-navigation.py
          python3 scripts/validate-testakten-readme-downloads.py
          python3 scripts/quality_lab.py audit --require-editorial --require-workflow
          python3 scripts/build-insolvenzrecht-fachmodule.py --check
          python3 scripts/test-insolvenzrecht-fachmodule.py
          python3 scripts/test-insolvenzrecht-release.py
          python3 scripts/test-scoped-release-routing.py
          python3 scripts/build-insolvenzrecht-release.py --dist "$RUNNER_TEMP/insolvenzrecht-dist"
          python3 scripts/test-insolvenzrecht-fachmodule.py --dist "$RUNNER_TEMP/insolvenzrecht-dist"
      - uses: actions/upload-artifact@v4
        with:
          name: insolvenzrecht-pakete
          path: ${{ runner.temp }}/insolvenzrecht-dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: check
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: insolvenzrecht-pakete
          path: dist
      - name: Unveränderte Quellen und freien Tag prüfen
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('insolvenzrecht/.claude-plugin/plugin.json'))['version'])")
          test "insolvenzrecht-v$VERSION" = "$TAG"
          test -s "docs/releases/$TAG.md"
          git merge-base --is-ancestor HEAD origin/main
          python3 scripts/build-insolvenzrecht-release.py --dist dist --check
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo 'Release existiert; kein Überschreiben.'
            exit 1
          fi
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            echo 'Tag existiert; keine Verschiebung.'
            exit 1
          fi
      - name: Entwurf hochladen, herunterladen und veröffentlichen
        run: |
          git tag "$TAG" "$(git rev-parse HEAD)"
          TAG_PUSH=$(LC_ALL=C git push --porcelain origin "refs/tags/$TAG:refs/tags/$TAG")
          case "$TAG_PUSH" in
            *"[new tag]"*) ;;
            *) echo 'Tag wurde zwischenzeitlich angelegt; Veröffentlichung abgebrochen.'; exit 1 ;;
          esac
          gh release create "$TAG" --verify-tag --draft --title "Insolvenzrecht $TAG" --notes-file "docs/releases/$TAG.md" --latest=false
          gh release upload "$TAG" dist/*
          python3 scripts/build-insolvenzrecht-release.py --dist dist --verify-release "$TAG"
          gh release edit "$TAG" --draft=false --latest=false
          python3 scripts/build-insolvenzrecht-release.py --dist dist --verify-release "$TAG"
